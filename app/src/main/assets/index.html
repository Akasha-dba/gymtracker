        const sortedMuscles = Object.values(muscleStats).sort((a, b) => b.pct - a.pct || b.effectiveSets - a.effectiveSets);
        const workedCount = sortedMuscles.filter(m => m.pct > 0).length;
        const isPreview = ui.muscleScope.startsWith('preview_');

        const scopes = [];
        if (state.activeWorkout) scopes.push({ id: 'active', label: 'Сейчас' });
        scopes.push({ id: '7d', label: '7 дней' });
        scopes.push({ id: '30d', label: '30 дней' });
        scopes.push({ id: 'all', label: 'Всё время' });
        scopes.push({ id: 'preview_week', label: 'Весь план' });

        let html = `
          <!-- Period Pills -->
          <div class="flex gap-1.5 overflow-x-auto no-scrollbar pb-0.5">
            ${scopes.map(sc => `
              <button type="button" data-scope="${sc.id}" class="scope-btn px-3.5 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition-colors ${ui.muscleScope === sc.id ? 'bg-white text-black' : 'bg-[#14141a] text-[#9b9ba8] border border-[#23232c]'}">
                ${escapeHtml(sc.label)}
              </button>
            `).join('')}
          </div>
        `;

        if (!isPreview && workedCount === 0) {
          html += `
            <div class="p-3.5 rounded-2xl bg-[#14141a] border border-[#24242f] flex items-center justify-between gap-3">
              <div class="text-xs text-[#a5a5b2] leading-snug">
                За выбранный период нет записанных подходов. Посмотрите охват программы или начните тренировку.
              </div>
              <button id="preview-plan-quick-btn" type="button" class="px-3 py-2 rounded-xl bg-amber-500/15 border border-amber-500/35 text-amber-300 text-xs font-semibold shrink-0 active:scale-95">
                Весь план
              </button>
            </div>
          `;
        }

        if (isPreview) {
          html += `
            <div class="flex items-center justify-between gap-2 px-1 overflow-x-auto no-scrollbar">
              <span class="text-[11px] text-amber-300/90 font-medium shrink-0">Охват:</span>
              <div class="flex gap-1">
                <button type="button" data-scope="preview_week" class="scope-btn px-2.5 py-1 rounded-lg text-[11px] font-medium whitespace-nowrap ${ui.muscleScope === 'preview_week' ? 'bg-amber-500 text-black' : 'bg-[#1a1a22] text-[#a5a5b2]'}">
                  Вся неделя
                </button>
                ${state.program.map(d => `
                  <button type="button" data-scope="preview_${d.id}" class="scope-btn px-2.5 py-1 rounded-lg text-[11px] font-medium whitespace-nowrap ${ui.muscleScope === 'preview_' + d.id ? 'bg-amber-500 text-black' : 'bg-[#1a1a22] text-[#a5a5b2]'}">
                    ${escapeHtml(d.name)}
                  </button>
                `).join('')}
              </div>
            </div>
          `;
        }

        // Main Detailed SVG Widget Card
        html += `
          <div class="amoled-card p-4 space-y-3">
            ${buildMuscleSvg({ mode: 'heatmap', muscleStats, selectedKey: ui.selectedMuscle })}

            <div class="pt-2 border-t border-[#1e1e26]">
              <div class="flex items-center justify-between text-[10px] text-[#8e8e98] mb-1.5">
                <span>Отдых (0%)</span>
                <span>Средний объём</span>
                <span>Пик (100%)</span>
              </div>
              <div class="h-2 rounded-full w-full" style="background: linear-gradient(90deg, #1c1d24 0%, #b45309 30%, #f59e0b 55%, #f97316 78%, #ff2d55 100%);"></div>
              <p class="text-[11px] text-[#7c7c88] text-center mt-2">Нажмите на любую зону (верх/середина груди, 3 пучка дельт, широчайшие, ромбовидные, поясница и др.)</p>
            </div>
          </div>
        `;

        // Selected Muscle Detail Drawer
        if (ui.selectedMuscle && muscleStats[ui.selectedMuscle]) {
          const ms = muscleStats[ui.selectedMuscle];
          const col = getMuscleColor(ms.pct);
          const exEntries = Object.entries(ms.exercises);
          html += `
            <div class="amoled-card p-4 border-white/25 space-y-3">
              <div class="flex items-center justify-between gap-2">
                <div class="flex items-center gap-2.5 min-w-0">
                  <span class="w-3 h-3 rounded-full shrink-0" style="background:${col.fill}"></span>
                  <div class="min-w-0">
                    <h3 class="text-base font-bold truncate">${escapeHtml(ms.name)}</h3>
                    <div class="text-[10px] text-[#8e8e98]">Группа: ${escapeHtml(ms.group)}</div>
                  </div>
                </div>
                <span class="text-xs font-semibold px-2.5 py-1 rounded-full bg-[#1d1d26] shrink-0" style="color:${ms.pct > 0 ? col.fill : '#8e8e98'}">
                  ${ms.pct}% • ${col.label}
                </span>
              </div>
              <div class="grid grid-cols-2 gap-2.5">
                <div class="amoled-elevated p-3">
                  <div class="text-[11px] text-[#8e8e98]">Эффект. подходов</div>
                  <div class="text-base font-bold tabular-nums mt-0.5">${ms.effectiveSets.toFixed(1)}</div>
                </div>
                <div class="amoled-elevated p-3">
                  <div class="text-[11px] text-[#8e8e98]">Объём (тоннаж)</div>
                  <div class="text-base font-bold tabular-nums mt-0.5">${ms.tonnage.toLocaleString('ru-RU')} кг</div>
                </div>
              </div>
              ${exEntries.length ? `
                <div class="space-y-1.5 pt-1 border-t border-[#1e1e26]">
                  <div class="text-[11px] text-[#8e8e98] uppercase tracking-wider">Упражнения</div>
                  ${exEntries.map(([exName, info]) => `
                    <div class="flex items-center justify-between text-xs py-1">
                      <span class="text-[#d8d8e0] truncate pr-2">${escapeHtml(exName)}</span>
                      <span class="text-[#8e8e98] shrink-0 tabular-nums">${info.sets} подх. (${info.role})</span>
                    </div>
                  `).join('')}
                </div>
              ` : `<p class="text-xs text-[#7c7c88]">Эта мышца не получала нагрузку за выбранный период.</p>`}
            </div>
          `;
        }

        // Compact Muscle Ranking List
        html += `
          <div class="amoled-card p-4 space-y-2.5">
            <div class="flex items-center justify-between">
              <h3 class="text-xs uppercase tracking-wider text-[#8e8e98] font-semibold">Детализация по всем мышцам</h3>
              <span class="text-xs text-[#8e8e98] tabular-nums">${workedCount} из ${sortedMuscles.length}</span>
            </div>
            <div class="space-y-2">
              ${sortedMuscles.map(m => {
                const c = getMuscleColor(m.pct);
                const isSel = ui.selectedMuscle === m.key;
                return `
                  <button type="button" data-muscle="${m.key}" class="muscle-list-btn w-full text-left p-2.5 rounded-xl transition-colors ${isSel ? 'bg-[#1f1f29] border border-white/25' : 'bg-[#16161d] border border-transparent'}">
                    <div class="flex items-center justify-between text-xs mb-1.5 gap-2">
                      <span class="font-medium truncate ${m.pct > 0 ? 'text-white' : 'text-[#7c7c88]'}">${escapeHtml(m.name)}</span>
                      <span class="tabular-nums text-[11px] shrink-0 ${m.pct > 0 ? 'text-[#d4d4dc]' : 'text-[#62626d]'}">${m.effectiveSets.toFixed(1)} подх. • ${m.pct}%</span>
                    </div>
                    <div class="w-full h-1.5 rounded-full bg-[#24242e] overflow-hidden">
                      <div class="h-full rounded-full transition-all duration-300" style="width:${m.pct}%; background:${c.fill}"></div>
                    </div>
                  </button>
                `;
              }).join('')}
            </div>
          </div>
        `;

        root.innerHTML = html;

        root.querySelectorAll('.scope-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            ui.muscleScope = btn.dataset.scope;
            render();
          });
        });
        const prevQuick = document.getElementById('preview-plan-quick-btn');
        if (prevQuick) {
          prevQuick.addEventListener('click', () => {
            ui.muscleScope = 'preview_week';
            render();
          });
        }
        root.querySelectorAll('[data-muscle]').forEach(el => {
          el.addEventListener('click', () => {
            const key = el.dataset.muscle;
            ui.selectedMuscle = ui.selectedMuscle === key ? null : key;
            render();
          });
        });
      }

      // ============================================================
      // 14. RENDERING: TAB 3 — CALENDAR, HISTORY & STATISTICS
      // ============================================================
      function destroyCharts() {
        Object.keys(charts).forEach(k => {
          if (charts[k]) {
            charts[k].destroy();
            charts[k] = null;
          }
        });
      }

      function renderHistoryTab(root) {
        document.getElementById('header-title').textContent = 'Календарь и статистика';
        document.getElementById('header-subtitle').textContent = `Записано тренировок: ${state.history.length}`;
        document.getElementById('header-right').innerHTML = '';

        const totalWorkouts = state.history.length;
        const totalTonnage = state.history.reduce((a, w) => a + (Number(w.tonnage) || 0), 0);
        const totalSets = state.history.reduce((a, w) => a + (Number(w.doneSets) || 0), 0);
        const avgDurMin = totalWorkouts
          ? Math.round(state.history.reduce((a, w) => a + (Number(w.durationSec) || 0), 0) / totalWorkouts / 60)
          : 0;

        const monthNames = ['Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь', 'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'];
        const firstDay = new Date(ui.calYear, ui.calMonth, 1);
        const daysInMonth = new Date(ui.calYear, ui.calMonth + 1, 0).getDate();
        const startOffset = (firstDay.getDay() + 6) % 7;
        const todayIso = formatDateISO(new Date());

        const workoutsByDate = {};
        state.history.forEach(w => {
          if (!workoutsByDate[w.date]) workoutsByDate[w.date] = [];
          workoutsByDate[w.date].push(w);
        });

        let calCells = '';
        for (let i = 0; i < startOffset; i++) {
          calCells += `<div class="h-10"></div>`;
        }
        for (let d = 1; d <= daysInMonth; d++) {
          const iso = `${ui.calYear}-${String(ui.calMonth + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
          const list = workoutsByDate[iso] || [];
          const isToday = iso === todayIso;
          const isSel = iso === ui.selectedDate;
          const hasWk = list.length > 0;
          const cellStyle = isSel
            ? 'bg-white text-black font-bold shadow-md'
            : hasWk
              ? 'bg-emerald-500/15 text-emerald-300 font-semibold border border-emerald-500/35'
              : isToday
                ? 'bg-[#1d1d26] text-white font-semibold border border-white/25'
                : 'text-[#b8b8c4] hover:bg-[#1a1a22]';
          calCells += `
            <button type="button" data-cal-date="${iso}" class="cal-day-btn h-10 rounded-xl flex flex-col items-center justify-center relative transition-colors ${cellStyle}">
              <span class="text-xs leading-none tabular-nums">${d}</span>
              ${hasWk ? `
                <div class="flex gap-0.5 mt-1">
                  ${list.slice(0, 3).map(w => `<span class="w-1.5 h-1.5 rounded-full" style="background:${isSel ? '#000' : (w.dayColor || '#30d158')}"></span>`).join('')}
                </div>
              ` : ''}
            </button>
          `;
        }

        const selectedWorkouts = workoutsByDate[ui.selectedDate] || [];

        const loggedExNames = Array.from(new Set(
          state.history.flatMap(w => (w.exercises || []).filter(e => e.sets.some(s => s.done)).map(e => e.name))
        ));
        if (!ui.selectedStatExercise && loggedExNames.length) {
          ui.selectedStatExercise = loggedExNames[0];
        } else if (ui.selectedStatExercise && !loggedExNames.includes(ui.selectedStatExercise)) {
          ui.selectedStatExercise = loggedExNames[0] || '';
        }

        const monthCalStats = computeMonthStats(ui.calYear, ui.calMonth);
        const totalRepsAll = state.history.reduce((a, w) => a + calcWorkoutTotals(w).doneReps, 0);

        let html = `
          <!-- Interactive Calendar Card -->
          <div class="amoled-card p-4 space-y-3">
            <div class="flex items-center justify-between">
              <button id="cal-prev-btn" type="button" class="w-9 h-9 rounded-xl bg-[#191921] flex items-center justify-center text-[#c0c0cc] active:scale-95">
                <i data-lucide="chevron-left" class="w-4 h-4"></i>
              </button>
              <div class="text-center">
                <div class="text-sm font-semibold">${monthNames[ui.calMonth]} ${ui.calYear}</div>
                <div class="text-[10px] text-emerald-400 font-medium">В зале: ${monthCalStats.visits} раз • ${monthCalStats.tonnage.toLocaleString('ru-RU')} кг</div>
              </div>
              <button id="cal-next-btn" type="button" class="w-9 h-9 rounded-xl bg-[#191921] flex items-center justify-center text-[#c0c0cc] active:scale-95">
                <i data-lucide="chevron-right" class="w-4 h-4"></i>
              </button>
            </div>
            <div class="grid grid-cols-7 gap-1 text-center text-[10px] uppercase text-[#6e6e7a] font-medium">
              <div>Пн</div><div>Вт</div><div>Ср</div><div>Чт</div><div>Пт</div><div>Сб</div><div>Вс</div>
            </div>
            <div class="grid grid-cols-7 gap-1">
              ${calCells}
            </div>

            <!-- Selected Date Interactive Panel -->
            <div class="pt-3 border-t border-[#1e1e26] space-y-3">
              <div class="flex items-center justify-between">
                <div class="text-xs font-semibold text-white">${ui.selectedDate === todayIso ? 'Сегодня • ' : ''}${formatDateRu(ui.selectedDate)}</div>
                ${selectedWorkouts.length ? `<span class="text-[10px] px-2 py-0.5 rounded-full bg-emerald-500/15 text-emerald-400 font-medium">${selectedWorkouts.length} трен.</span>` : ''}
              </div>

              ${selectedWorkouts.length ? `
                <div class="space-y-2">
                  ${selectedWorkouts.map(w => renderWorkoutHistoryItem(w, true)).join('')}
                </div>
              ` : `
                <p class="text-xs text-[#8e8e98]">Выберите день из плана или соберите тренировку на эту дату:</p>
              `}

              <div class="space-y-2 pt-1">
                <div class="grid grid-cols-2 gap-2">
                  ${state.program.map(d => `
                    <button type="button" data-cal-start="${d.id}" class="cal-start-day-btn py-2.5 px-3 rounded-xl bg-[#181822] border border-[#2a2a36] text-xs font-semibold text-white flex items-center justify-center gap-1.5 active:scale-95">
                      <span class="w-2 h-2 rounded-full shrink-0" style="background:${d.color || '#30d158'}"></span>
                      <span class="truncate">${escapeHtml(d.name)}</span>
                    </button>
                  `).join('')}
                </div>
                <button id="cal-start-custom-btn" type="button" class="w-full py-2.5 rounded-xl bg-[#15151d] border border-dashed border-[#343444] text-xs font-semibold text-purple-300 flex items-center justify-center gap-1.5 active:scale-[0.98]">
                  <i data-lucide="plus" class="w-3.5 h-3.5"></i> Собрать свою тренировку на этот день
                </button>
              </div>
            </div>
          </div>

          <!-- KPI Summary (All Time) -->
          <div class="grid grid-cols-2 gap-2.5">
            <div class="amoled-card p-3.5">
              <div class="text-[11px] text-[#8e8e98]">Всего тренировок</div>
              <div class="text-xl font-bold tabular-nums mt-0.5">${totalWorkouts}</div>
            </div>
            <div class="amoled-card p-3.5">
              <div class="text-[11px] text-[#8e8e98]">Общий тоннаж</div>
              <div class="text-xl font-bold tabular-nums mt-0.5">${totalTonnage >= 10000 ? (totalTonnage / 1000).toFixed(1) + ' т' : totalTonnage.toLocaleString('ru-RU') + ' кг'}</div>
            </div>
            <div class="amoled-card p-3.5">
              <div class="text-[11px] text-[#8e8e98]">Подходов / Повт.</div>
              <div class="text-lg font-bold tabular-nums text-emerald-400 mt-0.5">${totalSets} <span class="text-xs font-normal text-[#8e8e98]">/ ${totalRepsAll}</span></div>
            </div>
            <div class="amoled-card p-3.5">
              <div class="text-[11px] text-[#8e8e98]">Ср. длительность</div>
              <div class="text-xl font-bold tabular-nums mt-0.5">${avgDurMin} мин</div>
            </div>
          </div>

          <!-- Charts -->
          <div class="amoled-card p-4 space-y-3">
            <h3 class="text-xs uppercase tracking-wider text-[#8e8e98] font-semibold">Объём тренировок (тоннаж, кг)</h3>
            ${totalWorkouts > 0 ? `
              <div class="relative h-52 w-full">
                <canvas id="volume-chart"></canvas>
              </div>
            ` : `<p class="text-xs text-[#6e6e7a] py-6 text-center">Завершите первую тренировку, чтобы увидеть график объёма.</p>`}
          </div>

          <div class="amoled-card p-4 space-y-3">
            <div class="flex items-center justify-between gap-2">
              <h3 class="text-xs uppercase tracking-wider text-[#8e8e98] font-semibold">Прогресс веса</h3>
              ${loggedExNames.length ? `
                <select id="stat-ex-select" class="max-w-[190px] truncate rounded-xl bg-[#191922] border border-[#2a2a35] px-2.5 py-1.5 text-xs text-white focus:outline-none">
                  ${loggedExNames.map(n => `<option value="${escapeHtml(n)}" ${n === ui.selectedStatExercise ? 'selected' : ''}>${escapeHtml(n)}</option>`).join('')}
                </select>
              ` : ''}
            </div>
            ${loggedExNames.length ? `
              <div class="relative h-52 w-full">
                <canvas id="progress-chart"></canvas>
              </div>
            ` : `<p class="text-xs text-[#6e6e7a] py-6 text-center">График прогрессии рабочих весов появится после первой записи.</p>`}
          </div>

          <!-- Full History List -->
          <div class="amoled-card p-4 space-y-3">
            <h3 class="text-xs uppercase tracking-wider text-[#8e8e98] font-semibold">Все тренировки</h3>
            ${state.history.length ? `
              <div class="space-y-2.5">
                ${state.history.map(w => renderWorkoutHistoryItem(w, false)).join('')}
              </div>
            ` : `<p class="text-xs text-[#6e6e7a]">История пока пуста.</p>`}
          </div>
        `;

        root.innerHTML = html;

        document.getElementById('cal-prev-btn').addEventListener('click', () => {
          ui.calMonth--;
          if (ui.calMonth < 0) { ui.calMonth = 11; ui.calYear--; }
          render();
        });
        document.getElementById('cal-next-btn').addEventListener('click', () => {
          ui.calMonth++;
          if (ui.calMonth > 11) { ui.calMonth = 0; ui.calYear++; }
          render();
        });
        root.querySelectorAll('.cal-day-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            ui.selectedDate = btn.dataset.calDate;
            render();
          });
        });
        root.querySelectorAll('.cal-start-day-btn').forEach(btn => {
          btn.addEventListener('click', () => startWorkout(btn.dataset.calStart, ui.selectedDate));
        });
        const calCustomBtn = document.getElementById('cal-start-custom-btn');
        if (calCustomBtn) {
          calCustomBtn.addEventListener('click', () => startCustomWorkout(ui.selectedDate));
        }
        root.querySelectorAll('.edit-hist-btn').forEach(btn => {
          btn.addEventListener('click', () => editHistoryWorkout(btn.dataset.editHist));
        });
        root.querySelectorAll('.toggle-hist-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            const id = btn.dataset.histId;
            ui.expandedHistory[id] = !ui.expandedHistory[id];
            render();
          });
        });
        root.querySelectorAll('.delete-hist-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            const id = btn.dataset.deleteHist;
            openModal('Удалить запись?', `
              <p class="text-sm text-[#a8a8b3]">Тренировка будет удалена из истории, статистики и карты мышц.</p>
              <div class="flex gap-2.5 pt-2">
                <button id="dh-cancel" type="button" class="flex-1 py-3 rounded-2xl bg-[#22222b] text-sm">Отмена</button>
                <button id="dh-confirm" type="button" class="flex-1 py-3 rounded-2xl bg-red-500/20 border border-red-500/40 text-red-300 font-semibold text-sm">Удалить</button>
              </div>
            `);
            document.getElementById('dh-cancel').addEventListener('click', closeModal);
            document.getElementById('dh-confirm').addEventListener('click', () => {
              state.history = state.history.filter(w => w.id !== id);
              saveState();
              closeModal();
              render();
              showToast('Тренировка удалена');
            });
          });
        });

        const exSel = document.getElementById('stat-ex-select');
        if (exSel) {
          exSel.addEventListener('change', () => {
            ui.selectedStatExercise = exSel.value;
            renderHistoryCharts();
          });
        }

        renderHistoryCharts();
      }

      function renderWorkoutHistoryItem(w, forceOpen) {
        const isOpen = forceOpen || !!ui.expandedHistory[w.id];
        return `
          <div class="rounded-2xl bg-[#16161d] border border-[#23232c] overflow-hidden">
            <div class="p-3 flex items-center justify-between gap-2">
              <button type="button" data-hist-id="${w.id}" class="toggle-hist-btn flex-1 text-left flex items-center gap-2.5 min-w-0">
                <span class="w-2.5 h-2.5 rounded-full shrink-0" style="background:${w.dayColor || '#30d158'}"></span>
                <div class="min-w-0">
                  <div class="text-sm font-semibold truncate">${escapeHtml(w.dayName)}</div>
                  <div class="text-[11px] text-[#8e8e98] tabular-nums">${formatDateRu(w.date)} • ${w.doneSets || 0} подх. • ${(w.tonnage || 0).toLocaleString('ru-RU')} кг • ${Math.max(1, Math.round((w.durationSec || 0) / 60))} мин</div>
                </div>
              </button>
              <div class="flex items-center gap-1 shrink-0">
                <button type="button" data-edit-hist="${w.id}" class="edit-hist-btn w-8 h-8 rounded-xl bg-[#1e1e27] flex items-center justify-center text-emerald-400 active:scale-95" title="Редактировать">
                  <i data-lucide="pencil" class="w-3.5 h-3.5"></i>
                </button>
                <button type="button" data-delete-hist="${w.id}" class="delete-hist-btn w-8 h-8 rounded-xl bg-[#1e1e27] flex items-center justify-center text-[#7c7c88] hover:text-red-400 active:scale-95" title="Удалить">
                  <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                </button>
              </div>
            </div>
            ${isOpen ? `
              <div class="px-3 pb-3 pt-2 border-t border-[#22222c] space-y-2">
                ${w.note ? `<div class="text-xs italic text-[#a5a5b2]">«${escapeHtml(w.note)}»</div>` : ''}
                ${(w.exercises || []).map(ex => {
                  const doneWarmup = (ex.sets || []).filter(s => s.done && s.isWarmup);
                  const doneWork = (ex.sets || []).filter(s => s.done && !s.isWarmup);
                  if (!doneWarmup.length && !doneWork.length) return '';
                  return `
                    <div class="text-xs">
                      <div class="font-medium text-[#e0e0e8]">${escapeHtml(ex.name)}</div>
                      <div class="text-[#8e8e98] tabular-nums mt-0.5 flex flex-wrap gap-x-2 gap-y-0.5">
                        ${doneWarmup.length ? `<span class="text-amber-400/80">Р: ${doneWarmup.map(s => `${s.weight}кг×${s.reps}`).join(', ')}</span>` : ''}
                        ${doneWork.length ? `<span>${doneWork.map(s => `${s.weight}кг×${s.reps}`).join(' / ')}</span>` : ''}
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>
            ` : ''}
          </div>
        `;
      }

      function renderHistoryCharts() {
        destroyCharts();
        if (!window.Chart || !state.history.length) return;

        const volCanvas = document.getElementById('volume-chart');
        if (volCanvas) {
          const recent = state.history.slice(0, 12).reverse();
          charts.volume = new Chart(volCanvas.getContext('2d'), {
            type: 'bar',
            data: {
              labels: recent.map(w => formatDateRu(w.date).slice(0, 6)),
              datasets: [{
                label: 'Тоннаж (кг)',
                data: recent.map(w => w.tonnage || 0),
                backgroundColor: recent.map(w => w.dayColor || '#30d158'),
                borderRadius: 8,
                maxBarThickness: 28
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: { legend: { display: false } },
              scales: {
                x: { grid: { display: false }, ticks: { color: '#8e8e98', font: { size: 10 } } },
                y: { grid: { color: '#1f1f27' }, ticks: { color: '#8e8e98', font: { size: 10 } }, beginAtZero: true }
              }
            }
          });
        }

        const progCanvas = document.getElementById('progress-chart');
        if (progCanvas && ui.selectedStatExercise) {
          const points = [];
          state.history.slice().reverse().forEach(w => {
            const ex = (w.exercises || []).find(e => e.name === ui.selectedStatExercise);
            if (!ex) return;
            const done = (ex.sets || []).filter(s => s.done && !s.isWarmup);
            if (!done.length) return;
            const maxW = Math.max(...done.map(s => Number(s.weight) || 0));
            points.push({ label: formatDateRu(w.date).slice(0, 6), val: maxW });
          });

          charts.progress = new Chart(progCanvas.getContext('2d'), {
            type: 'line',
            data: {
              labels: points.map(p => p.label),
              datasets: [{
                label: 'Макс. вес (кг)',
                data: points.map(p => p.val),
                borderColor: '#0a84ff',
                backgroundColor: 'rgba(10,132,255,0.16)',
                fill: true,
                tension: 0.3,
                pointRadius: 4,
                pointBackgroundColor: '#0a84ff'
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: { legend: { display: false } },
              scales: {
                x: { grid: { display: false }, ticks: { color: '#8e8e98', font: { size: 10 } } },
                y: { grid: { color: '#1f1f27' }, ticks: { color: '#8e8e98', font: { size: 10 } } }
              }
            }
          });
        }
      }

      function renderProfileTab(root) {
        const titles = {

        };
        const [t, sub] = titles[ui.profileSubtab] || titles.program;
        document.getElementById('header-title').textContent = t;
        document.getElementById('header-subtitle').textContent = sub;
        document.getElementById('header-right').innerHTML = '';

        let html = `
          <!-- 3-Way Subtab Switcher -->
          <div class="grid grid-cols-3 gap-1 p-1 rounded-2xl bg-[#131318] border border-[#22222b]">
            <button type="button" data-subtab="program" class="subtab-btn py-2.5 rounded-xl text-xs font-semibold transition-colors ${ui.profileSubtab === 'program' ? 'bg-white text-black' : 'text-[#8e8e98]'}">
              План
            </button>
            <button type="button" data-subtab="database" class="subtab-btn py-2.5 rounded-xl text-xs font-semibold transition-colors ${ui.profileSubtab === 'database' ? 'bg-white text-black' : 'text-[#8e8e98]'}">
              База (${EXERCISE_DB.length})
            </button>
            <button type="button" data-subtab="body" class="subtab-btn py-2.5 rounded-xl text-xs font-semibold transition-colors ${ui.profileSubtab === 'body' ? 'bg-white text-black' : 'text-[#8e8e98]'}">
              Тело / Настр.
            </button>
          </div>
        `;

        if (ui.profileSubtab === 'program') {
          html += renderProgramEditorHtml();
        } else if (ui.profileSubtab === 'database') {
          html += renderExerciseDatabaseTabHtml();
        } else {
          html += renderBodyProfileHtml();
        }

        root.innerHTML = html;

        root.querySelectorAll('.subtab-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            ui.profileSubtab = btn.dataset.subtab;

      function bindProgramEditorEvents(root) {
        document.getElementById('open-plan-templates-btn').addEventListener('click', openPlanTemplatesModal);

        root.querySelectorAll('.move-ex-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            const [dIdx, eIdx, dir] = btn.dataset.moveEx.split(':').map(Number);
            const list = state.program[dIdx].exercises;
            const target = eIdx + dir;
            if (target < 0 || target >= list.length) return;
            const tmp = list[eIdx];
            list[eIdx] = list[target];
            list[target] = tmp;
            saveState();
            render();
          });
        });

        root.querySelectorAll('.edit-ex-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            const [dIdx, eIdx] = btn.dataset.editEx.split(':').map(Number);
            openExerciseConfigModal({ mode: 'program_edit', dayIdx: dIdx, exIdx: eIdx });
          });
        });

        root.querySelectorAll('.add-ex-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            openExerciseConfigModal({ mode: 'program_add', dayIdx: Number(btn.dataset.addEx) });
          });
        });

        root.querySelectorAll('.edit-day-btn').forEach(btn => {
          btn.addEventListener('click', () => openDayEditorModal(Number(btn.dataset.editDay)));
        });

        root.querySelectorAll('.del-day-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            const dIdx = Number(btn.dataset.delDay);
            const day = state.program[dIdx];
            openModal(`Удалить «${day.name}»?`, `
              <p class="text-sm text-[#a8a8b3]">День будет удалён из текущей программы (прошлые тренировки в истории сохранятся).</p>

                <button id="dd-cancel" type="button" class="flex-1 py-3 rounded-2xl bg-[#22222b] text-sm">Отмена</button>
                <button id="dd-confirm" type="button" class="flex-1 py-3 rounded-2xl bg-red-500/20 border border-red-500/40 text-red-300 font-semibold text-sm">Удалить</button>
              </div>
            `);
            document.getElementById('dd-cancel').addEventListener('click', closeModal);
            document.getElementById('dd-confirm').addEventListener('click', () => {
              state.program.splice(dIdx, 1);
              saveState();
              closeModal();
              render();
              showToast('День удалён');
            });
          });
        });

        document.getElementById('add-day-btn').addEventListener('click', () => openDayEditorModal(null));
      }

      function openDayEditorModal(dayIdx) {
        const isNew = dayIdx === null;
        const day = isNew
          ? { id: uid('day'), name: `День ${state.program.length + 1}`, subtitle: 'Пользовательский день', color: DAY_COLORS[state.program.length % DAY_COLORS.length], exercises: [] }
          : state.program[dayIdx];

        openModal(isNew ? 'Новый тренировочный день' : 'Редактировать день', `
          <div class="space-y-3.5">
            <div>
              <label class="block text-xs text-[#8e8e98] mb-1">Название</label>
              <input id="day-name-inp" type="text" value="${escapeHtml(day.name)}" class="w-full rounded-xl bg-[#0c0c10] border border-[#2a2a35] px-3 py-2.5 text-sm text-white focus:outline-none focus:border-emerald-500" />
            </div>
            <div>
              <label class="block text-xs text-[#8e8e98] mb-1">Описание / акцент</label>
              <input id="day-sub-inp" type="text" value="${escapeHtml(day.subtitle || '')}" class="w-full rounded-xl bg-[#0c0c10] border border-[#2a2a35] px-3 py-2.5 text-sm text-white focus:outline-none focus:border-emerald-500" />
            </div>
            <div>
              <label class="block text-xs text-[#8e8e98] mb-1.5">Цвет в календаре</label>
              <div class="flex gap-2.5">
                ${DAY_COLORS.map(c => `
                  <button type="button" data-pick-color="${c}" class="pick-color-btn w-8 h-8 rounded-full border-2 ${day.color === c ? 'border-white scale-110' : 'border-transparent'}" style="background:${c}"></button>
                `).join('')}
              </div>
            </div>
            <button id="save-day-btn" type="button" class="w-full py-3 rounded-2xl bg-emerald-500 text-black font-semibold text-sm mt-2">Сохранить</button>
          </div>
        `);

        let chosenColor = day.color;
        document.querySelectorAll('.pick-color-btn').forEach(b => {
          b.addEventListener('click', () => {
            chosenColor = b.dataset.pickColor;
            document.querySelectorAll('.pick-color-btn').forEach(x => {
              x.classList.toggle('border-white', x === b);
              x.classList.toggle('scale-110', x === b);
              x.classList.toggle('border-transparent', x !== b);
            });
          });
        });

        document.getElementById('save-day-btn').addEventListener('click', () => {
          const name = (document.getElementById('day-name-inp').value || '').trim();
          if (!name) { showToast('Введите название дня', 'error'); return; }
          const sub = (document.getElementById('day-sub-inp').value || '').trim();
          if (isNew) {
            state.program.push(Object.assign({}, day, { name, subtitle: sub, color: chosenColor }));
          } else {
            state.program[dayIdx].name = name;
            state.program[dayIdx].subtitle = sub;
            state.program[dayIdx].color = chosenColor;
          }
          saveState();
          closeModal();
          render();
          showToast('Программа обновлена');
        });
      }

                  ${buildMuscleSvg({
                    mode: 'picker',
                    primarySet: new Set(item.primary),
                    secondarySet: new Set(item.secondary),
                    compact: true
                  })}
                  <div class="flex items-center justify-center gap-4 text-[10px] pt-1 border-t border-[#1e1e26]">
                    <span class="flex items-center gap-1 text-emerald-300"><span class="w-2.5 h-2.5 rounded-full bg-emerald-500"></span> Основные</span>
                    <span class="flex items-center gap-1 text-blue-300"><span class="w-2.5 h-2.5 rounded-full bg-blue-500"></span> Вспомогательные</span>
                  </div>
                </div>

                <div class="p-3.5 rounded-2xl bg-[#151917] border border-emerald-500/25 space-y-1.5">
                  <div class="text-xs font-semibold text-emerald-400">Техника выполнения</div>
                  <p class="text-xs text-[#d4d4dc] leading-relaxed">${escapeHtml(item.technique)}</p>
                </div>

                <div class="space-y-1.5">
                  <div class="text-[11px] uppercase tracking-wider text-[#8e8e98] font-semibold">Добавить в день программы</div>
                  <div class="grid grid-cols-2 gap-2">
                    ${state.program.map((d, dIdx) => `
                      <button type="button" data-db-add-day="${dIdx}" class="db-add-day-btn py-2.5 px-3 rounded-xl bg-emerald-500/15 border border-emerald-500/35 text-xs font-semibold text-emerald-300 truncate active:scale-95">
                        + ${escapeHtml(d.name)}
                      </button>
                    `).join('')}
                  </div>
                </div>
              </div>
            `);
            document.querySelectorAll('.db-add-day-btn').forEach(b => {
              b.addEventListener('click', () => {
                const dIdx = Number(b.dataset.dbAddDay);
                state.program[dIdx].exercises.push({
                  id: uid('ex'),
                  dbId: item.id,
                  name: item.name,
                  sets: item.sets,
                  reps: item.reps,
                  defaultWeight: item.defaultWeight,
                  restSec: item.restSec,
                  note: item.technique,
                  primary: item.primary.slice(),
                  secondary: item.secondary.slice()
                });
                saveState();
                closeModal();
                showToast(`Добавлено в «${state.program[dIdx].name}»`);
              });
            });
          });
        });
      }

      // ============================================================
      // BODY PROFILE + REST NOTIFICATIONS SETTINGS + JSON BACKUP
      // ============================================================
      function renderBodyProfileHtml() {
        const p = state.profile;
        const hM = (Number(p.height) || 0) / 100;
        const wKg = Number(p.weight) || 0;
        const bmi = (hM > 0 && wKg > 0) ? (wKg / (hM * hM)) : null;
        let bmiLabel = '—';
        let bmiColor = 'text-[#8e8e98]';
        if (bmi) {
          if (bmi < 18.5) { bmiLabel = 'Дефицит'; bmiColor = 'text-blue-400'; }
          else if (bmi < 25) { bmiLabel = 'Норма'; bmiColor = 'text-emerald-400'; }
          else if (bmi < 30) { bmiLabel = 'Выше нормы'; bmiColor = 'text-amber-400'; }
          else { bmiLabel = 'Высокий'; bmiColor = 'text-red-400'; }
        }

        const log = Array.isArray(p.weightLog) ? p.weightLog : [];
        const notifPerm = canUseSystemNotifications() ? Notification.permission : 'unsupported';

        return `
          <div class="space-y-3.5">
            <!-- Rest Timer Notifications Card -->
            <div class="amoled-card p-4 space-y-3">
              <div class="flex items-center justify-between">
                <h3 class="text-xs uppercase tracking-wider text-[#8e8e98] font-semibold">Уведомления таймера отдыха</h3>
                <span class="text-[11px] font-semibold ${notifPerm === 'granted' ? 'text-emerald-400' : 'text-amber-400'}">
                  ${notifPerm === 'granted' ? 'Разрешены' : notifPerm === 'denied' ? 'Заблокированы' : 'Не включены'}
                </span>
              </div>
              <p class="text-xs text-[#9b9ba8] leading-relaxed">
                Приложение отправляет уведомление о запуске таймера отдыха, напоминание за 30 и 10 секунд до конца, и сигнал об окончании отдыха.
              </p>
              <div class="flex gap-2">
                <button id="enable-notif-btn" type="button" class="flex-1 py-2.5 rounded-xl bg-emerald-500 text-black text-xs font-bold active:scale-95">
                  ${notifPerm === 'granted' ? 'Проверить уведомление' : 'Включить уведомления'}
                </button>
              </div>
            </div>

            <!-- Core Anthropometrics -->
            <div class="amoled-card p-4 space-y-3.5">
              <div class="flex items-center justify-between">
                <h3 class="text-xs uppercase tracking-wider text-[#8e8e98] font-semibold">Антропометрия</h3>
                ${bmi ? `<span class="text-xs font-semibold ${bmiColor}">ИМТ ${bmi.toFixed(1)} • ${bmiLabel}</span>` : ''}
              </div>
              <div class="grid grid-cols-2 gap-2.5">
                <div>
                  <label class="block text-[11px] text-[#8e8e98] mb-1">Вес (кг)</label>
                  <input id="prof-weight" type="number" step="0.1" min="20" max="300" value="${escapeHtml(p.weight)}" class="w-full rounded-xl bg-[#0c0c10] border border-[#2a2a35] px-3 py-2.5 text-base font-bold text-white tabular-nums focus:outline-none focus:border-emerald-500" />
                </div>
                <div>
                  <label class="block text-[11px] text-[#8e8e98] mb-1">Рост (см)</label>
                  <input id="prof-height" type="number" step="1" min="100" max="250" value="${escapeHtml(p.height)}" class="w-full rounded-xl bg-[#0c0c10] border border-[#2a2a35] px-3 py-2.5 text-base font-bold text-white tabular-nums focus:outline-none focus:border-emerald-500" />
                </div>
                <div>
                  <label class="block text-[11px] text-[#8e8e98] mb-1">Возраст (лет)</label>
                  <input id="prof-age" type="number" step="1" min="10" max="110" placeholder="Укажите" value="${escapeHtml(p.age)}" class="w-full rounded-xl bg-[#0c0c10] border border-[#2a2a35] px-3 py-2.5 text-base font-bold text-white tabular-nums focus:outline-none focus:border-emerald-500" />
                </div>
                <div>
                  <label class="block text-[11px] text-[#8e8e98] mb-1">Талия (см, опц.)</label>
                  <input id="prof-waist" type="number" step="0.5" min="40" max="200" placeholder="—" value="${escapeHtml(p.waist)}" class="w-full rounded-xl bg-[#0c0c10] border border-[#2a2a35] px-3 py-2.5 text-base font-bold text-white tabular-nums focus:outline-none focus:border-emerald-500" />
                </div>
              </div>
              <button id="save-profile-btn" type="button" class="w-full py-3 rounded-2xl bg-emerald-500 text-black font-semibold text-sm active:scale-[0.98]">
                Сохранить и записать замер
              </button>
            </div>

            <!-- Weight Dynamics Chart -->
            <div class="amoled-card p-4 space-y-3">
              <div class="flex items-center justify-between">
                <h3 class="text-xs uppercase tracking-wider text-[#8e8e98] font-semibold">Динамика веса</h3>
                <span class="text-xs text-[#8e8e98] tabular-nums">${log.length} зам.</span>
              </div>
              <div class="relative h-48 w-full">
                <canvas id="weight-chart"></canvas>
              </div>
              <div class="space-y-1.5 pt-2 border-t border-[#1e1e26] max-h-48 overflow-y-auto">
                ${log.slice().reverse().map(entry => `
                  <div class="flex items-center justify-between text-xs py-1.5 px-2 rounded-xl bg-[#16161d]">
                    <span class="text-[#a5a5b2]">${formatDateRu(entry.date)}</span>
                    <div class="flex items-center gap-3">
                      <span class="font-semibold text-white tabular-nums">${entry.weight} кг${entry.waist ? ` • ${entry.waist} см` : ''}</span>
                      ${log.length > 1 ? `
                        <button type="button" data-del-wlog="${entry.id}" class="del-wlog-btn text-[#6e6e7a] hover:text-red-400">
                          <i data-lucide="x" class="w-3.5 h-3.5"></i>
                        </button>
                      ` : ''}
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>

            <!-- Backup -->
            <div class="amoled-card p-4 space-y-3">
              <h3 class="text-xs uppercase tracking-wider text-[#8e8e98] font-semibold">Резервная копия (JSON)</h3>
              <p class="text-xs text-[#8e8e98] leading-relaxed">Данные хранятся локально в памяти телефона. Можно скачать бэкап или перенести на другое устройство.</p>
              <div class="grid grid-cols-2 gap-2.5">
                <button id="export-json-btn" type="button" class="py-2.5 rounded-xl bg-[#1a1a22] border border-[#2a2a36] text-xs font-semibold text-white flex items-center justify-center gap-1.5 active:scale-95">
                  <i data-lucide="download" class="w-3.5 h-3.5"></i> Экспорт
                </button>
                <label class="py-2.5 rounded-xl bg-[#1a1a22] border border-[#2a2a36] text-xs font-semibold text-white flex items-center justify-center gap-1.5 active:scale-95 cursor-pointer">
                  <i data-lucide="upload" class="w-3.5 h-3.5"></i> Импорт
                  <input id="import-json-inp" type="file" accept="application/json" class="hidden" />
                </label>
              </div>
            </div>
          </div>
        `;
      }

      function bindBodyProfileEvents(root) {
        document.getElementById('enable-notif-btn').addEventListener('click', async () => {
          const perm = await requestNotificationPermission(false);
          if (perm === 'granted') {
            playRestBeep(true);
            sendRestSystemNotification('IRON Gym • Тест уведомления', 'Уведомления о времени отдыха работают корректно!', true);
          }
          render();
        });

        document.getElementById('save-profile-btn').addEventListener('click', () => {
          const weight = Number(document.getElementById('prof-weight').value);
          const height = Number(document.getElementById('prof-height').value);
          const ageRaw = document.getElementById('prof-age').value.trim();
          const waistRaw = document.getElementById('prof-waist').value.trim();

          if (!weight || weight < 20) { showToast('Введите корректный вес', 'error'); return; }
          if (!height || height < 100) { showToast('Введите корректный рост', 'error'); return; }

          state.profile.weight = weight;
          state.profile.height = height;
          state.profile.age = ageRaw ? parseInt(ageRaw, 10) : '';
          state.profile.waist = waistRaw ? Number(waistRaw) : '';

          const today = formatDateISO(new Date());
          if (!Array.isArray(state.profile.weightLog)) state.profile.weightLog = [];
          const existingIdx = state.profile.weightLog.findIndex(e => e.date === today);
          if (existingIdx >= 0) {
            state.profile.weightLog[existingIdx].weight = weight;
            state.profile.weightLog[existingIdx].waist = state.profile.waist;
          } else {
            state.profile.weightLog.push({ id: uid('w'), date: today, weight, waist: state.profile.waist });
          }
          saveState();
          render();
          showToast('Параметры сохранены');
        });

        root.querySelectorAll('.del-wlog-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            const id = btn.dataset.delWlog;
            state.profile.weightLog = state.profile.weightLog.filter(e => e.id !== id);
            saveState();
            render();
          });
        });

        document.getElementById('export-json-btn').addEventListener('click', () => {
          const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `iron_gym_backup_${formatDateISO(new Date())}.json`;
          document.body.appendChild(a);
          a.click();
          a.remove();
          URL.revokeObjectURL(url);
          showToast('Резервная копия скачана');
        });

        document.getElementById('import-json-inp').addEventListener('change', (ev) => {
          const file = ev.target.files && ev.target.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = () => {
            try {
              const parsed = JSON.parse(reader.result);
              if (!Array.isArray(parsed.program)) throw new Error('Invalid format');
              state = Object.assign(getDefaultState(), parsed);
              state.program = migrateProgramMuscles(state.program);
              saveState();
              render();
              showToast('Данные успешно восстановлены');
            } catch (e) {
              showToast('Ошибка: некорректный JSON-файл', 'error');
            }
          };
          reader.readAsText(file);
        });
      }

      function renderWeightChart() {
        destroyCharts();
        const canvas = document.getElementById('weight-chart');
        if (!canvas || !window.Chart) return;
        const log = (state.profile.weightLog || []).slice(-14);
        if (!log.length) return;

        charts.weight = new Chart(canvas.getContext('2d'), {
          type: 'line',
          data: {
            labels: log.map(e => formatDateRu(e.date).slice(0, 6)),
            datasets: [{
              label: 'Вес (кг)',
              data: log.map(e => e.weight),
              borderColor: '#30d158',
              backgroundColor: 'rgba(48,209,88,0.14)',
              fill: true,
              tension: 0.3,
              pointRadius: 4,
              pointBackgroundColor: '#30d158'
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
              x: { grid: { display: false }, ticks: { color: '#8e8e98', font: { size: 10 } } },
              y: { grid: { color: '#1f1f27' }, ticks: { color: '#8e8e98', font: { size: 10 } } }
            }
          }
        });
      }

      // ============================================================
      // 16. MASTER RENDER & INIT
      // ============================================================
      function updateNavStyles() {
        document.querySelectorAll('.tab-btn').forEach(btn => {
          const active = btn.dataset.tab === ui.tab;
          btn.classList.toggle('text-emerald-400', active);
          btn.classList.toggle('text-[#787885]', !active);
        });
      }

      function render() {
        destroyCharts();
        updateNavStyles();
        updateRestBar();

        const root = document.getElementById('main-content');
        if (ui.tab === 'workout') renderWorkoutTab(root);
        else if (ui.tab === 'muscles') renderMusclesTab(root);
        else if (ui.tab === 'history') renderHistoryTab(root);
        else if (ui.tab === 'profile') renderProfileTab(root);

        if (window.lucide) window.lucide.createIcons();
      }

      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          ui.tab = btn.dataset.tab;
          render();
          window.scrollTo({ top: 0, behavior: 'instant' });
        });
      });

      document.getElementById('modal-close-btn').addEventListener('click', closeModal);
      document.getElementById('modal-overlay').addEventListener('click', (e) => {
        if (e.target.id === 'modal-overlay') closeModal();
      });

      document.getElementById('rest-minus-btn').addEventListener('click', () => {
        if (restEndTimestamp > 0) {
          restEndTimestamp = Math.max(Date.now() + 5000, restEndTimestamp - 15000);
          updateRestBar();
        }
      });
      document.getElementById('rest-plus-btn').addEventListener('click', () => {
        if (restEndTimestamp > 0) {
          restEndTimestamp += 15000;
          restTotalSec += 15;
          updateRestBar();
        }
      });
      document.getElementById('rest-skip-btn').addEventListener('click', () => stopRestTimer(true));

      ensureWorkoutTimerRunning();
      render();

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').catch(() => {});
        });
      }
    })();
  </script>
</body>
</html>
