        }

        html += `
          <div class="card flex-col gap-25">
            <div class="flex items-center justify-between">
              <div class="t-xs upper muted fw-600">Распределение нагрузки</div>
              <span class="t-xs muted num">${workedCount} из ${sortedMuscles.length} групп</span>
            </div>
            <div class="flex-col gap-2">
              ${sortedMuscles.map(m => {
                const c = getMuscleColor(m.pct);
                const isSel = ui.selectedMuscle === m.key;
                return `
                  <button type="button" data-muscle="${m.key}" class="row-box w-full text-left" style="padding:10px 12px;${isSel ? 'border-color:rgba(255,255,255,0.28);background:#1e1e28;' : ''}">
                    <div class="flex items-center justify-between t-xs" style="margin-bottom:6px;">
                      <span class="fw-600 ${m.pct > 0 ? '' : 'faint'}">${escapeHtml(m.name)}</span>
                      <span class="num ${m.pct > 0 ? 'dim' : 'faint'}">${m.effectiveSets.toFixed(1)} подх. • ${m.pct}%</span>
                    </div>
                    <div class="bar-track"><div class="bar-fill" style="width:${m.pct}%;background:${c.fill};"></div></div>
                  </button>
                `;
              }).join('')}
            </div>
          </div>
        `;

        root.innerHTML = html;

        root.querySelectorAll('.scope-btn').forEach(btn => {
          btn.addEventListener('click', () => { ui.muscleScope = btn.dataset.scope; render(); });
        });
        const prevQuick = document.getElementById('preview-plan-quick-btn');
        if (prevQuick) prevQuick.addEventListener('click', () => { ui.muscleScope = 'preview_week'; render(); });
        root.querySelectorAll('[data-muscle]').forEach(el => {
          el.addEventListener('click', () => { const k = el.dataset.muscle; ui.selectedMuscle = ui.selectedMuscle === k ? null : k; render(); });
        });
      }

      // ============================================================
      // 12. TAB 3 — CALENDAR, PRs, HISTORY & OFFLINE SVG CHARTS
      // ============================================================
      function renderHistoryTab(root) {
        document.getElementById('header-title').textContent = 'Календарь и статистика';
        document.getElementById('header-subtitle').textContent = `Записано тренировок: ${state.history.length}`;
        document.getElementById('header-right').innerHTML = '';

        const totalWorkouts = state.history.length;
        const totalTonnage = state.history.reduce((a, w) => a + calcWorkoutTotals(w).tonnage, 0);
        const totalSets = state.history.reduce((a, w) => a + calcWorkoutTotals(w).doneSets, 0);
        const totalRepsAll = state.history.reduce((a, w) => a + calcWorkoutTotals(w).doneReps, 0);
        const avgDurMin = totalWorkouts ? Math.round(state.history.reduce((a, w) => a + (Number(w.durationSec) || 0), 0) / totalWorkouts / 60) : 0;

        const monthNames = ['Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь', 'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'];
        const firstDay = new Date(ui.calYear, ui.calMonth, 1);
        const daysInMonth = new Date(ui.calYear, ui.calMonth + 1, 0).getDate();
        const startOffset = (firstDay.getDay() + 6) % 7;
        const todayIso = formatDateISO(new Date());

        const workoutsByDate = {};
        state.history.forEach(w => {
          if (!workoutsByDate[w.date]) workoutsByDate[w.date] = [];
          workoutsByDate[w.date].push(w);
        });

        let calCells = '';
        for (let i = 0; i < startOffset; i++) calCells += `<div style="height:42px;"></div>`;
        for (let d = 1; d <= daysInMonth; d++) {
          const iso = `${ui.calYear}-${String(ui.calMonth + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
          const list = workoutsByDate[iso] || [];
          const hasWk = list.length > 0;
          const isToday = iso === todayIso;
          const isSel = iso === ui.selectedDate;
          const cls = isSel ? 'cal-day selected' : hasWk ? 'cal-day attended' : isToday ? 'cal-day today' : 'cal-day';
          calCells += `
            <button type="button" data-cal-date="${iso}" class="cal-day-btn ${cls}">
              <span class="num" style="line-height:1;">${d}</span>
              ${hasWk ? `
                <div class="flex gap-1" style="margin-top:4px;">
                  ${list.slice(0, 3).map(w => `<span style="width:5px;height:5px;border-radius:999px;background:${isSel ? '#000' : (w.dayColor || '#30d158')};"></span>`).join('')}
                </div>
              ` : ''}
            </button>
          `;
        }

        const selectedWorkouts = workoutsByDate[ui.selectedDate] || [];
        const monthCalStats = computeMonthStats(ui.calYear, ui.calMonth);

        const loggedExNames = Array.from(new Set(
          state.history.flatMap(w => (w.exercises || []).filter(e => e.sets.some(s => s.done && !s.isWarmup)).map(e => e.name))
        ));
        if (!ui.selectedStatExercise && loggedExNames.length) ui.selectedStatExercise = loggedExNames[0];
        else if (ui.selectedStatExercise && !loggedExNames.includes(ui.selectedStatExercise)) ui.selectedStatExercise = loggedExNames[0] || '';

        // Prepare chart datasets
        const volItems = state.history.slice(0, 12).reverse().map(w => ({
          label: formatDateRu(w.date).slice(0, 6),
          val: calcWorkoutTotals(w).tonnage,
          color: w.dayColor || '#30d158'
        }));

        const progPoints = [];
        if (ui.selectedStatExercise) {
          state.history.slice().reverse().forEach(w => {
            const ex = (w.exercises || []).find(e => e.name === ui.selectedStatExercise);
            if (!ex) return;
            const done = (ex.sets || []).filter(s => s.done && !s.isWarmup);
            if (!done.length) return;
            progPoints.push({ label: formatDateRu(w.date).slice(0, 6), val: Math.max(...done.map(s => Number(s.weight) || 0)) });
          });
        }

        // Personal Records (PR + Estimated 1RM)
        const prsMap = getHistoricalPRs();
        const prList = Object.entries(prsMap).sort((a, b) => b[1].best1RM - a[1].best1RM);

        let html = `
          <!-- Interactive Calendar -->
          <div class="card flex-col gap-3">
            <div class="flex items-center justify-between">
              <button id="cal-prev-btn" type="button" class="icon-btn">${icon('chev-left', 16)}</button>
              <div class="text-center">
                <div class="t-sm fw-700">${monthNames[ui.calMonth]} ${ui.calYear}</div>
                <div class="t-xs c-green fw-500">В зале: ${monthCalStats.visits} раз • ${monthCalStats.tonnage.toLocaleString('ru-RU')} кг</div>
              </div>
              <button id="cal-next-btn" type="button" class="icon-btn">${icon('chev-right', 16)}</button>
            </div>
            <div class="grid-7 text-center t-xs upper faint fw-600" style="font-size:10px;">
              <div>Пн</div><div>Вт</div><div>Ср</div><div>Чт</div><div>Пт</div><div>Сб</div><div>Вс</div>
            </div>
            <div class="grid-7">${calCells}</div>

            <div class="divider flex-col gap-25">
              <div class="flex items-center justify-between">
                <div class="t-xs fw-700">${ui.selectedDate === todayIso ? 'Сегодня • ' : ''}${formatDateRu(ui.selectedDate)}</div>
                ${selectedWorkouts.length ? `<span class="pill pill-green" style="font-size:10px;">${selectedWorkouts.length} трен.</span>` : ''}
              </div>

              ${selectedWorkouts.length ? `
                <div class="flex-col gap-2">${selectedWorkouts.map(w => renderWorkoutHistoryItem(w, true)).join('')}</div>
              ` : `<div class="t-xs muted">Выберите программу или соберите тренировку на эту дату:</div>`}

              <div class="flex-col gap-2">
                <div class="grid-2">
                  ${state.program.map(d => `
                    <button type="button" data-cal-start="${d.id}" class="cal-start-day-btn btn btn-secondary btn-sm">
                      <span style="width:8px;height:8px;border-radius:999px;background:${d.color || '#30d158'};"></span>
                      <span class="truncate">${escapeHtml(d.name)}</span>
                    </button>
                  `).join('')}
                </div>
                <button id="cal-start-custom-btn" type="button" class="btn btn-dashed btn-sm w-full c-purple">
                  ${icon('plus', 14)} Собрать свою тренировку на этот день
                </button>
              </div>
            </div>
          </div>

          <!-- Personal Records (PR & 1RM) -->
          <div class="card flex-col gap-25">
            <div class="flex items-center justify-between">
              <div class="flex items-center gap-15">
                <span class="c-amber">${icon('trophy', 15)}</span>
                <span class="t-xs upper muted fw-600">Личные рекорды (PR и 1ПМ)</span>
              </div>
              <span class="t-xs muted num">${prList.length} упр.</span>
            </div>
            ${prList.length ? `
              <div class="flex-col gap-15">
                ${prList.map(([name, pr]) => `
                  <div class="row-box flex items-center justify-between gap-2" style="padding:10px 12px;">
                    <div class="flex-1">
                      <div class="t-xs fw-600 truncate">${escapeHtml(name)}</div>
                      <div class="t-xs muted" style="font-size:10px;">Макс. вес: ${pr.maxWeight} кг×${pr.maxWeightReps} • ${formatDateRu(pr.date)}</div>
                    </div>
                    <div class="text-right shrink-0">
                      <div class="t-xs fw-700 c-amber num">~${pr.best1RM} кг</div>
                      <div class="t-xs faint" style="font-size:9px;">расч. 1ПМ</div>
                    </div>
                  </div>
                `).join('')}
              </div>
            ` : `<div class="t-xs faint">Рекорды и расчётный 1ПМ появятся автоматически после первой записанной тренировки.</div>`}
          </div>

          <!-- All-time KPIs -->
          <div class="grid-2">
            <div class="card" style="padding:14px;">
              <div class="t-xs muted">Всего тренировок</div>
              <div class="t-xl fw-700 num" style="margin-top:2px;">${totalWorkouts}</div>
            </div>
            <div class="card" style="padding:14px;">
              <div class="t-xs muted">Общий тоннаж</div>
              <div class="t-xl fw-700 num" style="margin-top:2px;">${totalTonnage >= 10000 ? (totalTonnage / 1000).toFixed(1) + ' т' : totalTonnage.toLocaleString('ru-RU') + ' кг'}</div>
            </div>
            <div class="card" style="padding:14px;">
              <div class="t-xs muted">Подходов / Повт.</div>
              <div class="t-lg fw-700 num c-green" style="margin-top:2px;">${totalSets} <span class="t-xs muted fw-500">/ ${totalRepsAll}</span></div>
            </div>
            <div class="card" style="padding:14px;">
              <div class="t-xs muted">Ср. длительность</div>
              <div class="t-xl fw-700 num" style="margin-top:2px;">${avgDurMin} мин</div>
            </div>
          </div>

          <!-- Offline SVG Volume Chart -->
          <div class="card flex-col gap-25">
            <div class="t-xs upper muted fw-600">Объём тренировок (тоннаж, кг)</div>
            ${volItems.length ? renderSvgBarChart(volItems, 'кг') : `<div class="t-xs faint text-center" style="padding:18px 0;">Завершите первую тренировку, чтобы увидеть график объёма.</div>`}
          </div>

          <!-- Offline SVG Progression Chart -->
          <div class="card flex-col gap-25">
            <div class="flex items-center justify-between gap-2">
              <div class="t-xs upper muted fw-600">Прогресс веса</div>
              ${loggedExNames.length ? `
                <select id="stat-ex-select" class="field" style="width:auto;max-width:190px;padding:6px 10px;font-size:12px;">
                  ${loggedExNames.map(n => `<option value="${escapeHtml(n)}" ${n === ui.selectedStatExercise ? 'selected' : ''}>${escapeHtml(n)}</option>`).join('')}
                </select>
              ` : ''}
            </div>
            ${progPoints.length ? renderSvgLineChart(progPoints, '#0a84ff') : `<div class="t-xs faint text-center" style="padding:18px 0;">График рабочих весов появится после первой записи.</div>`}
          </div>

          <!-- Full History -->
          <div class="card flex-col gap-25">
            <div class="t-xs upper muted fw-600">Все тренировки</div>
            ${state.history.length ? `<div class="flex-col gap-2">${state.history.map(w => renderWorkoutHistoryItem(w, false)).join('')}</div>` : `<div class="t-xs faint">История пока пуста.</div>`}
          </div>
        `;

        root.innerHTML = html;

        document.getElementById('cal-prev-btn').addEventListener('click', () => {
          ui.calMonth--; if (ui.calMonth < 0) { ui.calMonth = 11; ui.calYear--; } render();
        });
        document.getElementById('cal-next-btn').addEventListener('click', () => {
          ui.calMonth++; if (ui.calMonth > 11) { ui.calMonth = 0; ui.calYear++; } render();
        });
        root.querySelectorAll('.cal-day-btn').forEach(btn => {
          btn.addEventListener('click', () => { ui.selectedDate = btn.dataset.calDate; render(); });
        });
        root.querySelectorAll('.cal-start-day-btn').forEach(btn => {
          btn.addEventListener('click', () => startWorkout(btn.dataset.calStart, ui.selectedDate));
        });
        document.getElementById('cal-start-custom-btn').addEventListener('click', () => startCustomWorkout(ui.selectedDate));

        root.querySelectorAll('.toggle-hist-btn').forEach(btn => {
          btn.addEventListener('click', () => { const id = btn.dataset.histId; ui.expandedHistory[id] = !ui.expandedHistory[id]; render(); });
        });
        root.querySelectorAll('.edit-hist-btn').forEach(btn => {
          btn.addEventListener('click', () => editHistoryWorkout(btn.dataset.editHist));
        });
        root.querySelectorAll('.delete-hist-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            const id = btn.dataset.deleteHist;
            openModal('Удалить запись?', `
              <div class="t-sm dim">Тренировка будет удалена из истории, статистики и карты мышц.</div>
              <div class="flex gap-2">
                <button id="dh-cancel" type="button" class="btn btn-secondary flex-1">Отмена</button>
                <button id="dh-confirm" type="button" class="btn btn-danger flex-1">Удалить</button>
              </div>
            `);
            document.getElementById('dh-cancel').addEventListener('click', closeModal);
            document.getElementById('dh-confirm').addEventListener('click', () => {
              state.history = state.history.filter(w => w.id !== id);
              saveState(); closeModal(); render(); showToast('Тренировка удалена');
            });
          });
        });

        const exSel = document.getElementById('stat-ex-select');
        if (exSel) exSel.addEventListener('change', () => { ui.selectedStatExercise = exSel.value; render(); });
      }

      function renderWorkoutHistoryItem(w, forceOpen) {
        const isOpen = forceOpen || !!ui.expandedHistory[w.id];
        const t = calcWorkoutTotals(w);
        return `
          <div class="row-box" style="overflow:hidden;">
            <div class="flex items-center justify-between gap-2" style="padding:11px 12px;">
              <button type="button" data-hist-id="${w.id}" class="toggle-hist-btn flex-1 text-left flex items-center gap-2">
                <span style="width:9px;height:9px;border-radius:999px;background:${w.dayColor || '#30d158'};flex-shrink:0;"></span>
                <div class="flex-1">
                  <div class="t-sm fw-600 truncate">${escapeHtml(w.dayName)}</div>
                  <div class="t-xs muted num">${formatDateRu(w.date)} • ${t.doneSets} подх. • ${t.tonnage.toLocaleString('ru-RU')} кг • ${Math.max(1, Math.round((w.durationSec || 0) / 60))} мин</div>
                </div>
              </button>
              <div class="flex items-center gap-1 shrink-0">
                <button type="button" data-edit-hist="${w.id}" class="edit-hist-btn icon-btn c-green" title="Редактировать">${icon('pencil', 13)}</button>
                <button type="button" data-delete-hist="${w.id}" class="delete-hist-btn icon-btn" title="Удалить">${icon('trash', 13)}</button>
              </div>
            </div>
            ${isOpen ? `
              <div class="divider flex-col gap-2" style="padding:10px 12px 12px;">
                ${w.note ? `<div class="t-xs muted" style="font-style:italic;">«${escapeHtml(w.note)}»</div>` : ''}
                ${(w.exercises || []).map(ex => {
                  const doneWarmup = (ex.sets || []).filter(s => s.done && s.isWarmup);
                  const doneWork = (ex.sets || []).filter(s => s.done && !s.isWarmup);
                  if (!doneWarmup.length && !doneWork.length) return '';
                  return `
                    <div class="t-xs">
                      <div class="fw-600 dim">${escapeHtml(ex.name)}</div>
                      <div class="muted num flex flex-wrap gap-2" style="margin-top:2px;">
                        ${doneWarmup.length ? `<span class="c-amber" style="opacity:0.85;">Р: ${doneWarmup.map(s => `${s.weight}кг×${s.reps}`).join(', ')}</span>` : ''}
                        ${doneWork.length ? `<span>${doneWork.map(s => `${s.weight}кг×${s.reps}`).join(' / ')}</span>` : ''}
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>
            ` : ''}
          </div>
        `;
      }

      // ============================================================
      // 13. TAB 4 — PROGRAM EDITOR & BODY PROFILE
      // ============================================================
      function renderProfileTab(root) {
        document.getElementById('header-title').textContent = ui.profileSubtab === 'program' ? 'Программа' : 'Профиль и тело';
        document.getElementById('header-subtitle').textContent = ui.profileSubtab === 'program' ? 'Редактирование дней и упражнений' : 'Вес, рост, возраст и бэкап';
        document.getElementById('header-right').innerHTML = '';

        let html = `
          <div class="grid-2" style="background:#131318;border:1px solid var(--border);border-radius:16px;padding:4px;gap:4px;">
            <button type="button" data-subtab="program" class="subtab-btn btn btn-sm" style="${ui.profileSubtab === 'program' ? 'background:#fff;color:#000;' : 'color:var(--text-muted);'}">Программа</button>
            <button type="button" data-subtab="body" class="subtab-btn btn btn-sm" style="${ui.profileSubtab === 'body' ? 'background:#fff;color:#000;' : 'color:var(--text-muted);'}">Параметры тела</button>
          </div>
        `;

        html += ui.profileSubtab === 'program' ? renderProgramEditorHtml() : renderBodyProfileHtml();
        root.innerHTML = html;

        root.querySelectorAll('.subtab-btn').forEach(btn => {
          btn.addEventListener('click', () => { ui.profileSubtab = btn.dataset.subtab; render(); });
        });

        if (ui.profileSubtab === 'program') bindProgramEditorEvents(root);
        else bindBodyProfileEvents(root);
      }

      function renderProgramEditorHtml() {
        let html = `<div class="flex-col gap-3">`;
        state.program.forEach((day, dayIdx) => {
          html += `
            <div class="card flex-col gap-3">
              <div class="flex items-center justify-between gap-2">
                <div class="flex items-center gap-2 flex-1">
                  <span style="width:10px;height:10px;border-radius:999px;background:${day.color || '#30d158'};flex-shrink:0;"></span>
                  <div class="flex-1">
                    <div class="t-md fw-700 truncate">${escapeHtml(day.name)}</div>
                    <div class="t-xs muted truncate">${escapeHtml(day.subtitle || '')}</div>
                  </div>
                </div>
                <div class="flex items-center gap-1 shrink-0">
                  <button type="button" data-edit-day="${dayIdx}" class="edit-day-btn icon-btn">${icon('pencil', 14)}</button>
                  ${state.program.length > 1 ? `<button type="button" data-del-day="${dayIdx}" class="del-day-btn icon-btn">${icon('trash', 14)}</button>` : ''}
                </div>
              </div>

              <div class="flex-col gap-2">
                ${day.exercises.map((ex, exIdx) => `
                  <div class="row-box flex items-center justify-between gap-2" style="padding:10px 12px;">
                    <div class="flex-1">
                      <div class="t-xs fw-600 truncate">${escapeHtml(ex.name)}</div>
                      <div class="t-xs muted num">${ex.sets} × ${escapeHtml(ex.reps)} • ${ex.defaultWeight} кг • ${ex.restSec}с</div>
                    </div>
                    <div class="flex items-center gap-1 shrink-0">
                      <button type="button" data-move-ex="${dayIdx}:${exIdx}:-1" class="move-ex-btn icon-btn" style="width:28px;height:28px;${exIdx === 0 ? 'opacity:0.25;pointer-events:none;' : ''}">${icon('chev-up', 14)}</button>
                      <button type="button" data-move-ex="${dayIdx}:${exIdx}:1" class="move-ex-btn icon-btn" style="width:28px;height:28px;${exIdx === day.exercises.length - 1 ? 'opacity:0.25;pointer-events:none;' : ''}">${icon('chev-down', 14)}</button>
                      <button type="button" data-edit-ex="${dayIdx}:${exIdx}" class="edit-ex-btn icon-btn c-green" style="width:28px;height:28px;">${icon('pencil', 13)}</button>
                    </div>
                  </div>
                `).join('')}
              </div>

              <button type="button" data-add-ex="${dayIdx}" class="add-ex-btn btn btn-dashed btn-sm w-full c-green">
                ${icon('plus', 14)} Добавить упражнение
              </button>
            </div>
          `;
        });

        html += `
          <button id="add-day-btn" type="button" class="btn btn-secondary w-full">${icon('plus-circle', 16)} Добавить тренировочный день</button>
          <button id="reset-program-btn" type="button" class="t-xs faint text-center" style="padding:10px;">Сбросить к исходной программе Full Body (День А / Б)</button>
        </div>`;
        return html;
      }

      function bindProgramEditorEvents(root) {
        root.querySelectorAll('.move-ex-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            const [dIdx, eIdx, dir] = btn.dataset.moveEx.split(':').map(Number);
            const list = state.program[dIdx].exercises;
            const target = eIdx + dir;
            if (target < 0 || target >= list.length) return;
            const tmp = list[eIdx]; list[eIdx] = list[target]; list[target] = tmp;
            saveState(); render();
          });
        });
        root.querySelectorAll('.edit-ex-btn').forEach(btn => {
          btn.addEventListener('click', () => { const [d, e] = btn.dataset.editEx.split(':').map(Number); openExerciseEditorModal(d, e); });
        });
        root.querySelectorAll('.add-ex-btn').forEach(btn => {
          btn.addEventListener('click', () => openExerciseEditorModal(Number(btn.dataset.addEx), null));
        });
        root.querySelectorAll('.edit-day-btn').forEach(btn => {
          btn.addEventListener('click', () => openDayEditorModal(Number(btn.dataset.editDay)));
        });
        root.querySelectorAll('.del-day-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            const dIdx = Number(btn.dataset.delDay);
            const day = state.program[dIdx];
            openModal(`Удалить «${day.name}»?`, `
              <div class="t-sm dim">День будет удалён из текущей программы (история сохранится).</div>
              <div class="flex gap-2">
                <button id="dd-cancel" type="button" class="btn btn-secondary flex-1">Отмена</button>
                <button id="dd-confirm" type="button" class="btn btn-danger flex-1">Удалить</button>
              </div>
            `);
            document.getElementById('dd-cancel').addEventListener('click', closeModal);
            document.getElementById('dd-confirm').addEventListener('click', () => {
              state.program.splice(dIdx, 1); saveState(); closeModal(); render(); showToast('День удалён');
            });
          });
        });
        document.getElementById('add-day-btn').addEventListener('click', () => openDayEditorModal(null));
        document.getElementById('reset-program-btn').addEventListener('click', () => {
          openModal('Сбросить программу?', `
            <div class="t-sm dim">Восстановится ваша исходная программа Full Body (День А и День Б). История тренировок не пострадает.</div>
            <div class="flex gap-2">
              <button id="rp-cancel" type="button" class="btn btn-secondary flex-1">Отмена</button>
              <button id="rp-confirm" type="button" class="btn btn-amber flex-1">Сбросить</button>
            </div>
          `);
          document.getElementById('rp-cancel').addEventListener('click', closeModal);
          document.getElementById('rp-confirm').addEventListener('click', () => {
            state.program = getDefaultProgram(); saveState(); closeModal(); render(); showToast('Программа Full Body восстановлена');
          });
        });
      }

      function openDayEditorModal(dayIdx) {
        const isNew = dayIdx === null;
        const day = isNew
          ? { id: uid('day'), name: `День ${state.program.length + 1}`, subtitle: 'Пользовательский день', color: DAY_COLORS[state.program.length % DAY_COLORS.length], exercises: [] }
          : state.program[dayIdx];

        openModal(isNew ? 'Новый тренировочный день' : 'Редактировать день', `
          <div>
            <div class="t-xs muted" style="margin-bottom:4px;">Название</div>
            <input id="day-name-inp" type="text" value="${escapeHtml(day.name)}" class="field" />
          </div>
          <div>
            <div class="t-xs muted" style="margin-bottom:4px;">Описание / акцент</div>
            <input id="day-sub-inp" type="text" value="${escapeHtml(day.subtitle || '')}" class="field" />
          </div>
          <div>
            <div class="t-xs muted" style="margin-bottom:6px;">Цвет в календаре</div>
            <div class="flex gap-25">
              ${DAY_COLORS.map(c => `<button type="button" data-pick-color="${c}" class="pick-color-btn" style="width:30px;height:30px;border-radius:999px;background:${c};border:2px solid ${day.color === c ? '#fff' : 'transparent'};"></button>`).join('')}
            </div>
          </div>
          <button id="save-day-btn" type="button" class="btn btn-primary w-full">Сохранить</button>
        `);

        let chosenColor = day.color;
        document.querySelectorAll('.pick-color-btn').forEach(b => {
          b.addEventListener('click', () => {
            chosenColor = b.dataset.pickColor;
            document.querySelectorAll('.pick-color-btn').forEach(x => { x.style.borderColor = x === b ? '#fff' : 'transparent'; });
          });
        });

        document.getElementById('save-day-btn').addEventListener('click', () => {
          const name = (document.getElementById('day-name-inp').value || '').trim();
          if (!name) { showToast('Введите название дня', 'error'); return; }
          const sub = (document.getElementById('day-sub-inp').value || '').trim();
          if (isNew) state.program.push(Object.assign({}, day, { name, subtitle: sub, color: chosenColor }));
          else { state.program[dayIdx].name = name; state.program[dayIdx].subtitle = sub; state.program[dayIdx].color = chosenColor; }
          saveState(); closeModal(); render(); showToast('Программа обновлена');
        });
      }

      function openExerciseEditorModal(dayIdx, exIdx) {
        const isNew = exIdx === null;
        const ex = isNew
          ? { id: uid('ex'), name: '', sets: 3, reps: '10–12', defaultWeight: 20, restSec: 90, note: '', primary: [], secondary: [] }
          : state.program[dayIdx].exercises[exIdx];

        const primarySet = new Set(ex.primary || []);
        const secondarySet = new Set(ex.secondary || []);

        const chips = (setObj, cls, activeCls) => Object.entries(MUSCLES).map(([k, m]) => `
          <button type="button" data-mkey="${k}" class="${cls} pill ${setObj.has(k) ? activeCls : ''}">${escapeHtml(m.short)}</button>
        `).join('');

        openModal(isNew ? 'Новое упражнение' : 'Редактировать упражнение', `
          <div>
            <div class="t-xs muted" style="margin-bottom:4px;">Название упражнения</div>
            <input id="ex-name-inp" type="text" value="${escapeHtml(ex.name)}" placeholder="Например: Подтягивания" class="field" />
          </div>
          <div class="grid-3">
            <div><div class="t-xs muted" style="margin-bottom:4px;">Подходы</div><input id="ex-sets-inp" type="number" min="1" max="12" value="${ex.sets}" class="field text-center" /></div>
            <div><div class="t-xs muted" style="margin-bottom:4px;">Повторения</div><input id="ex-reps-inp" type="text" value="${escapeHtml(ex.reps)}" class="field text-center" /></div>
            <div><div class="t-xs muted" style="margin-bottom:4px;">Вес (кг)</div><input id="ex-weight-inp" type="number" step="0.5" min="0" value="${ex.defaultWeight}" class="field text-center" /></div>
          </div>
          <div>
            <div class="t-xs muted" style="margin-bottom:4px;">Отдых между подходами (сек)</div>
            <input id="ex-rest-inp" type="number" step="15" min="15" max="360" value="${ex.restSec}" class="field" />
          </div>
          <div>
            <div class="t-xs muted" style="margin-bottom:6px;">Основные мышцы (100% на карту)</div>
            <div class="flex flex-wrap gap-15">${chips(primarySet, 'prim-chip', 'pill-green')}</div>
          </div>
          <div>
            <div class="t-xs muted" style="margin-bottom:6px;">Вспомогательные мышцы (45% на карту)</div>
            <div class="flex flex-wrap gap-15">${chips(secondarySet, 'sec-chip', 'pill-amber')}</div>
          </div>
          <div>
            <div class="t-xs muted" style="margin-bottom:4px;">Заметка по технике</div>
            <textarea id="ex-note-inp" rows="2" class="field">${escapeHtml(ex.note || '')}</textarea>
          </div>
          <div class="flex gap-2">
            ${!isNew ? `<button id="del-ex-btn" type="button" class="btn btn-danger btn-sm">Удалить</button>` : ''}
            <button id="save-ex-btn" type="button" class="btn btn-primary flex-1">Сохранить</button>
          </div>
        `);

        document.querySelectorAll('.prim-chip').forEach(b => {
          b.addEventListener('click', () => {
            const k = b.dataset.mkey;
            if (primarySet.has(k)) { primarySet.delete(k); b.className = 'prim-chip pill'; }
            else { primarySet.add(k); b.className = 'prim-chip pill pill-green'; }
          });
        });
        document.querySelectorAll('.sec-chip').forEach(b => {
          b.addEventListener('click', () => {
            const k = b.dataset.mkey;
            if (secondarySet.has(k)) { secondarySet.delete(k); b.className = 'sec-chip pill'; }
            else { secondarySet.add(k); b.className = 'sec-chip pill pill-amber'; }
          });
        });

        document.getElementById('save-ex-btn').addEventListener('click', () => {
          const name = (document.getElementById('ex-name-inp').value || '').trim();
          if (!name) { showToast('Укажите название упражнения', 'error'); return; }
          const updated = {
            id: ex.id, name,
            sets: Math.max(1, parseInt(document.getElementById('ex-sets-inp').value, 10) || 3),
            reps: (document.getElementById('ex-reps-inp').value || '10').trim(),
            defaultWeight: Math.max(0, Number(document.getElementById('ex-weight-inp').value) || 0),
            restSec: Math.max(15, parseInt(document.getElementById('ex-rest-inp').value, 10) || 90),
            note: (document.getElementById('ex-note-inp').value || '').trim(),
            primary: Array.from(primarySet),
            secondary: Array.from(secondarySet).filter(k => !primarySet.has(k))
          };
          if (isNew) state.program[dayIdx].exercises.push(updated);
          else state.program[dayIdx].exercises[exIdx] = updated;
          saveState(); closeModal(); render(); showToast('Упражнение сохранено');
        });

        const delBtn = document.getElementById('del-ex-btn');
        if (delBtn) delBtn.addEventListener('click', () => {
          state.program[dayIdx].exercises.splice(exIdx, 1); saveState(); closeModal(); render(); showToast('Упражнение удалено');
        });
      }

      function renderBodyProfileHtml() {
        const p = state.profile;
        const hM = (Number(p.height) || 0) / 100;
        const wKg = Number(p.weight) || 0;
        const bmi = (hM > 0 && wKg > 0) ? (wKg / (hM * hM)) : null;
        let bmiLabel = '—', bmiCls = 'muted';
        if (bmi) {
          if (bmi < 18.5) { bmiLabel = 'Дефицит'; bmiCls = 'c-blue'; }
          else if (bmi < 25) { bmiLabel = 'Норма'; bmiCls = 'c-green'; }
          else if (bmi < 30) { bmiLabel = 'Выше нормы'; bmiCls = 'c-amber'; }
          else { bmiLabel = 'Высокий'; bmiCls = 'c-red'; }
        }

        const log = Array.isArray(p.weightLog) ? p.weightLog : [];
        const weightPts = log.slice(-14).map(e => ({ label: formatDateRu(e.date).slice(0, 6), val: Number(e.weight) || 0 }));

        return `
          <div class="flex-col gap-3">
            <div class="card flex-col gap-3">
              <div class="flex items-center justify-between">
                <div class="t-xs upper muted fw-600">Антропометрия</div>
                ${bmi ? `<span class="t-xs fw-600 ${bmiCls}">ИМТ ${bmi.toFixed(1)} • ${bmiLabel}</span>` : ''}
              </div>
              <div class="grid-2">
                <div><div class="t-xs muted" style="margin-bottom:4px;">Вес (кг)</div><input id="prof-weight" type="number" step="0.1" min="20" max="300" value="${escapeHtml(p.weight)}" class="field fw-700 num" /></div>
                <div><div class="t-xs muted" style="margin-bottom:4px;">Рост (см)</div><input id="prof-height" type="number" step="1" min="100" max="250" value="${escapeHtml(p.height)}" class="field fw-700 num" /></div>
                <div><div class="t-xs muted" style="margin-bottom:4px;">Возраст (лет)</div><input id="prof-age" type="number" step="1" min="10" max="110" placeholder="Укажите" value="${escapeHtml(p.age)}" class="field fw-700 num" /></div>
                <div><div class="t-xs muted" style="margin-bottom:4px;">Талия (см, опц.)</div><input id="prof-waist" type="number" step="0.5" min="40" max="200" placeholder="—" value="${escapeHtml(p.waist)}" class="field fw-700 num" /></div>
              </div>
              <button id="save-profile-btn" type="button" class="btn btn-primary w-full">Сохранить и записать замер</button>
            </div>

            <div class="card flex-col gap-25">
              <div class="flex items-center justify-between">
                <div class="t-xs upper muted fw-600">Динамика веса</div>
                <span class="t-xs muted num">${log.length} зам.</span>
              </div>
              ${weightPts.length ? renderSvgLineChart(weightPts, '#30d158') : ''}
              <div class="divider flex-col gap-15" style="max-height:180px;overflow-y:auto;">
                ${log.slice().reverse().map(entry => `
                  <div class="row-box flex items-center justify-between t-xs" style="padding:8px 10px;">
                    <span class="muted">${formatDateRu(entry.date)}</span>
                    <div class="flex items-center gap-25">
                      <span class="fw-600 num">${entry.weight} кг${entry.waist ? ` • ${entry.waist} см` : ''}</span>
                      ${log.length > 1 ? `<button type="button" data-del-wlog="${entry.id}" class="del-wlog-btn faint">${icon('x', 13)}</button>` : ''}
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>

            <div class="card flex-col gap-25">
              <div class="t-xs upper muted fw-600">Резервная копия (JSON)</div>
              <div class="t-xs muted">Все данные сохраняются автоматически в памяти устройства. Экспорт нужен только для переноса или страховки.</div>
              <div class="grid-2">
                <button id="export-json-btn" type="button" class="btn btn-secondary btn-sm">${icon('download', 14)} Экспорт</button>
                <label class="btn btn-secondary btn-sm" style="cursor:pointer;">
                  ${icon('upload', 14)} Импорт
                  <input id="import-json-inp" type="file" accept="application/json" class="hidden" />
                </label>
              </div>
            </div>
          </div>
        `;
      }

      function bindBodyProfileEvents(root) {
        document.getElementById('save-profile-btn').addEventListener('click', () => {
          const weight = Number(document.getElementById('prof-weight').value);
          const height = Number(document.getElementById('prof-height').value);
          const ageRaw = document.getElementById('prof-age').value.trim();
          const waistRaw = document.getElementById('prof-waist').value.trim();
          if (!weight || weight < 20) { showToast('Введите корректный вес', 'error'); return; }
          if (!height || height < 100) { showToast('Введите корректный рост', 'error'); return; }

          state.profile.weight = weight;
          state.profile.height = height;
          state.profile.age = ageRaw ? parseInt(ageRaw, 10) : '';
          state.profile.waist = waistRaw ? Number(waistRaw) : '';

          const today = formatDateISO(new Date());
          if (!Array.isArray(state.profile.weightLog)) state.profile.weightLog = [];
          const existingIdx = state.profile.weightLog.findIndex(e => e.date === today);
          if (existingIdx >= 0) {
            state.profile.weightLog[existingIdx].weight = weight;
            state.profile.weightLog[existingIdx].waist = state.profile.waist;
          } else {
            state.profile.weightLog.push({ id: uid('w'), date: today, weight, waist: state.profile.waist });
          }
          saveState(); render(); showToast('Параметры сохранены');
        });

        root.querySelectorAll('.del-wlog-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            state.profile.weightLog = state.profile.weightLog.filter(e => e.id !== btn.dataset.delWlog);
            saveState(); render();
          });
        });

        document.getElementById('export-json-btn').addEventListener('click', () => {
          const jsonStr = JSON.stringify(state, null, 2);
          const fname = `iron_gym_backup_${formatDateISO(new Date())}.json`;
          if (window.AndroidBridge && typeof window.AndroidBridge.exportBackup === 'function') {
            window.AndroidBridge.exportBackup(fname, jsonStr);
            return;
          }
          const blob = new Blob([jsonStr], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url; a.download = fname;
          document.body.appendChild(a); a.click(); a.remove();
          URL.revokeObjectURL(url);
          showToast('Резервная копия скачана');
        });

        document.getElementById('import-json-inp').addEventListener('change', (ev) => {
          const file = ev.target.files && ev.target.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = () => {
            try {
              const parsed = JSON.parse(reader.result);
              if (!Array.isArray(parsed.program)) throw new Error('Invalid format');
              state = Object.assign(getDefaultState(), parsed);
              saveState(); render(); showToast('Данные успешно восстановлены');
            } catch (e) {
              showToast('Ошибка: некорректный JSON-файл', 'error');
            }
          };
          reader.readAsText(file);
        });
      }

      // ============================================================
      // 14. MASTER RENDER & INIT
      // ============================================================
      function updateNavStyles() {
        document.querySelectorAll('.tab-btn').forEach(btn => {
          btn.classList.toggle('active', btn.dataset.tab === ui.tab);
        });
      }

      function render() {
        updateNavStyles();
        updateRestBar();
        const root = document.getElementById('main-content');
        if (ui.tab === 'workout') renderWorkoutTab(root);
        else if (ui.tab === 'muscles') renderMusclesTab(root);
        else if (ui.tab === 'history') renderHistoryTab(root);
        else if (ui.tab === 'profile') renderProfileTab(root);
      }

      // Hydrate static icons
      document.getElementById('brand-icon-slot').innerHTML = icon('dumbbell', 18, 2.4);
      document.getElementById('modal-close-btn').innerHTML = icon('x', 16);
      document.querySelectorAll('.nav-ico').forEach(el => { el.innerHTML = icon(el.dataset.ico, 20, 2); });

      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => { ui.tab = btn.dataset.tab; render(); window.scrollTo({ top: 0 }); });
      });

      document.getElementById('modal-close-btn').addEventListener('click', closeModal);
      document.getElementById('modal-overlay').addEventListener('click', (e) => { if (e.target.id === 'modal-overlay') closeModal(); });
      document.getElementById('rest-minus-btn').addEventListener('click', () => { restRemainingSec = Math.max(5, restRemainingSec - 15); updateRestBar(); });
      document.getElementById('rest-plus-btn').addEventListener('click', () => { restRemainingSec += 15; updateRestBar(); });
      document.getElementById('rest-skip-btn').addEventListener('click', stopRestTimer);

      ensureWorkoutTimerRunning();
      render();
    })();
  </script>
</body>
