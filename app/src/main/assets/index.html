<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="IRON Gym" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="manifest" href="manifest.json" />
  <title>IRON — Трекер тренировок v3</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <style>
    :root {
      --bg-base: #000000;
      --bg-card: #111115;
      --bg-elevated: #191920;
      --border-subtle: #23232b;
      --text-primary: #f5f5f7;
      --text-secondary: #8e8e98;
      --accent-green: #30d158;
      --accent-blue: #0a84ff;
      --accent-orange: #ff9f0a;
      --accent-red: #ff3b30;
    }

    * {
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-base);
      color: var(--text-primary);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overscroll-behavior-y: none;
      -webkit-font-smoothing: antialiased;
    }

    body {
      min-height: 100dvh;
      overflow-x: hidden;
    }

    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    input[type="number"] {
      -moz-appearance: textfield;
    }

    .amoled-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 22px;
    }

    .amoled-elevated {
      background: var(--bg-elevated);
      border: 1px solid #2a2a35;
      border-radius: 16px;
    }

    .nav-blur {
      background: rgba(10, 10, 14, 0.90);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid #1e1e26;
    }

    .muscle-path {
      cursor: pointer;
      transition: fill 0.25s ease, fill-opacity 0.25s ease, stroke 0.2s ease, filter 0.25s ease;
      stroke: #09090d;
      stroke-width: 1.15;
      stroke-linejoin: round;
    }
    .muscle-path:hover {
      stroke: rgba(255, 255, 255, 0.7);
      stroke-width: 1.6;
    }
    .muscle-path.selected {
      stroke: #ffffff;
      stroke-width: 2.0;
    }

    .tab-btn {
      transition: color 0.2s ease, transform 0.15s ease;
    }
    .tab-btn:active {
      transform: scale(0.94);
    }

    .set-check-btn {
      transition: background-color 0.2s ease, transform 0.12s ease, border-color 0.2s ease;
    }
    .set-check-btn:active {
      transform: scale(0.9);
    }

    .toast-enter {
      animation: toastSlideUp 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes toastSlideUp {
      from { opacity: 0; transform: translate(-50%, 16px); }
      to { opacity: 1; transform: translate(-50%, 0); }
    }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    .safe-pb {
      padding-bottom: calc(88px + env(safe-area-inset-bottom, 0px));
    }
    .safe-nav-pb {
      padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
    }
  </style>
</head>
<body class="bg-black text-[#f5f5f7] selection:bg-emerald-500/30">

  <div id="app-shell" class="max-w-md mx-auto min-h-screen relative flex flex-col bg-black">

    <!-- Top Header -->
    <header class="sticky top-0 z-30 bg-black/88 backdrop-blur-xl border-b border-[#191920] px-4 pt-3.5 pb-3 flex items-center justify-between gap-2">
      <div class="flex items-center gap-2.5 min-w-0">
        <div class="w-8 h-8 rounded-xl bg-gradient-to-br from-emerald-400 to-emerald-600 flex items-center justify-center shadow-lg shadow-emerald-500/20 shrink-0">
          <i data-lucide="dumbbell" class="w-4 h-4 text-black stroke-[2.5]"></i>
        </div>
        <div class="truncate">
          <h1 id="header-title" class="text-[17px] font-semibold tracking-tight leading-tight">Тренировка</h1>
          <p id="header-subtitle" class="text-[11px] text-[#8e8e98] leading-tight truncate">Full Body • 2 дня в неделю</p>
        </div>
      </div>
      <div id="header-right" class="flex items-center gap-1.5 shrink-0"></div>
    </header>

    <!-- Active Rest Timer Floating Banner -->
    <div id="rest-timer-bar" class="hidden sticky top-[59px] z-20 mx-4 mt-2.5 px-3.5 py-2.5 rounded-2xl bg-[#131d17] border border-emerald-500/40 shadow-lg shadow-black/70 space-y-1.5">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-2.5">
          <div class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></div>
          <div>
            <div class="text-[10px] uppercase tracking-wider text-emerald-300/80 font-medium">Отдых до подхода</div>
            <div id="rest-timer-display" class="text-lg font-bold tabular-nums leading-none text-emerald-400">02:00</div>
          </div>
        </div>
        <div class="flex items-center gap-1.5">
          <button id="rest-minus-btn" type="button" class="px-2.5 py-1.5 rounded-xl bg-black/50 border border-emerald-500/25 text-xs font-medium text-emerald-200 active:scale-95">−15с</button>
          <button id="rest-plus-btn" type="button" class="px-2.5 py-1.5 rounded-xl bg-black/50 border border-emerald-500/25 text-xs font-medium text-emerald-200 active:scale-95">+15с</button>
          <button id="rest-skip-btn" type="button" class="px-2.5 py-1.5 rounded-xl bg-emerald-500/25 text-xs font-semibold text-emerald-300 active:scale-95">Готов</button>
        </div>
      </div>
      <div class="w-full h-1 rounded-full bg-black/60 overflow-hidden">
        <div id="rest-timer-progress" class="h-full bg-emerald-400 transition-all duration-300" style="width:100%"></div>
      </div>
    </div>

    <!-- Main Scrollable Content -->
    <main id="main-content" class="flex-1 px-4 pt-4 safe-pb space-y-4"></main>

    <!-- Bottom Navigation -->
    <nav class="fixed bottom-0 left-0 right-0 z-40">
      <div class="max-w-md mx-auto nav-blur px-2 pt-2 safe-nav-pb grid grid-cols-4 gap-1">
        <button type="button" data-tab="workout" class="tab-btn flex flex-col items-center justify-center py-1.5 rounded-2xl">
          <i data-lucide="play-circle" class="w-5 h-5 mb-0.5"></i>
          <span class="text-[11px] font-medium">Зал</span>
        </button>
        <button type="button" data-tab="muscles" class="tab-btn flex flex-col items-center justify-center py-1.5 rounded-2xl">
          <i data-lucide="activity" class="w-5 h-5 mb-0.5"></i>
          <span class="text-[11px] font-medium">Мышцы</span>
        </button>
        <button type="button" data-tab="history" class="tab-btn flex flex-col items-center justify-center py-1.5 rounded-2xl">
          <i data-lucide="calendar" class="w-5 h-5 mb-0.5"></i>
          <span class="text-[11px] font-medium">Календарь</span>
        </button>
        <button type="button" data-tab="profile" class="tab-btn flex flex-col items-center justify-center py-1.5 rounded-2xl">
          <i data-lucide="sliders-horizontal" class="w-5 h-5 mb-0.5"></i>
          <span class="text-[11px] font-medium">План</span>
        </button>
      </div>
    </nav>

    <!-- Modal Overlay -->
    <div id="modal-overlay" class="hidden fixed inset-0 z-50 bg-black/82 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4">
      <div id="modal-container" class="w-full max-w-md bg-[#131318] border border-[#272732] rounded-t-3xl sm:rounded-3xl max-h-[90dvh] flex flex-col overflow-hidden shadow-2xl">
        <div class="px-5 py-3.5 border-b border-[#22222b] flex items-center justify-between shrink-0">
          <h2 id="modal-title" class="text-base font-semibold truncate pr-2">Модальное окно</h2>
          <button id="modal-close-btn" type="button" class="w-8 h-8 rounded-full bg-[#1e1e26] flex items-center justify-center text-[#a0a0ab] hover:text-white shrink-0">
            <i data-lucide="x" class="w-4 h-4"></i>
          </button>
        </div>
        <div id="modal-body" class="p-4 sm:p-5 overflow-y-auto space-y-4"></div>
      </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast-container" class="fixed bottom-24 left-1/2 -translate-x-1/2 z-50 pointer-events-none"></div>
  </div>

        if (!Array.isArray(arr)) return [];
        const out = new Set();
        arr.forEach(k => {
          if (MUSCLES[k]) out.add(k);
          else if (LEGACY_MUSCLE_MAP[k]) LEGACY_MUSCLE_MAP[k].forEach(nk => out.add(nk));

        return Array.from(out);

      function findDbExerciseById(id) {
        return EXERCISE_DB.find(e => e.id === id) || null;
      }

      function findDbExerciseByName(name) {
        if (!name) return null;
        const norm = name.trim().toLowerCase();
        return EXERCISE_DB.find(e => e.name.toLowerCase() === norm)
          || EXERCISE_DB.find(e => e.name.toLowerCase().includes(norm) || norm.includes(e.name.toLowerCase()))
          || null;
      }

      // ============================================================
      // 3. TRAINING PLAN TEMPLATES (Full Body 2/3d, Upper/Lower 2/3/4d, PPL, Split)
      // ============================================================
      function makePlanDay(id, name, subtitle, color, items) {
        return {
          id,
          name,
          subtitle,
          color,
          exercises: items.map((it, idx) => {
            const db = findDbExerciseById(it.dbId);
            return {
              id: `${id}_ex${idx + 1}`,
              dbId: db ? db.id : null,
              name: it.name || (db ? db.name : 'Упражнение'),
              sets: it.sets || (db ? db.sets : 3),
              reps: it.reps || (db ? db.reps : '10–12'),
              defaultWeight: it.weight != null ? it.weight : (db ? db.defaultWeight : 20),
              restSec: it.restSec || (db ? db.restSec : 90),
              note: it.note || (db ? db.technique : ''),
              primary: it.primary ? it.primary.slice() : (db ? db.primary.slice() : []),
              secondary: it.secondary ? it.secondary.slice() : (db ? db.secondary.slice() : [])
            };
          })
        };
      }

        return PLAN_TEMPLATES[0].days();

      function getDefaultState() {
        const todayStr = formatDateISO(new Date());
        return {
          planName: PLAN_TEMPLATES[0].name,
          program: getDefaultProgram(),
          history: [],
          activeWorkout: null,
          settings: {
            restNotifications: true,
            restSound: true,

          },
          profile: {
            height: 191,

      // ============================================================
      // 4. STATE & PERSISTENCE (With v1/v2 Auto-Migration)
      // ============================================================
      let state = loadState();
      let ui = {
        tab: 'workout', // workout | muscles | history | profile
        profileSubtab: 'program', // program | database | body
        muscleScope: '7d', // active | 7d | 30d | all | preview_week | preview_<dayId>

        calYear: new Date().getFullYear(),

      let restTimerInterval = null;
      let restEndTimestamp = 0;
      let restTotalSec = 0;
      let restLastNotifiedBucket = -1;
      let activeRestExerciseName = '';
      let charts = { volume: null, progress: null, weight: null };

      function migrateProgramMuscles(prog) {
        if (!Array.isArray(prog)) return getDefaultProgram();
        return prog.map(day => ({
          ...day,
          exercises: (day.exercises || []).map(ex => {
            const dbMatch = ex.dbId ? findDbExerciseById(ex.dbId) : findDbExerciseByName(ex.name);
            const normPrim = normalizeMuscleList(ex.primary);
            const normSec = normalizeMuscleList(ex.secondary);
            return {
              ...ex,
              dbId: ex.dbId || (dbMatch ? dbMatch.id : null),
              note: ex.note || (dbMatch ? dbMatch.technique : ''),
              primary: normPrim.length ? normPrim : (dbMatch ? dbMatch.primary.slice() : []),
              secondary: normSec.length ? normSec : (dbMatch ? dbMatch.secondary.slice() : [])
            };
          })
        }));
      }

      function loadState() {
        try {
          let raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) {
            raw = localStorage.getItem('iron_gym_tracker_v1');
          }
          if (!raw) return getDefaultState();
          const parsed = JSON.parse(raw);
          const def = getDefaultState();
          const migratedProg = Array.isArray(parsed.program) && parsed.program.length
            ? migrateProgramMuscles(parsed.program)
            : def.program;
          const migratedHist = Array.isArray(parsed.history)
            ? parsed.history.map(w => ({
                ...w,
                exercises: (w.exercises || []).map(ex => ({
                  ...ex,
                  primary: normalizeMuscleList(ex.primary),
                  secondary: normalizeMuscleList(ex.secondary)
                }))
              }))
            : [];
          let migratedActive = parsed.activeWorkout || null;
          if (migratedActive && Array.isArray(migratedActive.exercises)) {
            migratedActive.exercises = migratedActive.exercises.map(ex => ({
              ...ex,
              primary: normalizeMuscleList(ex.primary),
              secondary: normalizeMuscleList(ex.secondary)
            }));
          }
          return {
            planName: parsed.planName || def.planName,
            program: migratedProg,
            history: migratedHist,
            activeWorkout: migratedActive,
            settings: Object.assign({}, def.settings, parsed.settings || {}),
            profile: Object.assign({}, def.profile, parsed.profile || {})
          };
        } catch (e) {
          return getDefaultState();
        }
      }

      function saveState() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        } catch (e) {}
      }

      // ============================================================
      // 5. UTILITIES & SYSTEM NOTIFICATIONS
      // ============================================================
      function uid(prefix) {
        return (prefix || 'id') + '_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 6);
      }

      function formatDateISO(d) {
        const dt = d instanceof Date ? d : new Date(d);
        const y = dt.getFullYear();
        const m = String(dt.getMonth() + 1).padStart(2, '0');
        const day = String(dt.getDate()).padStart(2, '0');
        return `${y}-${m}-${day}`;
      }

      function formatDateRu(iso) {
        if (!iso) return '—';
        const parts = iso.split('-');
        if (parts.length !== 3) return iso;
        const months = ['янв', 'фев', 'мар', 'апр', 'мая', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];
        const mIdx = Math.max(0, Math.min(11, parseInt(parts[1], 10) - 1));
        return `${parseInt(parts[2], 10)} ${months[mIdx]} ${parts[0]}`;
      }

      function formatDuration(sec) {
        const s = Math.max(0, Math.floor(sec || 0));
        const h = Math.floor(s / 3600);
        const m = Math.floor((s % 3600) / 60);
        const rem = s % 60;
        if (h > 0) return `${h}:${String(m).padStart(2, '0')}:${String(rem).padStart(2, '0')}`;
        return `${String(m).padStart(2, '0')}:${String(rem).padStart(2, '0')}`;
      }

      function escapeHtml(str) {
        return String(str == null ? '' : str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function vibrate(ms) {
        try {
          if (state.settings && state.settings.restVibrate === false) return;
          if (window.AndroidBridge && typeof window.AndroidBridge.vibrateHaptic === 'function') {
            if (Array.isArray(ms) && ms.length > 2) {
              window.AndroidBridge.vibrateHaptic('finish');
            } else if (typeof ms === 'number' && ms <= 40) {
              window.AndroidBridge.vibrateHaptic('tick');
            } else {
              window.AndroidBridge.vibrateHaptic('click');
            }
          }
          if (navigator && typeof navigator.vibrate === 'function') navigator.vibrate(ms || 20);
        } catch (e) {}
      }

      function playCountdownBeep(sec) {
        try {
          if (state.settings && state.settings.restSound === false) return;
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (!AudioCtx) return;
          const ctx = new AudioCtx();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          const freq = sec === 1 ? 960 : (sec === 2 ? 880 : 800);
          osc.frequency.setValueAtTime(freq, ctx.currentTime);
          gain.gain.setValueAtTime(0.09, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.08);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.08);
        } catch (e) {}
      }

      function playRestBeep(isFinish) {
        try {
          if (state.settings && state.settings.restSound === false) return;
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (!AudioCtx) return;
          const ctx = new AudioCtx();
          if (isFinish) {
            // Triple sports fanfare chord: C6 (1046.5Hz) -> E6 (1318.5Hz) -> G6 (1568Hz)
            const now = ctx.currentTime;
            const chords = [
              { f: 1046.5, t: now,        d: 0.12, vol: 0.16 },
              { f: 1318.5, t: now + 0.11, d: 0.12, vol: 0.19 },
              { f: 1568.0, t: now + 0.22, d: 0.42, vol: 0.24 }
            ];
            chords.forEach(c => {
              const osc = ctx.createOscillator();
              const gain = ctx.createGain();
              osc.type = 'triangle';
              osc.frequency.setValueAtTime(c.f, c.t);
              gain.gain.setValueAtTime(c.vol, c.t);
              gain.gain.exponentialRampToValueAtTime(0.001, c.t + c.d);
              osc.connect(gain);
              gain.connect(ctx.destination);
              osc.start(c.t);
              osc.stop(c.t + c.d);
            });
          } else {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(660, ctx.currentTime);
            gain.gain.setValueAtTime(0.06, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.18);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + 0.18);
          }
        } catch (e) {}
      }

      function canUseSystemNotifications() {
        return typeof window !== 'undefined' && 'Notification' in window;
      }

      async function requestNotificationPermission(silent) {
        if (!canUseSystemNotifications()) {
          if (!silent) showToast('Браузер/WebView не поддерживает системные push-уведомления', 'error');
          return 'unsupported';
        }
        if (Notification.permission === 'granted') {
          state.settings.restNotifications = true;
          saveState();
          if (!silent) showToast('Уведомления таймера отдыха включены');
          return 'granted';
        }
        if (Notification.permission === 'denied') {
          if (!silent) showToast('Уведомления заблокированы в настройках телефона', 'error');
          return 'denied';
        }
        try {
          const perm = await Notification.requestPermission();
          if (perm === 'granted') {
            state.settings.restNotifications = true;
            saveState();
            if (!silent) showToast('Уведомления таймера отдыха включены!');
          } else if (!silent) {
            showToast('Разрешение на уведомления не выдано', 'error');
          }
          return perm;
        } catch (e) {
          return 'error';
        }
      }

      function sendRestSystemNotification(title, body, isFinished) {
        if (!state.settings || !state.settings.restNotifications) return;
        try {
          if (window.AndroidBridge && typeof window.AndroidBridge.notifyRest === 'function') {
            window.AndroidBridge.notifyRest(title, body, !!isFinished);
          }
        } catch (e) {}
        if (!state.settings || !state.settings.restNotifications) return;
        if (!canUseSystemNotifications() || Notification.permission !== 'granted') return;
        try {
          const notif = new Notification(title, {
            body: body,
            tag: 'iron-gym-rest-timer',
            renotify: !!isFinished,
            silent: !isFinished
          });
          if (isFinished) {
            setTimeout(() => { try { notif.close(); } catch (e) {} }, 8000);
          }
        } catch (e) {}
      }

      function showToast(msg, tone) {
        const container = document.getElementById('toast-container');
        if (!container) return;
        const colors = tone === 'error'
          ? 'bg-red-950/95 border-red-500/40 text-red-100'
          : 'bg-[#1c1c24]/95 border-emerald-500/35 text-white';
        container.innerHTML = `<div class="toast-enter px-4 py-2.5 rounded-2xl border ${colors} text-xs font-medium shadow-2xl whitespace-nowrap">${escapeHtml(msg)}</div>`;
        clearTimeout(container._t);
        container._t = setTimeout(() => { container.innerHTML = ''; }, 2600);
      }

      function parseTargetReps(repsStr) {
        const match = String(repsStr || '10').match(/\d+/);
        return match ? parseInt(match[0], 10) : 10;
      }

      function getLastLoggedSetsForExercise(exerciseName) {
        for (let i = 0; i < state.history.length; i++) {
          const w = state.history[i];
          const found = (w.exercises || []).find(ex => ex.name === exerciseName && ex.sets.some(s => s.done && !s.isWarmup));
          if (found) return found.sets.filter(s => s.done && !s.isWarmup);
        }
        return null;
      }

      // ============================================================
      // 6. TIMERS (Workout duration + Timestamp-based Rest Countdown + Notifications)
      // ============================================================
      function ensureWorkoutTimerRunning() {
        if (workoutTimerInterval) {
          clearInterval(workoutTimerInterval);
          workoutTimerInterval = null;
        }
        if (!state.activeWorkout) return;
        workoutTimerInterval = setInterval(() => {
          const el = document.getElementById('active-workout-clock');
          if (el && state.activeWorkout) {
            const elapsed = Math.floor((Date.now() - state.activeWorkout.startedAt) / 1000);
            el.textContent = formatDuration(elapsed);
          }
        }, 1000);
      }

      function getRestRemainingSec() {
        if (!restEndTimestamp) return 0;
        return Math.max(0, Math.ceil((restEndTimestamp - Date.now()) / 1000));
      }

      function startRestTimer(seconds, exerciseName) {
        if (restTimerInterval) {
          clearInterval(restTimerInterval);
          restTimerInterval = null;
        }
        restTotalSec = Math.max(15, seconds || 90);
        restEndTimestamp = Date.now() + restTotalSec * 1000;
        restLastNotifiedBucket = -1;
        activeRestExerciseName = exerciseName || '';

        if (canUseSystemNotifications() && Notification.permission === 'default' && state.settings.restNotifications) {
          requestNotificationPermission(true);
        }

        sendRestSystemNotification(
          `Отдых: ${formatDuration(restTotalSec)}`,
          activeRestExerciseName ? `Следующий подход: ${activeRestExerciseName}` : 'Таймер отдыха запущен',
          false
        );

        updateRestBar();
        restTimerInterval = setInterval(() => {
          const rem = getRestRemainingSec();
          if (rem <= 0) {
            stopRestTimer(true);
            playRestBeep(true);
            vibrate([120, 80, 220, 80, 350]);
            showToast('Отдых закончился — пора к подходу!');
            sendRestSystemNotification(
              'Отдых закончился! ⚡',
              activeRestExerciseName ? `Пора выполнять подход: ${activeRestExerciseName}` : 'Время отдыха вышло — к снаряду!',
              true
            );
          } else {
            // Audio countdown beeps (3, 2, 1) and tactile haptics
            if (rem <= 3 && rem >= 1 && restLastNotifiedBucket !== rem) {
              restLastNotifiedBucket = rem;
              playCountdownBeep(rem);
              vibrate(35);
            } else if ((rem === 60 || rem === 30 || rem === 15 || rem === 10) && restLastNotifiedBucket !== rem) {
              restLastNotifiedBucket = rem;
              if (rem === 10) playRestBeep(false);
              sendRestSystemNotification(
                `Осталось отдыхать: ${formatDuration(rem)}`,
                activeRestExerciseName ? `Упражнение: ${activeRestExerciseName}` : 'Приготовьтесь к подходу',
                false
              );
            }
            updateRestBar();
          }
        }, 300);
      }

      function stopRestTimer(silent) {
        if (restTimerInterval) {
          clearInterval(restTimerInterval);
          restTimerInterval = null;
        }
        restEndTimestamp = 0;
        restTotalSec = 0;
        if (window.AndroidBridge && typeof window.AndroidBridge.cancelRestNotification === 'function') {
          try { window.AndroidBridge.cancelRestNotification(); } catch (e) {}
        }
        const bar = document.getElementById('rest-timer-bar');
        if (bar) bar.classList.add('hidden');
      }

      function updateRestBar() {
        const bar = document.getElementById('rest-timer-bar');
        const disp = document.getElementById('rest-timer-display');
        const prog = document.getElementById('rest-timer-progress');
        if (!bar || !disp) return;
        const rem = getRestRemainingSec();
        if (rem > 0 && state.activeWorkout && ui.tab === 'workout') {
          bar.classList.remove('hidden');
          disp.textContent = formatDuration(rem);
          if (prog && restTotalSec > 0) {
            const pct = Math.max(0, Math.min(100, (rem / restTotalSec) * 100));
            prog.style.width = `${pct}%`;
          }
        } else {
          bar.classList.add('hidden');
        }
      }

      document.addEventListener('visibilitychange', () => {
        if (!document.hidden && restEndTimestamp > 0) {
          const rem = getRestRemainingSec();
          if (rem <= 0) {
            stopRestTimer(true);
            playRestBeep(true);
            vibrate([60, 80, 60]);
            showToast('Отдых закончился — пора к подходу!');
          } else {
            updateRestBar();
          }
        }
      });

      // ============================================================
      // 7. MUSCLE INTENSITY & VOLUME ENGINE
      // ============================================================
      function computeMuscleStats(scope) {
        const stats = {};
        Object.keys(MUSCLES).forEach(k => {
          stats[k] = {
            key: k,
            name: MUSCLES[k].name,
            short: MUSCLES[k].short,
            group: MUSCLES[k].group,
            score: 0,
            effectiveSets: 0,
            rawSets: 0,
            tonnage: 0,
            exercises: {}
          };
        });

        let workoutsToProcess = [];
        let targetFullScore = 6.0;

        if (scope === 'active' && state.activeWorkout) {
          workoutsToProcess = [state.activeWorkout];
          targetFullScore = 3.2;
        } else if (scope === '7d') {
          const cutoff = Date.now() - 7 * 86400 * 1000;
          workoutsToProcess = state.history.filter(w => new Date(w.date + 'T12:00:00').getTime() >= cutoff);
          if (state.activeWorkout) workoutsToProcess.push(state.activeWorkout);
          targetFullScore = 6.5;
        } else if (scope === '30d') {
          const cutoff = Date.now() - 30 * 86400 * 1000;
          workoutsToProcess = state.history.filter(w => new Date(w.date + 'T12:00:00').getTime() >= cutoff);
          if (state.activeWorkout) workoutsToProcess.push(state.activeWorkout);
          targetFullScore = 22.0;
        } else if (scope === 'all') {
          workoutsToProcess = state.history.slice();
          if (state.activeWorkout) workoutsToProcess.push(state.activeWorkout);
          targetFullScore = Math.max(8, workoutsToProcess.length * 3.0);
        } else if (scope && scope.startsWith('preview_')) {
          const targetId = scope.replace('preview_', '');
          const days = targetId === 'week'
            ? state.program
            : state.program.filter(d => d.id === targetId);
          workoutsToProcess = days.map(d => ({
            exercises: d.exercises.map(ex => ({
              name: ex.name,
              primary: ex.primary || [],
              secondary: ex.secondary || [],
              sets: Array.from({ length: ex.sets || 3 }, () => ({
                weight: ex.defaultWeight || 0,
                reps: parseTargetReps(ex.reps),
                rir: 2,
                done: true
              }))
            }))
          }));
          targetFullScore = targetId === 'week' ? Math.max(5.5, state.program.length * 3.0) : 3.5;
        }

        const rirMultMap = { 0: 1.25, 1: 1.15, 2: 1.0, 3: 0.85 };

        workoutsToProcess.forEach(w => {
          (w.exercises || []).forEach(ex => {
            const doneSets = (ex.sets || []).filter(s => s.done && !s.isWarmup);
            if (!doneSets.length) return;

            let exScore = 0;
            let exTonnage = 0;
            doneSets.forEach(s => {
              const weight = Math.max(0, Number(s.weight) || 0);
              const reps = Math.max(0, Number(s.reps) || 0);
              const mult = rirMultMap[s.rir] != null ? rirMultMap[s.rir] : 1.0;
              const repFactor = 1 + Math.min(reps, 20) / 80;
              exScore += mult * repFactor;
              exTonnage += weight * reps;
            });

            const addHit = (muscleKey, weightFactor) => {
              if (!stats[muscleKey]) return;
              stats[muscleKey].score += exScore * weightFactor;
              stats[muscleKey].effectiveSets += doneSets.length * weightFactor;
              stats[muscleKey].rawSets += doneSets.length;
              stats[muscleKey].tonnage += Math.round(exTonnage * weightFactor);
              if (!stats[muscleKey].exercises[ex.name]) {
                stats[muscleKey].exercises[ex.name] = { sets: 0, tonnage: 0, role: weightFactor === 1 ? 'Основная' : 'Вспом.' };
              }
              stats[muscleKey].exercises[ex.name].sets += doneSets.length;
              stats[muscleKey].exercises[ex.name].tonnage += Math.round(exTonnage * weightFactor);
            };

            (ex.primary || []).forEach(m => addHit(m, 1.0));
            (ex.secondary || []).forEach(m => {
              if (!(ex.primary || []).includes(m)) addHit(m, 0.45);
            });
          });
        });

        Object.keys(stats).forEach(k => {
          const pct = Math.min(100, Math.round((stats[k].score / Math.max(1, targetFullScore)) * 100));
          stats[k].pct = pct;
        });

        return stats;
      }

        if (pct < 30) return { fill: '#b45309', opacity: 0.76, glow: 'none', label: 'Лёгкий тонус' };
        if (pct < 55) return { fill: '#f59e0b', opacity: 0.88, glow: 'none', label: 'Средний объём' };
        if (pct < 80) return { fill: '#f97316', opacity: 0.95, glow: 'drop-shadow(0 0 6px rgba(249,115,22,0.45))', label: 'Высокий объём' };
        return { fill: '#ff2d55', opacity: 1, glow: 'drop-shadow(0 0 9px rgba(255,45,85,0.6))', label: 'Пиковая нагрузка' };

      // ============================================================

      function computeMonthStats(year, month) {
        const prefix = `${year}-${String(month + 1).padStart(2, '0')}-`;
        const monthWorkouts = state.history.filter(w => String(w.date || '').startsWith(prefix));
        let sets = 0;
        let reps = 0;
        let tonnage = 0;
        monthWorkouts.forEach(w => {
          const t = calcWorkoutTotals(w);
          sets += t.doneSets;
          reps += t.doneReps;
          tonnage += t.tonnage;
        });
        return { visits: monthWorkouts.length, sets, reps, tonnage };
      }

      function buildActiveExerciseFromTemplate(ex) {
        const lastSets = getLastLoggedSetsForExercise(ex.name);
        const count = Math.max(1, Number(ex.sets) || 3);
        const targetReps = parseTargetReps(ex.reps);
        const dbMatch = ex.dbId ? findDbExerciseById(ex.dbId) : findDbExerciseByName(ex.name);
        const sets = Array.from({ length: count }, (_, idx) => {
          const prev = lastSets && lastSets[idx] ? lastSets[idx] : (lastSets && lastSets[0] ? lastSets[0] : null);
          return {
            id: uid('set'),
            weight: prev ? prev.weight : (Number(ex.defaultWeight) || 0),
            reps: prev ? prev.reps : targetReps,
            rir: prev && prev.rir != null ? prev.rir : 2,
            done: false
          };
        });
        return {
          id: uid('wex'),
          programExId: ex.id || null,
          dbId: ex.dbId || (dbMatch ? dbMatch.id : null),
          name: ex.name,
          targetReps: ex.reps || String(targetReps),
          restSec: ex.restSec || 90,
          note: ex.note || (dbMatch ? dbMatch.technique : ''),
          primary: normalizeMuscleList(ex.primary).length ? normalizeMuscleList(ex.primary) : (dbMatch ? dbMatch.primary.slice() : []),
          secondary: normalizeMuscleList(ex.secondary).length ? normalizeMuscleList(ex.secondary) : (dbMatch ? dbMatch.secondary.slice() : []),
          sets
        };
      }

      function startWorkout(dayId, targetDate) {
        const day = state.program.find(d => d.id === dayId);
        if (!day) return;

        const chosenDate = targetDate || formatDateISO(new Date());
        const exercises = day.exercises.map(buildActiveExerciseFromTemplate);

        state.activeWorkout = {
          id: uid('wk'),
          dayId: day.id,
          dayName: day.name,
          dayColor: day.color || '#30d158',
          date: chosenDate,
          startedAt: Date.now(),
          exercises
        };
        saveState();
        ensureWorkoutTimerRunning();
        ui.tab = 'workout';
        render();
        showToast(`${day.name} • ${formatDateRu(chosenDate)}`);
      }

      function startCustomWorkout(targetDate) {
        const chosenDate = targetDate || formatDateISO(new Date());
        state.activeWorkout = {
          id: uid('wk'),
          dayId: 'custom',
          dayName: 'Свободная тренировка',
          dayColor: '#bf5af2',
          date: chosenDate,
          startedAt: Date.now(),
          exercises: []
        };
        saveState();
        ensureWorkoutTimerRunning();
        ui.tab = 'workout';
        render();
        openExerciseConfigModal({ mode: 'active_add' });
      }

      function editHistoryWorkout(workoutId) {
        const orig = state.history.find(w => w.id === workoutId);
        if (!orig) return;
        const clone = JSON.parse(JSON.stringify(orig));
        clone.editingHistoryId = orig.id;
        clone.startedAt = Date.now() - (Number(orig.durationSec) || 1800) * 1000;
        state.activeWorkout = clone;
        saveState();
        ensureWorkoutTimerRunning();
        ui.tab = 'workout';
        render();
        showToast(`Редактирование: ${orig.dayName} (${formatDateRu(orig.date)})`);
      }

                  <label class="block text-[11px] text-[#8e8e98] mb-1">Подходы</label>

                </div>
                <div>
                  <label class="block text-[11px] text-[#8e8e98] mb-1">Повторения</label>
                  <input id="exm-reps" type="text" value="${escapeHtml(baseEx.reps)}" class="w-full rounded-xl bg-[#0c0c10] border border-[#2a2a35] px-2.5 py-2 text-sm text-white text-center" />
                </div>
                <div>
                  <label class="block text-[11px] text-[#8e8e98] mb-1">Вес (кг)</label>
                  <input id="exm-weight" type="number" step="0.5" min="0" value="${baseEx.defaultWeight}" class="w-full rounded-xl bg-[#0c0c10] border border-[#2a2a35] px-2.5 py-2 text-sm text-white text-center" />
                </div>
              </div>

              <div>
                <label class="block text-xs text-[#8e8e98] mb-1">Отдых между подходами (сек)</label>
                <input id="exm-rest" type="number" step="15" min="15" max="360" value="${baseEx.restSec}" class="w-full rounded-xl bg-[#0c0c10] border border-[#2a2a35] px-3 py-2 text-sm text-white" />
              </div>

              <!-- Interactive Muscle Map Selector -->
              <div class="p-3 rounded-2xl bg-[#0e0e13] border border-[#24242f] space-y-2.5">
                <div class="flex items-center justify-between gap-2">
                  <span class="text-xs font-semibold text-white">Выбор мышц на карте</span>
                  <div class="flex gap-1 p-0.5 rounded-xl bg-[#181820] border border-[#282834]">
                    <button type="button" id="paint-prim-btn" class="px-2.5 py-1 rounded-lg text-[10px] font-semibold bg-emerald-500 text-black">
                      Основная (100%)
                    </button>
                    <button type="button" id="paint-sec-btn" class="px-2.5 py-1 rounded-lg text-[10px] font-semibold text-[#9b9ba8]">
                      Вспом. (45%)
                    </button>
                  </div>
                </div>
                <p class="text-[11px] text-[#8e8e98]">Нажимайте прямо на мышцы на силуэте или выберите из списка ниже:</p>
                <div id="exm-muscle-svg-wrap"></div>

                <!-- Selected Muscles Summary Badges -->
                <div id="exm-selected-summary" class="space-y-1.5 pt-1 border-t border-[#1e1e26]"></div>

                <!-- Grouped Muscle Chips (Primary & Secondary) -->
                <details class="pt-1">
                  <summary class="text-xs font-medium text-emerald-400 cursor-pointer select-none">Открыть полный список мышц (${Object.keys(MUSCLES).length})</summary>
                  <div id="exm-muscle-chips-list" class="mt-2.5 space-y-2.5 max-h-56 overflow-y-auto pr-1"></div>
                </details>
              </div>

              <div>
                <label class="block text-xs text-[#8e8e98] mb-1">Заметка / техника выполнения</label>
                <textarea id="exm-note" rows="2" placeholder="Советы по технике..." class="w-full rounded-xl bg-[#0c0c10] border border-[#2a2a35] px-3 py-2 text-xs text-white focus:outline-none">${escapeHtml(baseEx.note || '')}</textarea>
              </div>

              <div class="flex gap-2 pt-1">
                ${mode.endsWith('_edit') ? `<button id="exm-delete-btn" type="button" class="px-4 py-3 rounded-2xl bg-red-500/15 border border-red-500/35 text-red-300 text-xs font-semibold">Удалить</button>` : ''}
                <button id="exm-save-btn" type="button" class="flex-1 py-3 rounded-2xl bg-emerald-500 text-black font-semibold text-sm active:scale-[0.98]">
                  ${mode.endsWith('_edit') ? 'Сохранить изменения' : 'Добавить упражнение'}
                </button>
              </div>
            </div>
          </div>
        `);

        const tabDbBtn = document.getElementById('exm-tab-db');
        const tabCustomBtn = document.getElementById('exm-tab-custom');
        const viewDb = document.getElementById('exm-view-db');
        const viewCustom = document.getElementById('exm-view-custom');

        function syncModalTab() {
          const isDb = pickerTab === 'db';
          tabDbBtn.className = `py-2 rounded-xl text-xs font-semibold transition-colors ${isDb ? 'bg-white text-black' : 'text-[#8e8e98]'}`;
          tabCustomBtn.className = `py-2 rounded-xl text-xs font-semibold transition-colors ${!isDb ? 'bg-white text-black' : 'text-[#8e8e98]'}`;
          viewDb.classList.toggle('hidden', !isDb);
          viewCustom.classList.toggle('hidden', isDb);
          if (!isDb) renderMusclePickerUi();
        }

        function commitExerciseObject(exObj) {
          if (mode === 'active_add') {
            if (!state.activeWorkout) return;
            state.activeWorkout.exercises.push(buildActiveExerciseFromTemplate(exObj));
            saveState();
            closeModal();
            render();
            showToast(`Добавлено: ${exObj.name}`);
          } else if (mode === 'active_edit') {
            if (!state.activeWorkout || !state.activeWorkout.exercises[exIdx]) return;
            const target = state.activeWorkout.exercises[exIdx];
            target.name = exObj.name;
            target.dbId = exObj.dbId || target.dbId;
            target.restSec = exObj.restSec;
            target.note = exObj.note;
            target.primary = exObj.primary;
            target.secondary = exObj.secondary;
            saveState();
            closeModal();
            render();
            showToast('Упражнение в тренировке обновлено');
          } else if (mode === 'program_add') {
            state.program[dayIdx].exercises.push({
              id: uid('ex'),
              dbId: exObj.dbId || null,
              name: exObj.name,
              sets: exObj.sets,
              reps: exObj.reps,
              defaultWeight: exObj.defaultWeight,
              restSec: exObj.restSec,
              note: exObj.note,
              primary: exObj.primary,
              secondary: exObj.secondary
            });
            saveState();
            closeModal();
            render();
            showToast(`Добавлено в программу: ${exObj.name}`);
          } else if (mode === 'program_edit') {
            const orig = state.program[dayIdx].exercises[exIdx];
            state.program[dayIdx].exercises[exIdx] = {
              id: orig.id,
              dbId: exObj.dbId || orig.dbId || null,
              name: exObj.name,
              sets: exObj.sets,
              reps: exObj.reps,
              defaultWeight: exObj.defaultWeight,
              restSec: exObj.restSec,
              note: exObj.note,
              primary: exObj.primary,
              secondary: exObj.secondary
            };
            saveState();
            closeModal();
            render();
            showToast('Упражнение сохранено');
          }
        }

        function renderDbBrowser() {
          const listEl = document.getElementById('exm-db-list');
          const prevEl = document.getElementById('exm-db-preview');
          const q = dbQuery.trim().toLowerCase();

          const filtered = EXERCISE_DB.filter(item => {
            if (dbCat !== 'Все' && item.category !== dbCat) return false;
            if (!q) return true;
            const mNames = [...item.primary, ...item.secondary].map(k => MUSCLES[k] ? MUSCLES[k].name.toLowerCase() : '').join(' ');
            return item.name.toLowerCase().includes(q)
              || item.category.toLowerCase().includes(q)
              || item.equipment.toLowerCase().includes(q)
              || mNames.includes(q);
          });

          if (previewDbEx) {
            const pNames = (previewDbEx.primary || []).map(k => MUSCLES[k] ? MUSCLES[k].short : k).join(', ');
            const sNames = (previewDbEx.secondary || []).map(k => MUSCLES[k] ? MUSCLES[k].short : k).join(', ');
            prevEl.classList.remove('hidden');
            prevEl.innerHTML = `
              <div class="flex items-start justify-between gap-2">
                <div>
                  <div class="text-xs font-bold text-white">${escapeHtml(previewDbEx.name)}</div>
                  <div class="text-[10px] text-emerald-300 mt-0.5">${escapeHtml(previewDbEx.category)} • ${escapeHtml(previewDbEx.equipment)} • ${previewDbEx.sets}×${escapeHtml(previewDbEx.reps)}</div>
                </div>
                <button type="button" id="close-db-prev" class="text-[#8e8e98] hover:text-white p-1">
                  <i data-lucide="x" class="w-3.5 h-3.5"></i>
                </button>
              </div>
              <div class="text-[11px] text-[#d4d4dc] leading-relaxed bg-black/40 p-2.5 rounded-xl border border-emerald-500/20">
                <strong class="text-emerald-400">Техника:</strong> ${escapeHtml(previewDbEx.technique)}
              </div>
              <div class="flex flex-wrap gap-1 text-[10px]">
                ${pNames ? `<span class="px-2 py-0.5 rounded-md bg-emerald-500/20 text-emerald-300">Осн: ${escapeHtml(pNames)}</span>` : ''}
                ${sNames ? `<span class="px-2 py-0.5 rounded-md bg-blue-500/20 text-blue-300">Вспом: ${escapeHtml(sNames)}</span>` : ''}
              </div>
              <div class="grid grid-cols-2 gap-2 pt-0.5">
                <button type="button" id="prev-customize-btn" class="py-2 rounded-xl bg-[#1e1e27] border border-[#2f2f3d] text-xs font-semibold text-white active:scale-95">
                  Настроить / Карта
                </button>
                <button type="button" id="prev-add-now-btn" class="py-2 rounded-xl bg-emerald-500 text-black text-xs font-bold active:scale-95">
                  + Добавить сразу
                </button>
              </div>
            `;
            document.getElementById('close-db-prev').addEventListener('click', () => {
              previewDbEx = null;
              renderDbBrowser();
            });
            document.getElementById('prev-customize-btn').addEventListener('click', () => {
              applyDbExerciseToCustomForm(previewDbEx);
              pickerTab = 'custom';
              syncModalTab();
            });
            document.getElementById('prev-add-now-btn').addEventListener('click', () => {
              commitExerciseObject({
                dbId: previewDbEx.id,
                name: previewDbEx.name,
                sets: previewDbEx.sets,
                reps: previewDbEx.reps,
                defaultWeight: previewDbEx.defaultWeight,
                restSec: previewDbEx.restSec,
                note: previewDbEx.technique,
                primary: previewDbEx.primary.slice(),
                secondary: previewDbEx.secondary.slice()
              });
            });
          } else {
            prevEl.classList.add('hidden');
          }

          if (!filtered.length) {
            listEl.innerHTML = `
              <div class="p-4 rounded-2xl bg-[#16161d] border border-[#252530] text-center space-y-2">
                <p class="text-xs text-[#9b9ba8]">В базе нет точного совпадения.</p>
                <button type="button" id="switch-to-create-custom" class="px-3.5 py-2 rounded-xl bg-emerald-500 text-black text-xs font-semibold">
                  Создать «${escapeHtml(dbQuery || 'своё упражнение')}»
                </button>
              </div>
            `;
            document.getElementById('switch-to-create-custom').addEventListener('click', () => {
              if (dbQuery.trim()) document.getElementById('exm-name').value = dbQuery.trim();
              pickerTab = 'custom';
              syncModalTab();
            });
            if (window.lucide) window.lucide.createIcons();
            return;
          }

          listEl.innerHTML = filtered.map(item => {
            const primBadges = (item.primary || []).map(k => MUSCLES[k] ? MUSCLES[k].short : k).join(', ');
            const isSelected = previewDbEx && previewDbEx.id === item.id;
            return `
              <div class="p-3 rounded-2xl bg-[#16161d] border ${isSelected ? 'border-emerald-500/50' : 'border-[#24242f]'} flex items-center justify-between gap-2">
                <button type="button" data-inspect-db="${item.id}" class="inspect-db-btn flex-1 text-left min-w-0">
                  <div class="text-xs font-semibold text-white truncate">${escapeHtml(item.name)}</div>
                  <div class="text-[10px] text-[#8e8e98] mt-0.5 truncate">${escapeHtml(item.category)} • ${escapeHtml(primBadges)}</div>
                </button>
                <div class="flex items-center gap-1.5 shrink-0">
                  <button type="button" data-inspect-db="${item.id}" class="inspect-db-btn w-8 h-8 rounded-xl bg-[#1f1f29] flex items-center justify-center text-[#9b9ba8]" title="Техника">
                    <i data-lucide="info" class="w-3.5 h-3.5"></i>
                  </button>
                  <button type="button" data-quickadd-db="${item.id}" class="quickadd-db-btn px-2.5 py-1.5 rounded-xl bg-emerald-500/15 border border-emerald-500/35 text-emerald-300 text-xs font-semibold active:scale-95">
                    +
                  </button>
                </div>
              </div>
            `;
          }).join('');

          listEl.querySelectorAll('.inspect-db-btn').forEach(btn => {
            btn.addEventListener('click', () => {
              previewDbEx = findDbExerciseById(btn.dataset.inspectDb);
              renderDbBrowser();
            });
          });
          listEl.querySelectorAll('.quickadd-db-btn').forEach(btn => {
            btn.addEventListener('click', () => {
              const item = findDbExerciseById(btn.dataset.quickaddDb);
              if (!item) return;
              commitExerciseObject({
                dbId: item.id,
                name: item.name,
                sets: item.sets,
                reps: item.reps,
                defaultWeight: item.defaultWeight,
                restSec: item.restSec,
                note: item.technique,
                primary: item.primary.slice(),
                secondary: item.secondary.slice()
              });
            });
          });

          if (window.lucide) window.lucide.createIcons();
        }

        function applyDbExerciseToCustomForm(item) {
          if (!item) return;
          activeDbId = item.id;
          document.getElementById('exm-name').value = item.name;
          document.getElementById('exm-sets').value = item.sets;
          document.getElementById('exm-reps').value = item.reps;
          document.getElementById('exm-weight').value = item.defaultWeight;
          document.getElementById('exm-rest').value = item.restSec;
          document.getElementById('exm-note').value = item.technique;

          const techBox = document.getElementById('exm-live-tech-box');
          const techText = document.getElementById('exm-live-tech-text');
          techText.textContent = item.technique;
          techBox.classList.remove('hidden');

          primarySet.clear();
          secondarySet.clear();
          (item.primary || []).forEach(k => primarySet.add(k));
          (item.secondary || []).forEach(k => { if (!primarySet.has(k)) secondarySet.add(k); });
          renderMusclePickerUi();
          showToast('Подставлены данные и техника из базы');
        }

        function renderMusclePickerUi() {
          const svgWrap = document.getElementById('exm-muscle-svg-wrap');
          const sumWrap = document.getElementById('exm-selected-summary');
          const listWrap = document.getElementById('exm-muscle-chips-list');
          if (!svgWrap) return;

          svgWrap.innerHTML = buildMuscleSvg({
            mode: 'picker',
            primarySet,
            secondarySet,
            compact: true
          });

          svgWrap.querySelectorAll('[data-muscle]').forEach(el => {
            el.addEventListener('click', () => {
              const k = el.dataset.muscle;
              if (musclePaintRole === 'primary') {
                if (primarySet.has(k)) {
                  primarySet.delete(k);
                } else {
                  secondarySet.delete(k);
                  primarySet.add(k);
                }
              } else {
                if (secondarySet.has(k)) {
                  secondarySet.delete(k);
                } else {
                  primarySet.delete(k);
                  secondarySet.add(k);
                }
              }
              renderMusclePickerUi();
            });
          });

          const primList = Array.from(primarySet);
          const secList = Array.from(secondarySet);
          sumWrap.innerHTML = `
            <div class="flex flex-wrap items-center gap-1 text-[10px]">
              <span class="text-emerald-400 font-semibold">Основные:</span>
              ${primList.length
                ? primList.map(k => `<span class="px-2 py-0.5 rounded-md bg-emerald-500/20 text-emerald-300 border border-emerald-500/35">${escapeHtml(MUSCLES[k].short)}</span>`).join('')
                : '<span class="text-[#6e6e7a]">не выбраны</span>'}
            </div>
            <div class="flex flex-wrap items-center gap-1 text-[10px]">
              <span class="text-blue-400 font-semibold">Вспомогательные:</span>
              ${secList.length
                ? secList.map(k => `<span class="px-2 py-0.5 rounded-md bg-blue-500/20 text-blue-300 border border-blue-500/35">${escapeHtml(MUSCLES[k].short)}</span>`).join('')
                : '<span class="text-[#6e6e7a]">не выбраны</span>'}
            </div>
          `;

          if (listWrap) {
            listWrap.innerHTML = MUSCLE_GROUPS_ORDER.map(grp => {
              const items = Object.entries(MUSCLES).filter(([, m]) => m.group === grp);
              if (!items.length) return '';
              return `
                <div class="space-y-1">
                  <div class="text-[10px] uppercase tracking-wider text-[#7c7c88] font-semibold">${grp}</div>
                  <div class="space-y-1">
                    ${items.map(([k, m]) => {
                      const isP = primarySet.has(k);
                      const isS = secondarySet.has(k);
                      return `
                        <div class="flex items-center justify-between gap-2 px-2.5 py-1.5 rounded-xl bg-[#15151c] border border-[#22222c]">
                          <span class="text-[11px] text-[#d8d8e0] truncate">${escapeHtml(m.name)}</span>
                          <div class="flex items-center gap-1 shrink-0">
                            <button type="button" data-setm="${k}:primary" class="setm-btn px-2 py-0.5 rounded-lg text-[10px] font-semibold border ${isP ? 'bg-emerald-500 text-black border-emerald-500' : 'bg-[#0e0e13] text-[#8e8e98] border-[#272733]'}">Осн.</button>
                            <button type="button" data-setm="${k}:secondary" class="setm-btn px-2 py-0.5 rounded-lg text-[10px] font-semibold border ${isS ? 'bg-blue-500 text-white border-blue-500' : 'bg-[#0e0e13] text-[#8e8e98] border-[#272733]'}">Вспом.</button>
                          </div>
                        </div>
                      `;
                    }).join('')}
                  </div>
                </div>
              `;
            }).join('');

            listWrap.querySelectorAll('.setm-btn').forEach(btn => {
              btn.addEventListener('click', () => {
                const [k, role] = btn.dataset.setm.split(':');
                if (role === 'primary') {
                  if (primarySet.has(k)) primarySet.delete(k);
                  else { secondarySet.delete(k); primarySet.add(k); }
                } else {
                  if (secondarySet.has(k)) secondarySet.delete(k);
                  else { primarySet.delete(k); secondarySet.add(k); }
                }
                renderMusclePickerUi();
              });
            });
          }
        }

        // Bind tab switches
        tabDbBtn.addEventListener('click', () => { pickerTab = 'db'; syncModalTab(); });
        tabCustomBtn.addEventListener('click', () => { pickerTab = 'custom'; syncModalTab(); });

        // Bind DB search & categories
        document.getElementById('exm-db-search').addEventListener('input', (e) => {
          dbQuery = e.target.value;
          renderDbBrowser();
        });
        document.querySelectorAll('.exm-cat-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            dbCat = btn.dataset.dbcat;
            document.querySelectorAll('.exm-cat-btn').forEach(b => {
              const active = b.dataset.dbcat === dbCat;
              b.className = `exm-cat-btn px-3 py-1.5 rounded-xl text-[11px] font-semibold whitespace-nowrap border ${active ? 'bg-white text-black border-white' : 'bg-[#181820] text-[#9b9ba8] border-[#262632]'}`;
            });
            renderDbBrowser();
          });
        });

        // Bind Paint Role Toggle on Muscle Map
        const paintPrimBtn = document.getElementById('paint-prim-btn');
        const paintSecBtn = document.getElementById('paint-sec-btn');
        paintPrimBtn.addEventListener('click', () => {
          musclePaintRole = 'primary';
          paintPrimBtn.className = 'px-2.5 py-1 rounded-lg text-[10px] font-semibold bg-emerald-500 text-black';
          paintSecBtn.className = 'px-2.5 py-1 rounded-lg text-[10px] font-semibold text-[#9b9ba8]';
        });
        paintSecBtn.addEventListener('click', () => {
          musclePaintRole = 'secondary';
          paintSecBtn.className = 'px-2.5 py-1 rounded-lg text-[10px] font-semibold bg-blue-500 text-white';
          paintPrimBtn.className = 'px-2.5 py-1 rounded-lg text-[10px] font-semibold text-[#9b9ba8]';
        });

        // Bind Live Autocomplete when typing exercise name
        const nameInput = document.getElementById('exm-name');
        const acBox = document.getElementById('exm-autocomplete');
        nameInput.addEventListener('input', () => {
          const val = nameInput.value.trim().toLowerCase();
          if (val.length < 2) {
            acBox.classList.add('hidden');
            return;
          }
          const matches = EXERCISE_DB.filter(item =>
            item.name.toLowerCase().includes(val) ||
            val.split(/\s+/).every(tok => tok.length >= 2 && item.name.toLowerCase().includes(tok))
          ).slice(0, 5);

          if (!matches.length) {
            acBox.classList.add('hidden');
            return;
          }

          acBox.classList.remove('hidden');
          acBox.innerHTML = `
            <div class="px-3 py-1.5 bg-[#121218] border-b border-[#24242f] text-[10px] uppercase tracking-wider text-emerald-400 font-semibold">
              Похожие из базы (нажмите, чтобы подставить)
            </div>
            ${matches.map(m => `
              <button type="button" data-ac-id="${m.id}" class="ac-pick-btn w-full text-left px-3 py-2.5 border-b border-[#22222c] last:border-b-0 hover:bg-white/5 flex items-center justify-between gap-2">
                <div class="min-w-0">
                  <div class="text-xs font-semibold text-white truncate">${escapeHtml(m.name)}</div>
                  <div class="text-[10px] text-[#8e8e98] truncate">${escapeHtml(m.category)} • ${(m.primary || []).map(k => MUSCLES[k] ? MUSCLES[k].short : k).join(', ')}</div>
                </div>
                <span class="text-[10px] font-semibold text-emerald-400 shrink-0">Выбрать</span>
              </button>
            `).join('')}
          `;

          acBox.querySelectorAll('.ac-pick-btn').forEach(btn => {
            btn.addEventListener('click', () => {
              const found = findDbExerciseById(btn.dataset.acId);
              acBox.classList.add('hidden');
              if (found) applyDbExerciseToCustomForm(found);
            });
          });
        });

        // Save button in Custom Form
        document.getElementById('exm-save-btn').addEventListener('click', () => {
          const name = (document.getElementById('exm-name').value || '').trim();
          if (!name) { showToast('Введите название упражнения', 'error'); return; }
          commitExerciseObject({
            dbId: activeDbId,
            name,
            sets: Math.max(1, parseInt(document.getElementById('exm-sets').value, 10) || 3),
            reps: (document.getElementById('exm-reps').value || '10').trim(),
            defaultWeight: Math.max(0, Number(document.getElementById('exm-weight').value) || 0),
            restSec: Math.max(15, parseInt(document.getElementById('exm-rest').value, 10) || 90),
            note: (document.getElementById('exm-note').value || '').trim(),
            primary: Array.from(primarySet),
            secondary: Array.from(secondarySet).filter(k => !primarySet.has(k))
          });
        });

        // Delete button if editing
        const delBtn = document.getElementById('exm-delete-btn');
        if (delBtn) {
          delBtn.addEventListener('click', () => {
            if (mode === 'active_edit' && state.activeWorkout) {
              state.activeWorkout.exercises.splice(exIdx, 1);
            } else if (mode === 'program_edit' && state.program[dayIdx]) {
              state.program[dayIdx].exercises.splice(exIdx, 1);
            }
            saveState();
            closeModal();
            render();
            showToast('Упражнение удалено');
          });
        }

        renderDbBrowser();
        syncModalTab();
      }

      // ============================================================
      // 10. SET ACTIONS IN ACTIVE WORKOUT
      // ============================================================
      function toggleSetDone(exIdx, setIdx) {
        if (!state.activeWorkout) return;
        const ex = state.activeWorkout.exercises[exIdx];
        if (!ex || !ex.sets[setIdx]) return;
        const s = ex.sets[setIdx];
        s.done = !s.done;
        saveState();
        vibrate(s.done ? 25 : 10);
        if (s.done) {
          const restTime = s.isWarmup ? Math.min(60, ex.restSec || 60) : (ex.restSec || 90);
          startRestTimer(restTime, ex.name);
        }
        render();
      }

      function toggleSetWarmup(exIdx, setIdx) {
        if (!state.activeWorkout) return;
        const ex = state.activeWorkout.exercises[exIdx];
        if (!ex || !ex.sets[setIdx]) return;
        ex.sets[setIdx].isWarmup = !ex.sets[setIdx].isWarmup;
        saveState();
        render();
        showToast(ex.sets[setIdx].isWarmup ? 'Отмечен как разминочный (Р)' : 'Отмечен как рабочий подход');
      }

      function addWarmupSetToActive(exIdx) {
        if (!state.activeWorkout) return;
        const ex = state.activeWorkout.exercises[exIdx];
        if (!ex) return;
        const firstWork = ex.sets.find(s => !s.isWarmup) || ex.sets[0];
        const baseW = firstWork ? (Number(firstWork.weight) || 0) : 0;
        const warmupW = baseW > 0 ? Math.max(0, Math.round((baseW * 0.5) / 2.5) * 2.5) : 0;
        const insertIdx = ex.sets.findIndex(s => !s.isWarmup);
        const newSet = {
          id: uid('set'),
          weight: warmupW,
          reps: 10,
          rir: 3,
          isWarmup: true,
          done: false
        };
        if (insertIdx === -1) ex.sets.push(newSet);
        else ex.sets.splice(insertIdx, 0, newSet);
        saveState();
        render();
      }

      function updateSetField(exIdx, setIdx, field, value) {
        if (!state.activeWorkout) return;
        const ex = state.activeWorkout.exercises[exIdx];
        if (!ex || !ex.sets[setIdx]) return;
        if (field === 'weight') {
          ex.sets[setIdx].weight = Math.max(0, Number(value) || 0);
        } else if (field === 'reps') {
          ex.sets[setIdx].reps = Math.max(0, Math.round(Number(value) || 0));
        } else if (field === 'rir') {
          const idx = RIR_OPTIONS.findIndex(r => r.value === ex.sets[setIdx].rir);
          const next = RIR_OPTIONS[(idx + 1) % RIR_OPTIONS.length];
          ex.sets[setIdx].rir = next.value;
          saveState();
          render();
          return;
        }
        saveState();
        updateActiveSummaryHeader();
      }

      function stepSetField(exIdx, setIdx, field, delta) {
        if (!state.activeWorkout) return;
        const ex = state.activeWorkout.exercises[exIdx];
        if (!ex || !ex.sets[setIdx]) return;
        const cur = Number(ex.sets[setIdx][field]) || 0;
        const next = Math.max(0, Math.round((cur + delta) * 10) / 10);
        ex.sets[setIdx][field] = next;
        saveState();
        render();
      }

      function addSetToActive(exIdx) {
        if (!state.activeWorkout) return;
        const ex = state.activeWorkout.exercises[exIdx];
        if (!ex) return;
        const last = ex.sets[ex.sets.length - 1];
        ex.sets.push({
          id: uid('set'),
          weight: last ? last.weight : 0,
          reps: last ? last.reps : parseTargetReps(ex.targetReps),
          rir: last ? last.rir : 2,
          done: false
        });
        saveState();
        render();
      }

      function removeSetFromActive(exIdx, setIdx) {
        if (!state.activeWorkout) return;
        const ex = state.activeWorkout.exercises[exIdx];
        if (!ex || ex.sets.length <= 1) return;
        ex.sets.splice(setIdx, 1);
        saveState();
        render();
      }

      function calcWorkoutTotals(workout) {
        let totalSets = 0;
        let doneSets = 0;
        let doneReps = 0;
        let tonnage = 0;
        (workout.exercises || []).forEach(ex => {
          (ex.sets || []).forEach(s => {
            if (s.isWarmup) return;
            totalSets++;
            if (s.done) {
              const r = Number(s.reps) || 0;
              const w = Number(s.weight) || 0;
              doneSets++;
              doneReps += r;
              tonnage += w * r;
            }
          });
        });
        return { totalSets, doneSets, doneReps, tonnage: Math.round(tonnage) };
      }

      function updateActiveSummaryHeader() {
        if (!state.activeWorkout) return;
        const totals = calcWorkoutTotals(state.activeWorkout);
        const volEl = document.getElementById('active-volume-val');
        const setsEl = document.getElementById('active-sets-val');
        const barEl = document.getElementById('active-progress-bar');
        if (volEl) volEl.textContent = `${totals.tonnage.toLocaleString('ru-RU')} кг`;
        if (setsEl) setsEl.textContent = `${totals.doneSets} / ${totals.totalSets}`;
        if (barEl) {
          const pct = totals.totalSets ? Math.round((totals.doneSets / totals.totalSets) * 100) : 0;
          barEl.style.width = `${pct}%`;
        }
      }

      function generateAndDownloadWorkoutCard(wk) {
        try {
          const canvas = document.createElement('canvas');
          const size = 1080;
          canvas.width = size;
          canvas.height = size;
          const ctx = canvas.getContext('2d');
          if (!ctx) return;

          ctx.fillStyle = '#050508';
          ctx.fillRect(0, 0, size, size);

          ctx.strokeStyle = '#1f1f2a';
          ctx.lineWidth = 4;
          ctx.strokeRect(32, 32, size - 64, size - 64);

          ctx.strokeStyle = '#d4ff00';
          ctx.lineWidth = 8;
          ctx.beginPath();
          ctx.moveTo(32, 80); ctx.lineTo(32, 32); ctx.lineTo(80, 32);
          ctx.moveTo(size - 80, 32); ctx.lineTo(size - 32, 32); ctx.lineTo(size - 32, 80);
          ctx.moveTo(32, size - 80); ctx.lineTo(32, size - 32); ctx.lineTo(80, size - 32);
          ctx.moveTo(size - 80, size - 32); ctx.lineTo(size - 32, size - 32); ctx.lineTo(size - 32, size - 80);
          ctx.stroke();

          ctx.font = 'bold 36px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
          ctx.fillStyle = '#ffffff';
          ctx.fillText('IRON GYM TRACKER', 80, 110);

          ctx.font = 'bold 22px ui-monospace, monospace';
          ctx.fillStyle = '#d4ff00';
          ctx.fillText('● COMPLETED SESSION', size - 370, 108);

          ctx.font = 'bold 56px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
          ctx.fillStyle = '#ffffff';
          const title = (wk.dayName || 'Full Body').toUpperCase();
          ctx.fillText(title, 80, 200);

          const dateStr = wk.date ? wk.date.split('-').reverse().join('.') : new Date().toLocaleDateString('ru-RU');
          ctx.font = '26px ui-monospace, monospace';
          ctx.fillStyle = '#8e8e98';
          ctx.fillText(dateStr + ' • SAMSUNG S24 ULTRA', 80, 245);

          ctx.strokeStyle = '#1e1e26';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(80, 280); ctx.lineTo(size - 80, 280);
          ctx.stroke();

          const boxW = 280;
          const boxH = 140;
          const boxY = 320;
          const metrics = [
            { label: 'ВРЕМЯ', val: formatDuration(wk.durationSec || 60), color: '#ffffff' },
            { label: 'ТОННАЖ', val: (wk.tonnage || 0).toLocaleString('ru-RU') + ' КГ', color: '#d4ff00' },
            { label: 'ПОДХОДЫ', val: `${wk.doneSets || 0} / ${wk.totalSets || 0}`, color: '#ffffff' }
          ];

          metrics.forEach((m, i) => {
            const bx = 80 + i * (boxW + 40);
            ctx.fillStyle = '#0f0f15';
            ctx.fillRect(bx, boxY, boxW, boxH);
            ctx.strokeStyle = '#232330';
            ctx.lineWidth = 2;
            ctx.strokeRect(bx, boxY, boxW, boxH);

            ctx.font = 'bold 18px ui-monospace, monospace';
            ctx.fillStyle = '#787885';
            ctx.fillText(m.label, bx + 24, boxY + 44);

            ctx.font = 'bold 38px ui-monospace, monospace';
            ctx.fillStyle = m.color;
            ctx.fillText(m.val, bx + 24, boxY + 104);
          });

          ctx.font = 'bold 24px ui-monospace, monospace';
          ctx.fillStyle = '#d4ff00';
          ctx.fillText('УПРАЖНЕНИЯ И РАБОЧИЕ ПОДХОДЫ:', 80, 520);

          let curY = 570;
          (wk.exercises || []).slice(0, 6).forEach((ex, idx) => {
            const setsDone = (ex.sets || []).filter(s => s.completed && !s.isWarmup);
            if (setsDone.length === 0) return;
            const setStr = setsDone.map(s => `${s.weight}кг×${s.reps}`).join('  |  ');

            ctx.font = 'bold 28px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
            ctx.fillStyle = '#ffffff';
            ctx.fillText(`${idx + 1}. ${ex.name}`, 80, curY);

            ctx.font = '22px ui-monospace, monospace';
            ctx.fillStyle = '#a1a1aa';
            ctx.fillText(setStr, 80, curY + 34);

            curY += 72;
          });

          ctx.font = 'bold 20px ui-monospace, monospace';
          ctx.fillStyle = '#52525e';
          ctx.fillText('IRON GYM TRACKER • PROUDLY TRAINED WITH IRON', 80, size - 80);

          const dataUrl = canvas.toDataURL('image/png');
          const link = document.createElement('a');
          link.download = `IRON_Workout_${wk.date || 'today'}.png`;
          link.href = dataUrl;
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
          showToast('Карточка тренировки сохранена в PNG!');
        } catch (e) {
          showToast('Ошибка создания карточки', 'error');
        }
      }

      // ============================================================
      // 12. RENDERING: TAB 1 — WORKOUT
      // ============================================================
      function renderWorkoutTab(root) {
        const headerRight = document.getElementById('header-right');

        if (!state.activeWorkout) {
          document.getElementById('header-title').textContent = 'Тренировка';
          document.getElementById('header-subtitle').textContent = `${state.planName || 'Программа'} • ${state.program.length} дн.`;

          `;
          document.getElementById('quick-edit-plan-btn').addEventListener('click', () => {
            ui.tab = 'profile';
            ui.profileSubtab = 'program';
            render();
          });

          const now = new Date();
          const monthNamesGen = ['январь', 'февраль', 'март', 'апрель', 'май', 'июнь', 'июль', 'август', 'сентябрь', 'октябрь', 'ноябрь', 'декабрь'];
          const mStats = computeMonthStats(now.getFullYear(), now.getMonth());
          const lastWorkout = state.history[0];
