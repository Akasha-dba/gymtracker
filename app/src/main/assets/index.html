<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>IRON — Трекер тренировок</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <style>
    :root {
      --bg-base: #000000;
      --bg-card: #111115;
      --bg-elevated: #191920;
      --border-subtle: #23232b;
      --text-primary: #f5f5f7;
      --text-secondary: #8e8e98;
      --accent-green: #30d158;
      --accent-blue: #0a84ff;
      --accent-orange: #ff9f0a;
      --accent-red: #ff3b30;
    }

    * {
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-base);
      color: var(--text-primary);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overscroll-behavior-y: none;
      -webkit-font-smoothing: antialiased;
    }

    body {
      min-height: 100dvh;
      overflow-x: hidden;
    }

    /* Hide number input spinners */
    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    input[type="number"] {
      -moz-appearance: textfield;
    }

    .amoled-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 22px;
    }

    .amoled-elevated {
      background: var(--bg-elevated);
      border: 1px solid #2a2a35;
      border-radius: 16px;
    }

    .nav-blur {
      background: rgba(10, 10, 14, 0.88);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid #1e1e26;
    }

    .muscle-path {
      cursor: pointer;
      transition: fill 0.35s ease, fill-opacity 0.35s ease, stroke 0.2s ease, filter 0.35s ease;
      stroke: #0b0b0f;
      stroke-width: 1.4;
      stroke-linejoin: round;
    }
    .muscle-path:hover {
      stroke: rgba(255, 255, 255, 0.65);
      stroke-width: 1.8;
    }
    .muscle-path.selected {
      stroke: #ffffff;
      stroke-width: 2.2;
    }

    .tab-btn {
      transition: color 0.2s ease, transform 0.15s ease;
    }
    .tab-btn:active {
      transform: scale(0.94);
    }

    .set-check-btn {
      transition: background-color 0.2s ease, transform 0.12s ease, border-color 0.2s ease;
    }
    .set-check-btn:active {
      transform: scale(0.9);
    }

    .toast-enter {
      animation: toastSlideUp 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes toastSlideUp {
      from { opacity: 0; transform: translate(-50%, 16px); }
      to { opacity: 1; transform: translate(-50%, 0); }
    }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    .safe-pb {
      padding-bottom: calc(88px + env(safe-area-inset-bottom, 0px));
    }
    .safe-nav-pb {
      padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
    }
  </style>
</head>
<body class="bg-black text-[#f5f5f7] selection:bg-emerald-500/30">

  <!-- Main Mobile Shell (optimized for Samsung S24 Ultra & responsive desktop) -->
  <div id="app-shell" class="max-w-md mx-auto min-h-screen relative flex flex-col bg-black">

    <!-- Top Header -->
    <header class="sticky top-0 z-30 bg-black/85 backdrop-blur-xl border-b border-[#191920] px-4 pt-3.5 pb-3 flex items-center justify-between">
      <div class="flex items-center gap-2.5 min-w-0">
        <div class="w-8 h-8 rounded-xl bg-gradient-to-br from-emerald-400 to-emerald-600 flex items-center justify-center shadow-lg shadow-emerald-500/20 shrink-0">
          <i data-lucide="dumbbell" class="w-4 h-4 text-black stroke-[2.5]"></i>
        </div>
        <div class="truncate">
          <h1 id="header-title" class="text-[17px] font-semibold tracking-tight leading-tight">Тренировка</h1>
          <p id="header-subtitle" class="text-[11px] text-[#8e8e98] leading-tight truncate">Full Body • 2 дня в неделю</p>
        </div>
      </div>
      <div id="header-right" class="flex items-center gap-2 shrink-0"></div>
    </header>

    <!-- Active Rest Timer Floating Banner (visible during workout when running) -->
    <div id="rest-timer-bar" class="hidden sticky top-[59px] z-20 mx-4 mt-2.5 px-3.5 py-2.5 rounded-2xl bg-[#131d17] border border-emerald-500/35 flex items-center justify-between shadow-lg shadow-black/60">
      <div class="flex items-center gap-2.5">
        <div class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></div>
        <div>
          <div class="text-[10px] uppercase tracking-wider text-emerald-300/80 font-medium">Отдых</div>
          <div id="rest-timer-display" class="text-lg font-bold tabular-nums leading-none text-emerald-400">02:00</div>
        </div>
      </div>
      <div class="flex items-center gap-1.5">
        <button id="rest-minus-btn" type="button" class="px-2.5 py-1.5 rounded-xl bg-black/50 border border-emerald-500/25 text-xs font-medium text-emerald-200 active:scale-95">−15с</button>
        <button id="rest-plus-btn" type="button" class="px-2.5 py-1.5 rounded-xl bg-black/50 border border-emerald-500/25 text-xs font-medium text-emerald-200 active:scale-95">+15с</button>
        <button id="rest-skip-btn" type="button" class="px-2.5 py-1.5 rounded-xl bg-emerald-500/20 text-xs font-semibold text-emerald-300 active:scale-95">Готов</button>
      </div>
    </div>

    <!-- Main Scrollable Content -->
    <main id="main-content" class="flex-1 px-4 pt-4 safe-pb space-y-4"></main>

    <!-- Bottom Navigation (Thumb-friendly One UI style) -->
    <nav class="fixed bottom-0 left-0 right-0 z-40">
      <div class="max-w-md mx-auto nav-blur px-2 pt-2 safe-nav-pb grid grid-cols-4 gap-1">
        <button type="button" data-tab="workout" class="tab-btn flex flex-col items-center justify-center py-1.5 rounded-2xl">
          <i data-lucide="play-circle" class="w-5 h-5 mb-0.5"></i>
          <span class="text-[11px] font-medium">Зал</span>
        </button>
        <button type="button" data-tab="muscles" class="tab-btn flex flex-col items-center justify-center py-1.5 rounded-2xl">
          <i data-lucide="activity" class="w-5 h-5 mb-0.5"></i>
          <span class="text-[11px] font-medium">Мышцы</span>
        </button>
        <button type="button" data-tab="history" class="tab-btn flex flex-col items-center justify-center py-1.5 rounded-2xl">
          <i data-lucide="calendar" class="w-5 h-5 mb-0.5"></i>
          <span class="text-[11px] font-medium">Календарь</span>
        </button>
        <button type="button" data-tab="profile" class="tab-btn flex flex-col items-center justify-center py-1.5 rounded-2xl">
          <i data-lucide="sliders-horizontal" class="w-5 h-5 mb-0.5"></i>
          <span class="text-[11px] font-medium">План</span>
        </button>
      </div>
    </nav>

    <!-- Modal Overlay -->
    <div id="modal-overlay" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4">
      <div id="modal-container" class="w-full max-w-md bg-[#131318] border border-[#272732] rounded-t-3xl sm:rounded-3xl max-h-[88dvh] flex flex-col overflow-hidden shadow-2xl">
        <div class="px-5 py-4 border-b border-[#22222b] flex items-center justify-between shrink-0">
          <h2 id="modal-title" class="text-base font-semibold">Модальное окно</h2>
          <button id="modal-close-btn" type="button" class="w-8 h-8 rounded-full bg-[#1e1e26] flex items-center justify-center text-[#a0a0ab] hover:text-white">
            <i data-lucide="x" class="w-4 h-4"></i>
          </button>
        </div>
        <div id="modal-body" class="p-5 overflow-y-auto space-y-4"></div>
      </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast-container" class="fixed bottom-24 left-1/2 -translate-x-1/2 z-50 pointer-events-none"></div>
  </div>

  <script>
    (function () {
      'use strict';

      // ============================================================
      // 1. CONSTANTS & MUSCLE METADATA
      // ============================================================
      const STORAGE_KEY = 'iron_gym_tracker_v1';

      const MUSCLES = {
        chest:      { name: 'Грудь',                 short: 'Грудь',        view: 'front', group: 'Верх' },
        shoulders:  { name: 'Плечи (дельты)',        short: 'Плечи',        view: 'both',  group: 'Верх' },
        biceps:     { name: 'Бицепс',                short: 'Бицепс',       view: 'front', group: 'Руки' },
        forearms:   { name: 'Предплечья',            short: 'Предплечья',   view: 'both',  group: 'Руки' },
        abs:        { name: 'Пресс и кор',           short: 'Пресс',        view: 'front', group: 'Кор' },
        quads:      { name: 'Квадрицепсы',           short: 'Квадрицепсы',  view: 'front', group: 'Ноги' },
        traps:      { name: 'Трапеции / верх спины', short: 'Трапеции',     view: 'back',  group: 'Спина' },
        lats:       { name: 'Широчайшие',            short: 'Широчайшие',   view: 'back',  group: 'Спина' },
        lower_back: { name: 'Поясница',              short: 'Поясница',     view: 'back',  group: 'Кор' },
        triceps:    { name: 'Трицепс',               short: 'Трицепс',      view: 'back',  group: 'Руки' },
        glutes:     { name: 'Ягодицы',               short: 'Ягодицы',      view: 'back',  group: 'Ноги' },
        hamstrings: { name: 'Бицепс бедра',          short: 'Задн. бедра',  view: 'back',  group: 'Ноги' },
        calves:     { name: 'Икры',                  short: 'Икры',         view: 'back',  group: 'Ноги' }
      };

      const RIR_OPTIONS = [
        { value: 2, label: 'RIR 2', mult: 1.0,  desc: '2 в запасе' },
        { value: 3, label: 'RIR 3', mult: 0.85, desc: '3 в запасе' },
        { value: 1, label: 'RIR 1', mult: 1.15, desc: '1 в запасе' },
        { value: 0, label: 'Отказ', mult: 1.25, desc: 'Максимум' }
      ];

      const DAY_COLORS = ['#30d158', '#0a84ff', '#bf5af2', '#ff9f0a', '#ff375f'];

      // User's verified Full Body program from Google Drive ("Программа тренировок Full Body")
      function getDefaultProgram() {
        return [
          {
            id: 'day_a',
            name: 'День А',
            subtitle: 'Full Body • База (Присед / Жим / Тяга)',
            color: '#30d158',
            exercises: [
              {
                id: 'ex_a1',
                name: 'Приседания со штангой (или в Смите)',
                sets: 3,
                reps: '6–8',
                defaultWeight: 60,
                restSec: 150,
                note: 'При росте 191 см держите нейтральную спину. Если заваливает вперёд — стопы чуть шире или жим ногами / кубковые приседания.',
                primary: ['quads', 'glutes'],
                secondary: ['lower_back', 'abs']
              },
              {
                id: 'ex_a2',
                name: 'Жим штанги или гантелей лёжа',
                sets: 3,
                reps: '8–10',
                defaultWeight: 45,
                restSec: 150,
                note: 'Локти под углом 45–60° к корпусу, лопатки сведены и зафиксированы. Стартовый ориентир: 45–50 кг.',
                primary: ['chest'],
                secondary: ['triceps', 'shoulders']
              },
              {
                id: 'ex_a3',
                name: 'Тяга верхнего блока к груди широким хватом',
                sets: 3,
                reps: '10–12',
                defaultWeight: 45,
                restSec: 120,
                note: 'Тяните локтями вниз к тазу, грудь раскрыта навстречу перекладине.',
                primary: ['lats'],
                secondary: ['biceps', 'traps']
              },
              {
                id: 'ex_a4',
                name: 'Румынская тяга со штангой или гантелями',
                sets: 3,
                reps: '10–12',
                defaultWeight: 50,
                restSec: 120,
                note: 'Движение начинается с отведения таза назад, колени слегка согнуты, поясница строго прямая.',
                primary: ['hamstrings', 'glutes'],
                secondary: ['lower_back', 'forearms']
              },
              {
                id: 'ex_a5',
                name: 'Жим гантелей сидя на плечи',
                sets: 3,
                reps: '10–12',
                defaultWeight: 14,
                restSec: 90,
                note: 'Спинка скамьи 75–80°, опускание гантелей до уровня мочек ушей. 2–3 рабочих подхода.',
                primary: ['shoulders'],
                secondary: ['triceps']
              },
              {
                id: 'ex_a6',
                name: 'Подъём коленей/ног в висе (или скручивания)',
                sets: 3,
                reps: '12–15',
                defaultWeight: 0,
                restSec: 75,
                note: 'Подкручивайте таз к груди, без раскачки по инерции.',
                primary: ['abs'],
                secondary: ['forearms']
              }
            ]
          },
          {
            id: 'day_b',
            name: 'День Б',
            subtitle: 'Full Body • Акцент на спину, верх груди и руки',
            color: '#0a84ff',
            exercises: [
              {
                id: 'ex_b1',
                name: 'Жим ногами в тренажёре',
                sets: 3,
                reps: '10–12',
                defaultWeight: 100,
                restSec: 150,
                note: 'Стопы чуть выше середины платформы, колени по носкам, вверху без полного «замка».',
                primary: ['quads'],
                secondary: ['glutes', 'calves']
              },
              {
                id: 'ex_b2',
                name: 'Тяга штанги или гантели в наклоне',
                sets: 3,
                reps: '8–10',
                defaultWeight: 50,
                restSec: 150,
                note: 'Горизонтальная тяга для толщины спины. Фиксируйте корпус, тяните снаряд к поясу.',
                primary: ['lats', 'traps'],
                secondary: ['biceps', 'lower_back', 'forearms']
              },
              {
                id: 'ex_b3',
                name: 'Жим гантелей на наклонной скамье (30°)',
                sets: 3,
                reps: '8–10',
                defaultWeight: 18,
                restSec: 120,
                note: 'Угол не выше 30°, чтобы нагрузка шла в верхнюю часть груди, а не в передние дельты.',
                primary: ['chest'],
                secondary: ['shoulders', 'triceps']
              },
              {
                id: 'ex_b4',
                name: 'Сгибания ног в тренажёре (лёжа или сидя)',
                sets: 3,
                reps: '12–15',
                defaultWeight: 35,
                restSec: 90,
                note: 'Изолированная работа на бицепс бедра, контролируемое опускание веса за 2 секунды.',
                primary: ['hamstrings'],
                secondary: ['calves']
              },
              {
                id: 'ex_b5',
                name: 'Махи гантелями через стороны (средняя дельта)',
                sets: 3,
                reps: '12–15',
                defaultWeight: 8,
                restSec: 75,
                note: 'Подъём через локти, мизинцы чуть выше больших пальцев, без рывков корпусом.',
                primary: ['shoulders'],
                secondary: ['traps']
              },
              {
                id: 'ex_b6',
                name: 'Суперсет на руки: Бицепс + Трицепс',
                sets: 3,
                reps: '10–12',
                defaultWeight: 20,
                restSec: 90,
                note: 'Сгибания на бицепс (10–12) без отдыха → разгибания на блоке на трицепс (10–12). 2–3 круга, отдых 90 сек.',
                primary: ['biceps', 'triceps'],
                secondary: ['forearms']
              }
            ]
          }
        ];
      }

      function getDefaultState() {
        const todayStr = formatDateISO(new Date());
        return {
          program: getDefaultProgram(),
          history: [],
          activeWorkout: null,
          profile: {
            height: 191,
            weight: 90,
            age: '',
            waist: '',
            weightLog: [
              { id: 'w_init', date: todayStr, weight: 90, waist: '' }
            ]
          }
        };
      }

      // ============================================================
      // 2. STATE & PERSISTENCE
      // ============================================================
      let state = loadState();
      let ui = {
        tab: 'workout',          // workout | muscles | history | profile
        profileSubtab: 'program', // program | body
        muscleScope: '7d',       // active | 7d | 30d | all | preview_day_a | preview_day_b | preview_week
        selectedMuscle: null,
        calYear: new Date().getFullYear(),
        calMonth: new Date().getMonth(),
        selectedDate: formatDateISO(new Date()),
        selectedStatExercise: '',
        expandedNotes: {},
        expandedHistory: {},
        showRulesCard: false
      };

      let workoutTimerInterval = null;
      let restTimerInterval = null;
      let restRemainingSec = 0;
      let restTotalSec = 0;
      let charts = { volume: null, progress: null, weight: null };

      function loadState() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return getDefaultState();
          const parsed = JSON.parse(raw);
          const def = getDefaultState();
          return {
            program: Array.isArray(parsed.program) && parsed.program.length ? parsed.program : def.program,
            history: Array.isArray(parsed.history) ? parsed.history : [],
            activeWorkout: parsed.activeWorkout || null,
            profile: Object.assign({}, def.profile, parsed.profile || {})
          };
        } catch (e) {
          return getDefaultState();
        }
      }

      function saveState() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        } catch (e) {
          // Storage unavailable in restricted context
        }
      }

      // ============================================================
      // 3. UTILITIES
      // ============================================================
      function uid(prefix) {
        return (prefix || 'id') + '_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 6);
      }

      function formatDateISO(d) {
        const dt = d instanceof Date ? d : new Date(d);
        const y = dt.getFullYear();
        const m = String(dt.getMonth() + 1).padStart(2, '0');
        const day = String(dt.getDate()).padStart(2, '0');
        return `${y}-${m}-${day}`;
      }

      function formatDateRu(iso) {
        if (!iso) return '—';
        const parts = iso.split('-');
        if (parts.length !== 3) return iso;
        const months = ['янв', 'фев', 'мар', 'апр', 'мая', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];
        const mIdx = Math.max(0, Math.min(11, parseInt(parts[1], 10) - 1));
        return `${parseInt(parts[2], 10)} ${months[mIdx]} ${parts[0]}`;
      }

      function formatDuration(sec) {
        const s = Math.max(0, Math.floor(sec || 0));
        const h = Math.floor(s / 3600);
        const m = Math.floor((s % 3600) / 60);
        const rem = s % 60;
        if (h > 0) return `${h}:${String(m).padStart(2, '0')}:${String(rem).padStart(2, '0')}`;
        return `${String(m).padStart(2, '0')}:${String(rem).padStart(2, '0')}`;
      }

      function escapeHtml(str) {
        return String(str == null ? '' : str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function vibrate(ms) {
        try {
          if (navigator && typeof navigator.vibrate === 'function') navigator.vibrate(ms || 20);
        } catch (e) {}
      }

      function playRestBeep() {
        try {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (!AudioCtx) return;
          const ctx = new AudioCtx();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(880, ctx.currentTime);
          gain.gain.setValueAtTime(0.08, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.35);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.35);
        } catch (e) {}
      }

      function showToast(msg, tone) {
        const container = document.getElementById('toast-container');
        if (!container) return;
        const colors = tone === 'error'
          ? 'bg-red-950/95 border-red-500/40 text-red-100'
          : 'bg-[#1c1c24]/95 border-emerald-500/35 text-white';
        container.innerHTML = `<div class="toast-enter px-4 py-2.5 rounded-2xl border ${colors} text-xs font-medium shadow-2xl whitespace-nowrap">${escapeHtml(msg)}</div>`;
        clearTimeout(container._t);
        container._t = setTimeout(() => { container.innerHTML = ''; }, 2400);
      }

      function parseTargetReps(repsStr) {
        const match = String(repsStr || '10').match(/\d+/);
        return match ? parseInt(match[0], 10) : 10;
      }

            function getLastLoggedSetsForExercise(exerciseName) {
        for (let i = 0; i < state.history.length; i++) {
          const w = state.history[i];
          const found = (w.exercises || []).find(ex => ex.name === exerciseName && ex.sets.some(s => s.done && !s.isWarmup));
          if (found) return found.sets.filter(s => s.done && !s.isWarmup);
        }
        return null;
      }

      // ============================================================
      // 4. TIMERS (Workout duration + Rest countdown)
      // ============================================================
      function ensureWorkoutTimerRunning() {
        if (workoutTimerInterval) {
          clearInterval(workoutTimerInterval);
          workoutTimerInterval = null;
        }
        if (!state.activeWorkout) return;
        workoutTimerInterval = setInterval(() => {
          const el = document.getElementById('active-workout-clock');
          if (el && state.activeWorkout) {
            const elapsed = Math.floor((Date.now() - state.activeWorkout.startedAt) / 1000);
            el.textContent = formatDuration(elapsed);
          }
        }, 1000);
      }

      function startRestTimer(seconds) {
        if (restTimerInterval) {
          clearInterval(restTimerInterval);
          restTimerInterval = null;
        }
        restTotalSec = Math.max(15, seconds || 90);
        restRemainingSec = restTotalSec;
        updateRestBar();
        restTimerInterval = setInterval(() => {
          restRemainingSec--;
          if (restRemainingSec <= 0) {
            stopRestTimer();
            playRestBeep();
            vibrate([40, 60, 40]);
            showToast('Отдых завершён — к подходу!');
          } else {
            updateRestBar();
          }
        }, 1000);
      }

      function stopRestTimer() {
        if (restTimerInterval) {
          clearInterval(restTimerInterval);
          restTimerInterval = null;
        }
        restRemainingSec = 0;
        const bar = document.getElementById('rest-timer-bar');
        if (bar) bar.classList.add('hidden');
      }

      function updateRestBar() {
        const bar = document.getElementById('rest-timer-bar');
        const disp = document.getElementById('rest-timer-display');
        if (!bar || !disp) return;
        if (restRemainingSec > 0 && state.activeWorkout && ui.tab === 'workout') {
          bar.classList.remove('hidden');
          disp.textContent = formatDuration(restRemainingSec);
        } else {
          bar.classList.add('hidden');
        }

      // ============================================================
      // 5. MUSCLE INTENSITY & VOLUME ENGINE
      // ============================================================
      function computeMuscleStats(scope) {
        const stats = {};
        Object.keys(MUSCLES).forEach(k => {
          stats[k] = {
            key: k,
            name: MUSCLES[k].name,
            score: 0,
            effectiveSets: 0,
            rawSets: 0,
            tonnage: 0,
            exercises: {}
          };
        });

        let workoutsToProcess = [];
        let targetFullScore = 6.0; // score corresponding to 100% saturation

        if (scope === 'active' && state.activeWorkout) {
          workoutsToProcess = [state.activeWorkout];
          targetFullScore = 3.2;
        } else if (scope === '7d') {
          const cutoff = Date.now() - 7 * 86400 * 1000;
          workoutsToProcess = state.history.filter(w => new Date(w.date + 'T12:00:00').getTime() >= cutoff);
          if (state.activeWorkout) workoutsToProcess.push(state.activeWorkout);
          targetFullScore = 6.5;
        } else if (scope === '30d') {
          const cutoff = Date.now() - 30 * 86400 * 1000;
          workoutsToProcess = state.history.filter(w => new Date(w.date + 'T12:00:00').getTime() >= cutoff);
          if (state.activeWorkout) workoutsToProcess.push(state.activeWorkout);
          targetFullScore = 22.0;
        } else if (scope === 'all') {
          workoutsToProcess = state.history.slice();
          if (state.activeWorkout) workoutsToProcess.push(state.activeWorkout);
          targetFullScore = Math.max(8, workoutsToProcess.length * 3.0);
        } else if (scope && scope.startsWith('preview_')) {
          const targetId = scope.replace('preview_', '');
          const days = targetId === 'week'
            ? state.program
            : state.program.filter(d => d.id === targetId);
          workoutsToProcess = days.map(d => ({
            exercises: d.exercises.map(ex => ({
              name: ex.name,
              primary: ex.primary || [],
              secondary: ex.secondary || [],
              sets: Array.from({ length: ex.sets || 3 }, () => ({
                weight: ex.defaultWeight || 0,
                reps: parseTargetReps(ex.reps),
                rir: 2,
                done: true
              }))
            }))
          }));
          targetFullScore = targetId === 'week' ? 6.5 : 3.5;
        }

        const rirMultMap = { 0: 1.25, 1: 1.15, 2: 1.0, 3: 0.85 };

        workoutsToProcess.forEach(w => {
          (w.exercises || []).forEach(ex => {
            const doneSets = (ex.sets || []).filter(s => s.done && !s.isWarmup);
            if (!doneSets.length) return;

            let exScore = 0;
            let exTonnage = 0;
            doneSets.forEach(s => {
              const weight = Math.max(0, Number(s.weight) || 0);
              const reps = Math.max(0, Number(s.reps) || 0);
              const mult = rirMultMap[s.rir] != null ? rirMultMap[s.rir] : 1.0;
              const repFactor = 1 + Math.min(reps, 20) / 80;
              exScore += mult * repFactor;
              exTonnage += weight * reps;
            });

            const addHit = (muscleKey, weightFactor) => {
              if (!stats[muscleKey]) return;
              stats[muscleKey].score += exScore * weightFactor;
              stats[muscleKey].effectiveSets += doneSets.length * weightFactor;
              stats[muscleKey].rawSets += doneSets.length;
              stats[muscleKey].tonnage += Math.round(exTonnage * weightFactor);
              if (!stats[muscleKey].exercises[ex.name]) {
                stats[muscleKey].exercises[ex.name] = { sets: 0, tonnage: 0, role: weightFactor === 1 ? 'Основная' : 'Вспом.' };
              }
              stats[muscleKey].exercises[ex.name].sets += doneSets.length;
              stats[muscleKey].exercises[ex.name].tonnage += Math.round(exTonnage * weightFactor);
            };

            (ex.primary || []).forEach(m => addHit(m, 1.0));
            (ex.secondary || []).forEach(m => addHit(m, 0.45));
          });
        });

        Object.keys(stats).forEach(k => {
          const pct = Math.min(100, Math.round((stats[k].score / Math.max(1, targetFullScore)) * 100));
          stats[k].pct = pct;
        });

        return stats;
      }

      function getMuscleColor(pct) {
        if (!pct || pct <= 0) return { fill: '#1c1d24', opacity: 1, glow: 'none', label: 'Не работала' };
        if (pct < 30)  return { fill: '#b45309', opacity: 0.72, glow: 'none', label: 'Лёгкий тонус' };
        if (pct < 55)  return { fill: '#f59e0b', opacity: 0.86, glow: 'none', label: 'Средний объём' };
        if (pct < 80)  return { fill: '#f97316', opacity: 0.94, glow: 'drop-shadow(0 0 6px rgba(249,115,22,0.45))', label: 'Высокий объём' };
        return { fill: '#ff2d55', opacity: 1, glow: 'drop-shadow(0 0 9px rgba(255,45,85,0.6))', label: 'Пиковая нагрузка' };
      }

            // ============================================================
      // 6. WORKOUT ACTIONS
      // ============================================================
      function computeMonthStats(year, month) {
        const prefix = `${year}-${String(month + 1).padStart(2, '0')}-`;
        const monthWorkouts = state.history.filter(w => String(w.date || '').startsWith(prefix));
        let sets = 0;
        let reps = 0;
        let tonnage = 0;
        monthWorkouts.forEach(w => {
          const t = calcWorkoutTotals(w);
          sets += t.doneSets;
          reps += t.doneReps;
          tonnage += t.tonnage;
        });
        return { visits: monthWorkouts.length, sets, reps, tonnage };
      }

      function buildActiveExerciseFromTemplate(ex) {
        const lastSets = getLastLoggedSetsForExercise(ex.name);
        const count = Math.max(1, Number(ex.sets) || 3);
        const targetReps = parseTargetReps(ex.reps);
        const sets = Array.from({ length: count }, (_, idx) => {
          const prev = lastSets && lastSets[idx] ? lastSets[idx] : (lastSets && lastSets[0] ? lastSets[0] : null);
          return {
            id: uid('set'),
            weight: prev ? prev.weight : (Number(ex.defaultWeight) || 0),
            reps: prev ? prev.reps : targetReps,
            rir: prev && prev.rir != null ? prev.rir : 2,
            done: false
          };
        });
        return {
          id: uid('wex'),
          programExId: ex.id || null,
          name: ex.name,
          targetReps: ex.reps || String(targetReps),
          restSec: ex.restSec || 90,
          note: ex.note || '',
          primary: (ex.primary || []).slice(),
          secondary: (ex.secondary || []).slice(),
          sets
        };
      }

            function toggleSetDone(exIdx, setIdx) {
        if (!state.activeWorkout) return;
        const ex = state.activeWorkout.exercises[exIdx];
        if (!ex || !ex.sets[setIdx]) return;
        const s = ex.sets[setIdx];
        s.done = !s.done;
        saveState();
        vibrate(s.done ? 25 : 10);
        if (s.done) {
          const restTime = s.isWarmup ? Math.min(60, ex.restSec || 60) : (ex.restSec || 90);
          startRestTimer(restTime);
        }
        render();
      }

      function toggleSetWarmup(exIdx, setIdx) {
        if (!state.activeWorkout) return;
        const ex = state.activeWorkout.exercises[exIdx];
        if (!ex || !ex.sets[setIdx]) return;
        ex.sets[setIdx].isWarmup = !ex.sets[setIdx].isWarmup;
        saveState();
        render();
        showToast(ex.sets[setIdx].isWarmup ? 'Отмечен как разминочный (Р)' : 'Отмечен как рабочий подход');
      }

      function addWarmupSetToActive(exIdx) {
        if (!state.activeWorkout) return;
        const ex = state.activeWorkout.exercises[exIdx];
        if (!ex) return;
        const firstWork = ex.sets.find(s => !s.isWarmup) || ex.sets[0];
        const baseW = firstWork ? (Number(firstWork.weight) || 0) : 0;
        const warmupW = baseW > 0 ? Math.max(0, Math.round((baseW * 0.5) / 2.5) * 2.5) : 0;
        const insertIdx = ex.sets.findIndex(s => !s.isWarmup);
        const newSet = {
          id: uid('set'),
          weight: warmupW,
          reps: 10,
          rir: 3,
          isWarmup: true,
          done: false
        };
        if (insertIdx === -1) ex.sets.push(newSet);
        else ex.sets.splice(insertIdx, 0, newSet);
        saveState();
        render();
      }

      function updateSetField(exIdx, setIdx, field, value) {
        if (!state.activeWorkout) return;
        const ex = state.activeWorkout.exercises[exIdx];
        if (!ex || !ex.sets[setIdx]) return;
        if (field === 'weight') {
          ex.sets[setIdx].weight = Math.max(0, Number(value) || 0);
        } else if (field === 'reps') {
          ex.sets[setIdx].reps = Math.max(0, Math.round(Number(value) || 0));
        } else if (field === 'rir') {
          const idx = RIR_OPTIONS.findIndex(r => r.value === ex.sets[setIdx].rir);
          const next = RIR_OPTIONS[(idx + 1) % RIR_OPTIONS.length];
          ex.sets[setIdx].rir = next.value;
          saveState();
          render();
          return;
        }
        saveState();
        updateActiveSummaryHeader();
      }

      function stepSetField(exIdx, setIdx, field, delta) {
        if (!state.activeWorkout) return;
        const ex = state.activeWorkout.exercises[exIdx];
        if (!ex || !ex.sets[setIdx]) return;
        const cur = Number(ex.sets[setIdx][field]) || 0;
        const next = Math.max(0, Math.round((cur + delta) * 10) / 10);
        ex.sets[setIdx][field] = next;
        saveState();
        render();
      }

      function addSetToActive(exIdx) {
        if (!state.activeWorkout) return;
        const ex = state.activeWorkout.exercises[exIdx];
        if (!ex) return;
        const last = ex.sets[ex.sets.length - 1];
        ex.sets.push({
          id: uid('set'),
          weight: last ? last.weight : 0,
          reps: last ? last.reps : parseTargetReps(ex.targetReps),
          rir: last ? last.rir : 2,
          done: false
        });
        saveState();
        render();
      }

      function removeSetFromActive(exIdx, setIdx) {
        if (!state.activeWorkout) return;
        const ex = state.activeWorkout.exercises[exIdx];
        if (!ex || ex.sets.length <= 1) return;
        ex.sets.splice(setIdx, 1);
        saveState();
        render();
      }

                  function calcWorkoutTotals(workout) {
        let totalSets = 0;
        let doneSets = 0;
        let doneReps = 0;
        let tonnage = 0;
        (workout.exercises || []).forEach(ex => {
          (ex.sets || []).forEach(s => {
            if (s.isWarmup) return;
            totalSets++;
            if (s.done) {
              const r = Number(s.reps) || 0;
              const w = Number(s.weight) || 0;
              doneSets++;
              doneReps += r;
              tonnage += w * r;
            }
          });
        });
        return { totalSets, doneSets, doneReps, tonnage: Math.round(tonnage) };
      }

      function updateActiveSummaryHeader() {
        if (!state.activeWorkout) return;
        const totals = calcWorkoutTotals(state.activeWorkout);
        const volEl = document.getElementById('active-volume-val');
        const setsEl = document.getElementById('active-sets-val');
        const barEl = document.getElementById('active-progress-bar');
        if (volEl) volEl.textContent = `${totals.tonnage.toLocaleString('ru-RU')} кг`;
        if (setsEl) setsEl.textContent = `${totals.doneSets} / ${totals.totalSets}`;
        if (barEl) {

        // Build Calendar Grid (Mon-Sun)

      function renderHistoryCharts() {
        destroyCharts();

        const volCanvas = document.getElementById('volume-chart');
        if (volCanvas) {
          const recent = state.history.slice(0, 12).reverse();
          charts.volume = new Chart(volCanvas.getContext('2d'), {
            type: 'bar',
            data: {
              labels: recent.map(w => formatDateRu(w.date).slice(0, 6)),
              datasets: [{
                label: 'Тоннаж (кг)',
                data: recent.map(w => w.tonnage || 0),
                backgroundColor: recent.map(w => w.dayColor || '#30d158'),
                borderRadius: 8,
                maxBarThickness: 28
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: { legend: { display: false } },
              scales: {
                x: { grid: { display: false }, ticks: { color: '#8e8e98', font: { size: 10 } } },
                y: { grid: { color: '#1f1f27' }, ticks: { color: '#8e8e98', font: { size: 10 } }, beginAtZero: true }
              }
            }
          });
        }

        // 2. Exercise Max Weight Progression Chart
        const progCanvas = document.getElementById('progress-chart');
        if (progCanvas && ui.selectedStatExercise) {
          const points = [];
          state.history.slice().reverse().forEach(w => {
            const ex = (w.exercises || []).find(e => e.name === ui.selectedStatExercise);
            if (!ex) return;
                        const done = (ex.sets || []).filter(s => s.done && !s.isWarmup);
            if (!done.length) return;
            const maxW = Math.max(...done.map(s => Number(s.weight) || 0));
            points.push({ label: formatDateRu(w.date).slice(0, 6), val: maxW });
          });

          charts.progress = new Chart(progCanvas.getContext('2d'), {
            type: 'line',
            data: {
              labels: points.map(p => p.label),
              datasets: [{
                label: 'Макс. вес (кг)',
                data: points.map(p => p.val),
                borderColor: '#0a84ff',
                backgroundColor: 'rgba(10,132,255,0.16)',
                fill: true,
                tension: 0.3,
                pointRadius: 4,
                pointBackgroundColor: '#0a84ff'

              responsive: true,
              maintainAspectRatio: false,
              plugins: { legend: { display: false } },
              scales: {
                x: { grid: { display: false }, ticks: { color: '#8e8e98', font: { size: 10 } } },
                y: { grid: { color: '#1f1f27' }, ticks: { color: '#8e8e98', font: { size: 10 } } }
              }
            }
          });
        }
      }

      function bindProgramEditorEvents(root) {

            const list = state.program[dIdx].exercises;
            const target = eIdx + dir;
            if (target < 0 || target >= list.length) return;
            const tmp = list[eIdx];
            list[eIdx] = list[target];
            list[target] = tmp;
            saveState();
            render();
          });
        });

        root.querySelectorAll('.edit-ex-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            const [dIdx, eIdx] = btn.dataset.editEx.split(':').map(Number);
            openExerciseEditorModal(dIdx, eIdx);

        root.querySelectorAll('.add-ex-btn').forEach(btn => {
          btn.addEventListener('click', () => openExerciseEditorModal(Number(btn.dataset.addEx), null));
        });

        root.querySelectorAll('.edit-day-btn').forEach(btn => {
          btn.addEventListener('click', () => openDayEditorModal(Number(btn.dataset.editDay)));
        });

        root.querySelectorAll('.del-day-btn').forEach(btn => {

            <p class="text-sm text-[#a8a8b3]">Восстановится ваша исходная программа Full Body (День А и День Б). История тренировок не пострадает.</p>
            <div class="flex gap-2.5 pt-2">
              <button id="rp-cancel" type="button" class="flex-1 py-3 rounded-2xl bg-[#22222b] text-sm">Отмена</button>
              <button id="rp-confirm" type="button" class="flex-1 py-3 rounded-2xl bg-amber-500 text-black font-semibold text-sm">Сбросить</button>
            </div>
          `);
          document.getElementById('rp-cancel').addEventListener('click', closeModal);
          document.getElementById('rp-confirm').addEventListener('click', () => {
            state.program = getDefaultProgram();
            saveState();
            closeModal();
            render();
            showToast('Программа Full Body восстановлена');
          });
        });
      }

      function openDayEditorModal(dayIdx) {
        const isNew = dayIdx === null;
        const day = isNew
          ? { id: uid('day'), name: `День ${state.program.length + 1}`, subtitle: 'Пользовательский день', color: DAY_COLORS[state.program.length % DAY_COLORS.length], exercises: [] }
          : state.program[dayIdx];

        openModal(isNew ? 'Новый тренировочный день' : 'Редактировать день', `
          <div class="space-y-3.5">
            <div>
              <label class="block text-xs text-[#8e8e98] mb-1">Название</label>
              <input id="day-name-inp" type="text" value="${escapeHtml(day.name)}" class="w-full rounded-xl bg-[#0c0c10] border border-[#2a2a35] px-3 py-2.5 text-sm text-white focus:outline-none focus:border-emerald-500" />
            </div>
            <div>
              <label class="block text-xs text-[#8e8e98] mb-1">Описание / акцент</label>
              <input id="day-sub-inp" type="text" value="${escapeHtml(day.subtitle || '')}" class="w-full rounded-xl bg-[#0c0c10] border border-[#2a2a35] px-3 py-2.5 text-sm text-white focus:outline-none focus:border-emerald-500" />
            </div>
            <div>
              <label class="block text-xs text-[#8e8e98] mb-1.5">Цвет в календаре</label>
              <div class="flex gap-2.5">
                ${DAY_COLORS.map(c => `
                  <button type="button" data-pick-color="${c}" class="pick-color-btn w-8 h-8 rounded-full border-2 ${day.color === c ? 'border-white scale-110' : 'border-transparent'}" style="background:${c}"></button>
                `).join('')}
              </div>
            </div>
            <button id="save-day-btn" type="button" class="w-full py-3 rounded-2xl bg-emerald-500 text-black font-semibold text-sm mt-2">Сохранить</button>
          </div>
        `);

        let chosenColor = day.color;
        document.querySelectorAll('.pick-color-btn').forEach(b => {
          b.addEventListener('click', () => {
            chosenColor = b.dataset.pickColor;
            document.querySelectorAll('.pick-color-btn').forEach(x => {
              x.classList.toggle('border-white', x === b);
              x.classList.toggle('scale-110', x === b);
              x.classList.toggle('border-transparent', x !== b);
            });
          });
        });

        document.getElementById('save-day-btn').addEventListener('click', () => {
          const name = (document.getElementById('day-name-inp').value || '').trim();
          if (!name) { showToast('Введите название дня', 'error'); return; }
          const sub = (document.getElementById('day-sub-inp').value || '').trim();
          if (isNew) {
            state.program.push(Object.assign({}, day, { name, subtitle: sub, color: chosenColor }));
          } else {
            state.program[dayIdx].name = name;
            state.program[dayIdx].subtitle = sub;
            state.program[dayIdx].color = chosenColor;
          }
          saveState();
          closeModal();
          render();
          showToast('Программа обновлена');
        });
      }

      function openExerciseEditorModal(dayIdx, exIdx) {
        const isNew = exIdx === null;
        const ex = isNew
          ? { id: uid('ex'), name: '', sets: 3, reps: '10–12', defaultWeight: 20, restSec: 90, note: '', primary: [], secondary: [] }
          : state.program[dayIdx].exercises[exIdx];

        const primarySet = new Set(ex.primary || []);
        const secondarySet = new Set(ex.secondary || []);

        const renderMuscleChips = (setObj, cls) => Object.entries(MUSCLES).map(([k, m]) => `
          <button type="button" data-mkey="${k}" class="${cls} px-2.5 py-1.5 rounded-xl text-[11px] font-medium border transition-colors ${setObj.has(k) ? (cls === 'prim-chip' ? 'bg-emerald-500/20 border-emerald-500 text-emerald-300' : 'bg-blue-500/20 border-blue-500 text-blue-300') : 'bg-[#0e0e13] border-[#252530] text-[#8e8e98]'}">
            ${escapeHtml(m.short)}
          </button>
        `).join('');

        openModal(isNew ? 'Новое упражнение' : 'Редактировать упражнение', `
          <div class="space-y-3.5">
            <div>
              <label class="block text-xs text-[#8e8e98] mb-1">Название упражнения</label>
              <input id="ex-name-inp" type="text" value="${escapeHtml(ex.name)}" placeholder="Например: Подтягивания" class="w-full rounded-xl bg-[#0c0c10] border border-[#2a2a35] px-3 py-2.5 text-sm text-white focus:outline-none focus:border-emerald-500" />
            </div>
            <div class="grid grid-cols-3 gap-2">
              <div>
                <label class="block text-[11px] text-[#8e8e98] mb-1">Подходы</label>
                <input id="ex-sets-inp" type="number" min="1" max="12" value="${ex.sets}" class="w-full rounded-xl bg-[#0c0c10] border border-[#2a2a35] px-3 py-2 text-sm text-white text-center" />
              </div>
              <div>
                <label class="block text-[11px] text-[#8e8e98] mb-1">Повторения</label>
                <input id="ex-reps-inp" type="text" value="${escapeHtml(ex.reps)}" class="w-full rounded-xl bg-[#0c0c10] border border-[#2a2a35] px-3 py-2 text-sm text-white text-center" />
              </div>
              <div>
                <label class="block text-[11px] text-[#8e8e98] mb-1">Вес (кг)</label>
                <input id="ex-weight-inp" type="number" step="0.5" min="0" value="${ex.defaultWeight}" class="w-full rounded-xl bg-[#0c0c10] border border-[#2a2a35] px-3 py-2 text-sm text-white text-center" />
              </div>
            </div>
            <div>
              <label class="block text-xs text-[#8e8e98] mb-1">Отдых между подходами (сек)</label>
              <input id="ex-rest-inp" type="number" step="15" min="15" max="360" value="${ex.restSec}" class="w-full rounded-xl bg-[#0c0c10] border border-[#2a2a35] px-3 py-2 text-sm text-white" />
            </div>
            <div>
              <label class="block text-xs text-[#8e8e98] mb-1.5">Основные мышцы (100% на карту)</label>
              <div class="flex flex-wrap gap-1.5">${renderMuscleChips(primarySet, 'prim-chip')}</div>
            </div>
            <div>
              <label class="block text-xs text-[#8e8e98] mb-1.5">Вспомогательные мышцы (45% на карту)</label>
              <div class="flex flex-wrap gap-1.5">${renderMuscleChips(secondarySet, 'sec-chip')}</div>
            </div>
            <div>
              <label class="block text-xs text-[#8e8e98] mb-1">Заметка по технике</label>
              <textarea id="ex-note-inp" rows="2" class="w-full rounded-xl bg-[#0c0c10] border border-[#2a2a35] px-3 py-2 text-xs text-white focus:outline-none">${escapeHtml(ex.note || '')}</textarea>
            </div>
            <div class="flex gap-2 pt-1">
              ${!isNew ? `<button id="del-ex-btn" type="button" class="px-4 py-3 rounded-2xl bg-red-500/15 border border-red-500/35 text-red-300 text-xs font-semibold">Удалить</button>` : ''}
              <button id="save-ex-btn" type="button" class="flex-1 py-3 rounded-2xl bg-emerald-500 text-black font-semibold text-sm">Сохранить</button>
            </div>
          </div>
        `);

        document.querySelectorAll('.prim-chip').forEach(b => {
          b.addEventListener('click', () => {
            const k = b.dataset.mkey;
            if (primarySet.has(k)) {
              primarySet.delete(k);
              b.className = 'prim-chip px-2.5 py-1.5 rounded-xl text-[11px] font-medium border transition-colors bg-[#0e0e13] border-[#252530] text-[#8e8e98]';
            } else {
              primarySet.add(k);
              b.className = 'prim-chip px-2.5 py-1.5 rounded-xl text-[11px] font-medium border transition-colors bg-emerald-500/20 border-emerald-500 text-emerald-300';
            }
          });
        });

        document.querySelectorAll('.sec-chip').forEach(b => {
          b.addEventListener('click', () => {
            const k = b.dataset.mkey;
            if (secondarySet.has(k)) {
              secondarySet.delete(k);
              b.className = 'sec-chip px-2.5 py-1.5 rounded-xl text-[11px] font-medium border transition-colors bg-[#0e0e13] border-[#252530] text-[#8e8e98]';
            } else {
              secondarySet.add(k);
              b.className = 'sec-chip px-2.5 py-1.5 rounded-xl text-[11px] font-medium border transition-colors bg-blue-500/20 border-blue-500 text-blue-300';
            }
          });
        });

        document.getElementById('save-ex-btn').addEventListener('click', () => {
          const name = (document.getElementById('ex-name-inp').value || '').trim();
          if (!name) { showToast('Укажите название упражнения', 'error'); return; }
          const updated = {
            id: ex.id,
            name,
            sets: Math.max(1, parseInt(document.getElementById('ex-sets-inp').value, 10) || 3),
            reps: (document.getElementById('ex-reps-inp').value || '10').trim(),
            defaultWeight: Math.max(0, Number(document.getElementById('ex-weight-inp').value) || 0),
            restSec: Math.max(15, parseInt(document.getElementById('ex-rest-inp').value, 10) || 90),
            note: (document.getElementById('ex-note-inp').value || '').trim(),
            primary: Array.from(primarySet),
            secondary: Array.from(secondarySet).filter(k => !primarySet.has(k))
          };
          if (isNew) {
            state.program[dayIdx].exercises.push(updated);
          } else {
            state.program[dayIdx].exercises[exIdx] = updated;
          }
          saveState();
          closeModal();
          render();
          showToast('Упражнение сохранено');
        });

        const delBtn = document.getElementById('del-ex-btn');
        if (delBtn) {
          delBtn.addEventListener('click', () => {
            state.program[dayIdx].exercises.splice(exIdx, 1);
            saveState();
            closeModal();
            render();
            showToast('Упражнение удалено');
          });
        }
      }

      // BODY PROFILE (Weight, Height, Age, BMI, Weight Log, Export/Import)
      function renderBodyProfileHtml() {
        const p = state.profile;
        const hM = (Number(p.height) || 0) / 100;
        const wKg = Number(p.weight) || 0;
        const bmi = (hM > 0 && wKg > 0) ? (wKg / (hM * hM)) : null;
        let bmiLabel = '—';
        let bmiColor = 'text-[#8e8e98]';
        if (bmi) {
          if (bmi < 18.5) { bmiLabel = 'Дефицит'; bmiColor = 'text-blue-400'; }
          else if (bmi < 25) { bmiLabel = 'Норма'; bmiColor = 'text-emerald-400'; }
          else if (bmi < 30) { bmiLabel = 'Выше нормы'; bmiColor = 'text-amber-400'; }
          else { bmiLabel = 'Высокий'; bmiColor = 'text-red-400'; }
        }

        const log = Array.isArray(p.weightLog) ? p.weightLog : [];

        return `
          <div class="space-y-3.5">
            <!-- Core Anthropometrics -->
            <div class="amoled-card p-4 space-y-3.5">
              <div class="flex items-center justify-between">
                <h3 class="text-xs uppercase tracking-wider text-[#8e8e98] font-semibold">Антропометрия</h3>
                ${bmi ? `<span class="text-xs font-semibold ${bmiColor}">ИМТ ${bmi.toFixed(1)} • ${bmiLabel}</span>` : ''}
              </div>
              <div class="grid grid-cols-2 gap-2.5">
                <div>
                  <label class="block text-[11px] text-[#8e8e98] mb-1">Вес (кг)</label>
                  <input id="prof-weight" type="number" step="0.1" min="20" max="300" value="${escapeHtml(p.weight)}" class="w-full rounded-xl bg-[#0c0c10] border border-[#2a2a35] px-3 py-2.5 text-base font-bold text-white tabular-nums focus:outline-none focus:border-emerald-500" />
                </div>
                <div>
                  <label class="block text-[11px] text-[#8e8e98] mb-1">Рост (см)</label>
                  <input id="prof-height" type="number" step="1" min="100" max="250" value="${escapeHtml(p.height)}" class="w-full rounded-xl bg-[#0c0c10] border border-[#2a2a35] px-3 py-2.5 text-base font-bold text-white tabular-nums focus:outline-none focus:border-emerald-500" />
                </div>
                <div>
                  <label class="block text-[11px] text-[#8e8e98] mb-1">Возраст (лет)</label>
                  <input id="prof-age" type="number" step="1" min="10" max="110" placeholder="Укажите" value="${escapeHtml(p.age)}" class="w-full rounded-xl bg-[#0c0c10] border border-[#2a2a35] px-3 py-2.5 text-base font-bold text-white tabular-nums focus:outline-none focus:border-emerald-500" />
                </div>
                <div>
                  <label class="block text-[11px] text-[#8e8e98] mb-1">Талия (см, опц.)</label>
                  <input id="prof-waist" type="number" step="0.5" min="40" max="200" placeholder="—" value="${escapeHtml(p.waist)}" class="w-full rounded-xl bg-[#0c0c10] border border-[#2a2a35] px-3 py-2.5 text-base font-bold text-white tabular-nums focus:outline-none focus:border-emerald-500" />
                </div>
              </div>
              <button id="save-profile-btn" type="button" class="w-full py-3 rounded-2xl bg-emerald-500 text-black font-semibold text-sm active:scale-[0.98]">
                Сохранить и записать замер
              </button>
            </div>

            <!-- Weight Dynamics Chart -->
            <div class="amoled-card p-4 space-y-3">
              <div class="flex items-center justify-between">
                <h3 class="text-xs uppercase tracking-wider text-[#8e8e98] font-semibold">Динамика веса</h3>
                <span class="text-xs text-[#8e8e98] tabular-nums">${log.length} зам.</span>
              </div>
              <div class="relative h-48 w-full">
                <canvas id="weight-chart"></canvas>
              </div>
              <div class="space-y-1.5 pt-2 border-t border-[#1e1e26] max-h-48 overflow-y-auto">
                ${log.slice().reverse().map(entry => `
                  <div class="flex items-center justify-between text-xs py-1.5 px-2 rounded-xl bg-[#16161d]">
                    <span class="text-[#a5a5b2]">${formatDateRu(entry.date)}</span>
                    <div class="flex items-center gap-3">
                      <span class="font-semibold text-white tabular-nums">${entry.weight} кг${entry.waist ? ` • ${entry.waist} см` : ''}</span>
                      ${log.length > 1 ? `
                        <button type="button" data-del-wlog="${entry.id}" class="del-wlog-btn text-[#6e6e7a] hover:text-red-400">
                          <i data-lucide="x" class="w-3.5 h-3.5"></i>
                        </button>
                      ` : ''}
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>

            <!-- Backup & Android PWA Tip -->
            <div class="amoled-card p-4 space-y-3">
              <h3 class="text-xs uppercase tracking-wider text-[#8e8e98] font-semibold">Резервная копия (JSON)</h3>
              <p class="text-xs text-[#8e8e98] leading-relaxed">Данные хранятся локально в памяти телефона. Можно скачать бэкап или перенести на другое устройство.</p>
              <div class="grid grid-cols-2 gap-2.5">
                <button id="export-json-btn" type="button" class="py-2.5 rounded-xl bg-[#1a1a22] border border-[#2a2a36] text-xs font-semibold text-white flex items-center justify-center gap-1.5 active:scale-95">
                  <i data-lucide="download" class="w-3.5 h-3.5"></i> Экспорт
                </button>
                <label class="py-2.5 rounded-xl bg-[#1a1a22] border border-[#2a2a36] text-xs font-semibold text-white flex items-center justify-center gap-1.5 active:scale-95 cursor-pointer">
                  <i data-lucide="upload" class="w-3.5 h-3.5"></i> Импорт
                  <input id="import-json-inp" type="file" accept="application/json" class="hidden" />
                </label>
              </div>
            </div>
          </div>
        `;
      }

      function bindBodyProfileEvents(root) {
        document.getElementById('save-profile-btn').addEventListener('click', () => {
          const weight = Number(document.getElementById('prof-weight').value);
          const height = Number(document.getElementById('prof-height').value);
          const ageRaw = document.getElementById('prof-age').value.trim();
          const waistRaw = document.getElementById('prof-waist').value.trim();

          if (!weight || weight < 20) { showToast('Введите корректный вес', 'error'); return; }
          if (!height || height < 100) { showToast('Введите корректный рост', 'error'); return; }

          state.profile.weight = weight;
          state.profile.height = height;
          state.profile.age = ageRaw ? parseInt(ageRaw, 10) : '';
          state.profile.waist = waistRaw ? Number(waistRaw) : '';

          const today = formatDateISO(new Date());
          if (!Array.isArray(state.profile.weightLog)) state.profile.weightLog = [];
          const existingIdx = state.profile.weightLog.findIndex(e => e.date === today);
          if (existingIdx >= 0) {
            state.profile.weightLog[existingIdx].weight = weight;
            state.profile.weightLog[existingIdx].waist = state.profile.waist;
          } else {
            state.profile.weightLog.push({ id: uid('w'), date: today, weight, waist: state.profile.waist });
          }
          saveState();
          render();
          showToast('Параметры сохранены');
        });

        root.querySelectorAll('.del-wlog-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            const id = btn.dataset.delWlog;
            state.profile.weightLog = state.profile.weightLog.filter(e => e.id !== id);
            saveState();
            render();
          });
        });

        document.getElementById('export-json-btn').addEventListener('click', () => {
          const jsonStr = JSON.stringify(state, null, 2);
          const fname = `iron_gym_backup_${formatDateISO(new Date())}.json`;
          if (window.AndroidBridge && typeof window.AndroidBridge.exportBackup === 'function') {
            window.AndroidBridge.exportBackup(fname, jsonStr);
            return;
          }
          const blob = new Blob([jsonStr], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `iron_gym_backup_${formatDateISO(new Date())}.json`;
          document.body.appendChild(a);
          a.click();
          a.remove();
          URL.revokeObjectURL(url);
          showToast('Резервная копия скачана');
        });

        document.getElementById('import-json-inp').addEventListener('change', (ev) => {
          const file = ev.target.files && ev.target.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = () => {
            try {
              const parsed = JSON.parse(reader.result);
              if (!Array.isArray(parsed.program)) throw new Error('Invalid format');
              state = Object.assign(getDefaultState(), parsed);
              saveState();
              render();
              showToast('Данные успешно восстановлены');
            } catch (e) {
              showToast('Ошибка: некорректный JSON-файл', 'error');
            }
          };
          reader.readAsText(file);
        });
      }

      function renderWeightChart() {
        destroyCharts();
        const canvas = document.getElementById('weight-chart');
        if (!canvas || !window.Chart) return;
        const log = (state.profile.weightLog || []).slice(-14);
        if (!log.length) return;

        charts.weight = new Chart(canvas.getContext('2d'), {
          type: 'line',
          data: {
            labels: log.map(e => formatDateRu(e.date).slice(0, 6)),
            datasets: [{
              label: 'Вес (кг)',
              data: log.map(e => e.weight),
              borderColor: '#30d158',
              backgroundColor: 'rgba(48,209,88,0.14)',
              fill: true,
              tension: 0.3,
              pointRadius: 4,
              pointBackgroundColor: '#30d158'
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
              x: { grid: { display: false }, ticks: { color: '#8e8e98', font: { size: 10 } } },
              y: { grid: { color: '#1f1f27' }, ticks: { color: '#8e8e98', font: { size: 10 } } }
            }
          }
        });
      }

      // ============================================================
      // 12. MASTER RENDER & INIT
      // ============================================================
      function updateNavStyles() {
        document.querySelectorAll('.tab-btn').forEach(btn => {
          const active = btn.dataset.tab === ui.tab;
          btn.classList.toggle('text-emerald-400', active);
          btn.classList.toggle('text-[#787885]', !active);
        });
      }

      function render() {
        destroyCharts();
        updateNavStyles();
        updateRestBar();

        const root = document.getElementById('main-content');
        if (ui.tab === 'workout') renderWorkoutTab(root);
        else if (ui.tab === 'muscles') renderMusclesTab(root);
        else if (ui.tab === 'history') renderHistoryTab(root);
        else if (ui.tab === 'profile') renderProfileTab(root);

        if (window.lucide) window.lucide.createIcons();
      }

      // Global static listeners
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          ui.tab = btn.dataset.tab;
          render();
          window.scrollTo({ top: 0, behavior: 'instant' });
        });
      });

      document.getElementById('modal-close-btn').addEventListener('click', closeModal);
      document.getElementById('modal-overlay').addEventListener('click', (e) => {
        if (e.target.id === 'modal-overlay') closeModal();
      });

      document.getElementById('rest-minus-btn').addEventListener('click', () => {
        restRemainingSec = Math.max(5, restRemainingSec - 15);
        updateRestBar();
      });
      document.getElementById('rest-plus-btn').addEventListener('click', () => {
        restRemainingSec += 15;
        updateRestBar();
      });
      document.getElementById('rest-skip-btn').addEventListener('click', stopRestTimer);

      // Start app
      ensureWorkoutTimerRunning();
      render();
    })();
  </script>
</body>
</html>
