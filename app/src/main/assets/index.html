<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>IRON — Трекер тренировок (Offline)</title>
  <style>
    :root {
      --bg-base: #000000;
      --bg-card: #09090c;
      --bg-elevated: #111116;
      --bg-input: #060608;
      --border: #181820;
      --border-strong: #23232c;
      --text: #ffffff;
      --text-dim: #a1a1aa;
      --text-muted: #71717a;
      --text-faint: #44444e;
      --green: #d4ff00;
      --green-bg: rgba(212, 255, 0, 0.07);
      --green-border: rgba(212, 255, 0, 0.28);
      --blue: #38bdf8;
      --amber: #f59e0b;
      --amber-bg: rgba(245, 158, 11, 0.08);
      --amber-border: rgba(245, 158, 11, 0.28);
      --red: #ff3b30;
      --red-bg: rgba(255, 59, 48, 0.12);
      --red-border: rgba(255, 59, 48, 0.35);
      --purple: #c084fc;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg-base);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      overscroll-behavior-y: none;
      line-height: 1.4;
      letter-spacing: -0.01em;
    }

    body {
      min-height: 100dvh;
      overflow-x: hidden;
    }

    button, input, textarea, select {
      font-family: inherit;
      color: inherit;
    }

    button {
      cursor: pointer;
      border: none;
      background: transparent;
      padding: 0;
    }

    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    input[type="number"] {
      -moz-appearance: textfield;
    }

    /* Layout shell */
    .app-shell {
      max-width: 448px;
      margin: 0 auto;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      position: relative;
      background: var(--bg-base);
    }

    .top-header {
      position: sticky;
      top: 0;
      z-index: 30;
      background: rgba(0, 0, 0, 0.94);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      padding: 13px 16px 11px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .brand-icon {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      background: #111116;
      border: 1px solid #23232e;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--green);
      flex-shrink: 0;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
    }

    .main-content {
      flex: 1;
      padding: 14px 14px calc(92px + env(safe-area-inset-bottom, 0px));
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Cards & surfaces */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 15px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.03);
    }

    .card-highlight {
      border-color: var(--green-border);
    }

    .subcard {
      background: var(--bg-elevated);
      border: 1px solid #1e1e27;
      border-radius: 10px;
      padding: 12px;
    }

    .row-box {
      background: #0d0d12;
      border: 1px solid var(--border);
      border-radius: 10px;
    }

    /* Typography helpers */
    .t-xs { font-size: 11px; }
    .t-sm { font-size: 13px; }
    .t-md { font-size: 15px; }
    .t-lg { font-size: 18px; }
    .t-xl { font-size: 21px; }
    .fw-500 { font-weight: 500; }
    .fw-600 { font-weight: 600; }
    .fw-700 { font-weight: 700; }
    .muted { color: var(--text-muted); }
    .dim { color: var(--text-dim); }
    .faint { color: var(--text-faint); }
    .c-green { color: var(--green); }
    .c-amber { color: #f59e0b; }
    .c-red { color: var(--red); }
    .c-blue { color: #38bdf8; }
    .c-purple { color: #c084fc; }
    .num { font-variant-numeric: tabular-nums; font-family: ui-monospace, SFMono-Regular, monospace; }
    .upper { text-transform: uppercase; letter-spacing: 0.08em; }
    .truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* Flex & Grid helpers */
    .flex { display: flex; }
    .flex-col { display: flex; flex-direction: column; }
    .items-center { align-items: center; }
    .items-start { align-items: flex-start; }
    .justify-between { justify-content: space-between; }
    .justify-center { justify-content: center; }
    .flex-wrap { flex-wrap: wrap; }
    .flex-1 { flex: 1; min-width: 0; }
    .shrink-0 { flex-shrink: 0; }
    .gap-1 { gap: 4px; }
    .gap-15 { gap: 6px; }
    .gap-2 { gap: 8px; }
    .gap-25 { gap: 10px; }
    .gap-3 { gap: 12px; }
    .gap-4 { gap: 16px; }
    .grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
    .grid-7 { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
    .w-full { width: 100%; }
    .text-center { text-align: center; }
    .text-left { text-align: left; }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 13px;
      padding: 12px 16px;
      letter-spacing: 0.02em;
      transition: transform 0.1s ease, opacity 0.15s ease, background 0.15s ease;
    }
    .btn:active { transform: scale(0.98); }
    .btn-primary { background: var(--green); color: #000; box-shadow: 0 0 14px rgba(212, 255, 0, 0.25); }
    .btn-secondary { background: #131318; color: var(--text); border: 1px solid var(--border-strong); }
    .btn-dashed { background: #0c0c10; color: var(--text-dim); border: 1px dashed #272733; }
    .btn-danger { background: var(--red-bg); color: #fca5a5; border: 1px solid var(--red-border); }
    .btn-amber { background: var(--amber); color: #000; }
    .btn-sm { padding: 7px 11px; font-size: 12px; border-radius: 6px; }
    .btn-xs { padding: 5px 9px; font-size: 11px; border-radius: 6px; }

    .icon-btn {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      background: #121217;
      border: 1px solid #1f1f28;
      color: var(--text-muted);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .icon-btn:active { transform: scale(0.92); }

    /* Inputs */
    .field {
      width: 100%;
      background: var(--bg-input);
      border: 1px solid var(--border-strong);
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 14px;
      color: var(--text);
      outline: none;
    }
    .field:focus { border-color: var(--green); }

    /* Badges & Chips */
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 600;
      font-family: ui-monospace, SFMono-Regular, monospace;
      letter-spacing: 0.04em;
      background: #121217;
      border: 1px solid #1f1f28;
      color: var(--text-dim);
    }
    .pill-green { background: var(--green-bg); border-color: var(--green-border); color: var(--green); }
    .pill-amber { background: var(--amber-bg); border-color: var(--amber-border); color: #f59e0b; }

    /* Rest Timer Bar */
    .rest-bar {
      position: sticky;
      top: 59px;
      z-index: 25;
      margin: 8px 14px 0;
      padding: 9px 13px;
      border-radius: 10px;
      background: #09090d;
      border: 1px solid var(--border-strong);
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.04);
    }
    .hidden { display: none !important; }

    .pulse-dot {
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: var(--green);
      box-shadow: 0 0 8px var(--green);
      animation: pulse 1.4s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(0.8); }
    }

    /* Workout Set Grid */
    .set-grid {
      display: grid;
      grid-template-columns: 28px 1fr 1fr 52px 42px;
      gap: 6px;
      align-items: center;
    }
    .set-row {
      padding: 5px 6px;
      border-radius: 8px;
      background: #0f0f14;
      border: 1px solid var(--border);
      transition: background 0.15s ease, border-color 0.15s ease;
    }
    .set-row.done-work {
      background: rgba(212, 255, 0, 0.06);
      border-color: rgba(212, 255, 0, 0.32);
    }
    .set-row.warmup {
      background: #110e08;
      border-color: rgba(245, 158, 11, 0.22);
    }
    .set-row.done-warmup {
      background: rgba(245, 158, 11, 0.08);
      border-color: rgba(245, 158, 11, 0.35);
    }

    .stepper {
      display: flex;
      align-items: center;
      background: #060608;
      border: 1px solid #1f1f28;
      border-radius: 6px;
      overflow: hidden;
      height: 38px;
    }
    .stepper button {
      width: 28px;
      height: 38px;
      font-size: 15px;
      font-weight: 700;
      font-family: ui-monospace, SFMono-Regular, monospace;
      color: var(--text-muted);
      flex-shrink: 0;
      transition: background 0.1s;
    }
    .stepper button:active { background: rgba(255, 255, 255, 0.1); color: #fff; }
    .stepper input {
      width: 100%;
      height: 38px;
      background: transparent;
      border: none;
      text-align: center;
      font-size: 14px;
      font-weight: 700;
      font-family: ui-monospace, SFMono-Regular, monospace;
      outline: none;
      color: #fff;
    }

    .check-btn {
      width: 42px;
      height: 38px;
      border-radius: 7px;
      background: #14141a;
      border: 1px solid #242430;
      color: #61616f;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      transition: all 0.12s ease;
    }
    .check-btn:active { transform: scale(0.92); }
    .check-btn.done-work {
      background: var(--green);
      border-color: var(--green);
      color: #000;
      box-shadow: 0 0 12px rgba(212, 255, 0, 0.35);
    }
    .check-btn.done-warmup {
      background: #f59e0b;
      border-color: #f59e0b;
      color: #000;
    }

    .rir-btn {
      height: 38px;
      border-radius: 6px;
      background: #060608;
      border: 1px solid #1f1f28;
      font-size: 10px;
      font-family: ui-monospace, SFMono-Regular, monospace;
      font-weight: 700;
      color: var(--text-dim);
    }

    /* Progress bar */
    .bar-track {
      width: 100%;
      height: 4px;
      border-radius: 2px;
      background: #16161d;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      border-radius: 2px;
      background: var(--green);
      box-shadow: 0 0 8px var(--green);
      transition: width 0.3s ease;
    }

    /* Bottom Navigation */
    .bottom-nav-wrap {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 40;
    }
    .bottom-nav {
      max-width: 448px;
      margin: 0 auto;
      background: rgba(6, 6, 8, 0.95);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid var(--border);
      padding: 8px 8px calc(10px + env(safe-area-inset-bottom, 0px));
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;
    }
    .tab-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      padding: 6px 4px;
      border-radius: 8px;
      color: #61616f;
      font-size: 10px;
      font-weight: 600;
      font-family: ui-monospace, SFMono-Regular, monospace;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      transition: color 0.15s;
    }
    .tab-btn.active { color: var(--green); }

    /* Calendar day cell */
    .cal-day {
      height: 42px;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #a1a1aa;
      font-size: 12px;
      font-family: ui-monospace, SFMono-Regular, monospace;
      transition: background 0.15s ease;
    }
    .cal-day.attended {
      background: rgba(212, 255, 0, 0.08);
      border: 1px solid rgba(212, 255, 0, 0.28);
      color: var(--green);
      font-weight: 700;
    }
    .cal-day.today {
      background: #14141a;
      border: 1px solid rgba(255, 255, 255, 0.22);
      color: #fff;
      font-weight: 700;
    }
    .cal-day.selected {
      background: #ffffff;
      border: 1px solid #ffffff;
      color: #000000;
      font-weight: 800;
    }

    /* Muscle SVG */
    .muscle-path {
      cursor: pointer;
      transition: fill 0.3s ease, fill-opacity 0.3s ease, stroke 0.2s ease;
      stroke: #060608;
      stroke-width: 1.4;
      stroke-linejoin: round;
    }
    .muscle-path:hover { stroke: rgba(255, 255, 255, 0.6); stroke-width: 1.8; }
    .muscle-path.selected { stroke: #ffffff; stroke-width: 2.3; }

    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: rgba(0, 0, 0, 0.88);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }
    @media (min-width: 520px) {
      .modal-overlay { align-items: center; padding: 16px; }
    }
    .modal-box {
      width: 100%;
      max-width: 448px;
      background: #0c0c10;
      border: 1px solid var(--border-strong);
      border-radius: 18px 18px 0 0;
      max-height: 88dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.9);
    }
    @media (min-width: 520px) {
      .modal-box { border-radius: 18px; }
    }
    .modal-head {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .modal-body {
      padding: 18px 20px 24px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* Toast */
    .toast-wrap {
      position: fixed;
      bottom: 88px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 60;
      pointer-events: none;
    }
    .toast-msg {
      padding: 10px 16px;
      border-radius: 8px;
      background: rgba(16, 16, 22, 0.96);
      border: 1px solid var(--green-border);
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      font-family: ui-monospace, SFMono-Regular, monospace;
      white-space: nowrap;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.75);
    }
    .toast-msg.error { background: rgba(50, 10, 10, 0.96); border-color: var(--red-border); color: #fecaca; }
    .toast-msg.pr { background: rgba(40, 28, 5, 0.96); border-color: var(--amber-border); color: #fde68a; }

    .h-scroll { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
    .h-scroll::-webkit-scrollbar { display: none; }
    .divider { border-top: 1px solid var(--border); padding-top: 10px; }
  </style>
</head>
<body>
  <div class="app-shell">
    <!-- Top Header -->
    <header class="top-header">
      <div class="flex items-center gap-25 flex-1">
        <div class="brand-icon" id="brand-icon-slot"></div>
        <div class="flex-1">
          <div id="header-title" class="t-md fw-700 truncate">Тренировка</div>
          <div id="header-subtitle" class="t-xs muted truncate">Full Body • 2 дня в неделю</div>
        </div>
      </div>
      <div id="header-right" class="flex items-center gap-2 shrink-0"></div>
    </header>

    <!-- Floating Rest Timer -->
    <div id="rest-timer-bar" class="rest-bar hidden">
      <div class="flex items-center gap-25">
        <div class="pulse-dot"></div>
        <div>
          <div class="t-xs upper c-green" style="opacity:0.8;font-size:10px;">Отдых</div>
          <div id="rest-timer-display" class="t-lg fw-700 num c-green" style="line-height:1.1;">02:00</div>
        </div>
      </div>
      <div class="flex items-center gap-15">
        <button id="rest-minus-btn" type="button" class="btn btn-xs" style="background:rgba(0,0,0,0.45);border:1px solid var(--green-border);color:#bbf7d0;">−15с</button>
        <button id="rest-plus-btn" type="button" class="btn btn-xs" style="background:rgba(0,0,0,0.45);border:1px solid var(--green-border);color:#bbf7d0;">+15с</button>
        <button id="rest-skip-btn" type="button" class="btn btn-xs" style="background:var(--green-bg);color:#86efac;">Готов</button>
      </div>
    </div>

    <!-- Main Content -->
    <main id="main-content" class="main-content"></main>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav-wrap">
      <div class="bottom-nav">
        <button type="button" data-tab="workout" class="tab-btn">
          <span class="nav-ico" data-ico="play-circle"></span>
          <span>Зал</span>
        </button>
        <button type="button" data-tab="muscles" class="tab-btn">
          <span class="nav-ico" data-ico="activity"></span>
          <span>Мышцы</span>
        </button>
        <button type="button" data-tab="history" class="tab-btn">
          <span class="nav-ico" data-ico="calendar"></span>
          <span>Календарь</span>
        </button>
        <button type="button" data-tab="profile" class="tab-btn">
          <span class="nav-ico" data-ico="sliders"></span>
          <span>План</span>
        </button>
      </div>
    </nav>

    <!-- Modal -->
    <div id="modal-overlay" class="modal-overlay hidden">
      <div class="modal-box">
        <div class="modal-head">
          <div id="modal-title" class="t-md fw-700">Окно</div>
          <button id="modal-close-btn" type="button" class="icon-btn" aria-label="Закрыть"></button>
        </div>
        <div id="modal-body" class="modal-body"></div>
      </div>
    </div>

    <!-- Toast -->
    <div id="toast-container" class="toast-wrap"></div>
  </div>

  <script>
    (function () {
      'use strict';

      // ============================================================
      // 1. BUILT-IN OFFLINE SVG ICONS (Zero CDN dependencies)
      // ============================================================
      const ICON_PATHS = {
        dumbbell: '<path d="M14.4 14.4 9.6 9.6"/><path d="M18.657 21.485a2 2 0 1 1-2.829-2.828l-1.767 1.768a2 2 0 1 1-2.829-2.829l6.364-6.364a2 2 0 1 1 2.829 2.829l-1.768 1.767a2 2 0 1 1 2.828 2.829z"/><path d="m21.5 21.5-1.4-1.4"/><path d="M3.9 3.9 2.5 2.5"/><path d="M6.404 12.768a2 2 0 1 1-2.829-2.829l1.768-1.767a2 2 0 1 1-2.828-2.829l2.828-2.828a2 2 0 1 1 2.829 2.828l1.767-1.768a2 2 0 1 1 2.829 2.829z"/>',
        'play-circle': '<circle cx="12" cy="12" r="10"/><polygon points="10 8 16 12 10 16 10 8"/>',
        play: '<polygon points="6 3 20 12 6 21 6 3" fill="currentColor"/>',
        activity: '<path d="M22 12h-2.48a2 2 0 0 0-1.93 1.46l-2.35 8.36a.25.25 0 0 1-.48 0L9.24 2.18a.25.25 0 0 0-.48 0l-2.35 8.36A2 2 0 0 1 4.49 12H2"/>',
        calendar: '<rect width="18" height="18" x="3" y="4" rx="2"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h18"/>',
        sliders: '<line x1="21" x2="14" y1="4" y2="4"/><line x1="10" x2="3" y1="4" y2="4"/><line x1="21" x2="12" y1="12" y2="12"/><line x1="8" x2="3" y1="12" y2="12"/><line x1="21" x2="16" y1="20" y2="20"/><line x1="12" x2="3" y1="20" y2="20"/><line x1="14" x2="14" y1="2" y2="6"/><line x1="8" x2="8" y1="10" y2="14"/><line x1="16" x2="16" y1="18" y2="22"/>',
        check: '<path d="M20 6 9 17l-5-5"/>',
        plus: '<path d="M5 12h14"/><path d="M12 5v14"/>',
        'plus-circle': '<circle cx="12" cy="12" r="10"/><path d="M8 12h8"/><path d="M12 8v8"/>',

      // ============================================================
      // 4. UTILITIES, 1RM & PR CALCULATIONS
      // ============================================================
      function uid(prefix) {
        return (prefix || 'id') + '_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 6);
      }

      function formatDateISO(d) {
        const dt = d instanceof Date ? d : new Date(d);
        return `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}-${String(dt.getDate()).padStart(2, '0')}`;
      }

      function formatDateRu(iso) {
        if (!iso) return '—';
        const parts = String(iso).split('-');
        if (parts.length !== 3) return iso;
        const months = ['янв', 'фев', 'мар', 'апр', 'мая', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];
        const mIdx = Math.max(0, Math.min(11, parseInt(parts[1], 10) - 1));
        return `${parseInt(parts[2], 10)} ${months[mIdx]} ${parts[0]}`;
      }

      function formatDuration(sec) {
        const s = Math.max(0, Math.floor(sec || 0));
        const h = Math.floor(s / 3600);
        const m = Math.floor((s % 3600) / 60);
        const rem = s % 60;
        if (h > 0) return `${h}:${String(m).padStart(2, '0')}:${String(rem).padStart(2, '0')}`;
        return `${String(m).padStart(2, '0')}:${String(rem).padStart(2, '0')}`;
      }

      function escapeHtml(str) {
        return String(str == null ? '' : str)
          .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
      }

      function vibrate(ms) {
        try { if (navigator && typeof navigator.vibrate === 'function') navigator.vibrate(ms || 20); } catch (e) {}
      }

      function playRestBeep() {
        try {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (!AudioCtx) return;
          const ctx = new AudioCtx();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(880, ctx.currentTime);
          gain.gain.setValueAtTime(0.08, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.35);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.35);
        } catch (e) {}
      }

      function showToast(msg, tone) {
        const container = document.getElementById('toast-container');
        if (!container) return;
        const cls = tone === 'error' ? 'toast-msg error' : tone === 'pr' ? 'toast-msg pr' : 'toast-msg';
        container.innerHTML = `<div class="${cls}">${escapeHtml(msg)}</div>`;
        clearTimeout(container._t);
        container._t = setTimeout(() => { container.innerHTML = ''; }, 2600);
      }

      function parseTargetReps(repsStr) {
        const match = String(repsStr || '10').match(/\d+/);
        return match ? parseInt(match[0], 10) : 10;
      }

      // Epley estimated 1RM formula
      function calcEpley1RM(weight, reps) {
        const w = Number(weight) || 0;
        const r = Number(reps) || 0;
        if (w <= 0 || r <= 0) return 0;
        if (r === 1) return Math.round(w * 10) / 10;
        return Math.round(w * (1 + r / 30) * 10) / 10;
      }

      function getHistoricalPRs(excludeWorkoutId) {
        const map = {};
        state.history.forEach(w => {
          if (excludeWorkoutId && w.id === excludeWorkoutId) return;
          (w.exercises || []).forEach(ex => {
            (ex.sets || []).forEach(s => {
              if (!s.done || s.isWarmup) return;
              const wt = Number(s.weight) || 0;
              const rp = Number(s.reps) || 0;
              if (wt <= 0 || rp <= 0) return;
              const est1rm = calcEpley1RM(wt, rp);
              if (!map[ex.name]) {
                map[ex.name] = { maxWeight: wt, maxWeightReps: rp, best1RM: est1rm, bestSetText: `${wt}×${rp}`, date: w.date };
              } else {
                if (wt > map[ex.name].maxWeight || (wt === map[ex.name].maxWeight && rp > map[ex.name].maxWeightReps)) {
                  map[ex.name].maxWeight = wt;
                  map[ex.name].maxWeightReps = rp;
                }
                if (est1rm > map[ex.name].best1RM) {
                  map[ex.name].best1RM = est1rm;
                  map[ex.name].bestSetText = `${wt}×${rp}`;
                  map[ex.name].date = w.date;
                }
              }
            });
          });
        });
        return map;
      }

      function getLastLoggedSetsForExercise(exerciseName, excludeWorkoutId) {
        for (let i = 0; i < state.history.length; i++) {
          const w = state.history[i];
          if (excludeWorkoutId && w.id === excludeWorkoutId) continue;
          const found = (w.exercises || []).find(ex => ex.name === exerciseName && ex.sets.some(s => s.done && !s.isWarmup));
          if (found) return found.sets.filter(s => s.done && !s.isWarmup);
        }
        return null;
      }

      // ============================================================
      // 5. OFFLINE INLINE SVG CHARTS (Zero Chart.js dependency)
      // ============================================================
      function renderSvgBarChart(items, unit) {
        if (!items || !items.length) return '';
        const w = 360, h = 155, padL = 38, padR = 10, padT = 14, padB = 26;
        const innerW = w - padL - padR;
        const innerH = h - padT - padB;
        const maxVal = Math.max(1, ...items.map(i => i.val));
        const slotW = innerW / items.length;
        const barW = Math.min(26, Math.max(8, slotW * 0.58));

        let grid = '';
        for (let g = 0; g <= 3; g++) {
          const y = padT + (innerH * g) / 3;
          const val = Math.round(maxVal * (1 - g / 3));
          const lbl = val >= 1000 ? (val / 1000).toFixed(1) + 'k' : String(val);
          grid += `<line x1="${padL}" y1="${y}" x2="${w - padR}" y2="${y}" stroke="#1f1f28" stroke-width="1"/>`;
          grid += `<text x="${padL - 6}" y="${y + 3}" text-anchor="end" fill="#7c7c88" font-size="9">${lbl}</text>`;
        }

        let bars = '';
        items.forEach((it, idx) => {
          const bh = Math.max(2, (it.val / maxVal) * innerH);
          const x = padL + idx * slotW + (slotW - barW) / 2;
          const y = padT + innerH - bh;
          bars += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${bh.toFixed(1)}" rx="5" fill="${it.color || '#30d158'}"><title>${escapeHtml(it.label)}: ${it.val} ${unit || ''}</title></rect>`;
          if (items.length <= 8 || idx % 2 === 0 || idx === items.length - 1) {
            bars += `<text x="${(x + barW / 2).toFixed(1)}" y="${h - 8}" text-anchor="middle" fill="#8e8e98" font-size="9">${escapeHtml(it.label)}</text>`;
          }
        });

        return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;display:block;">${grid}${bars}</svg>`;
      }

      function renderSvgLineChart(points, strokeColor) {
        if (!points || !points.length) return '';
        const w = 360, h = 155, padL = 38, padR = 14, padT = 16, padB = 26;
        const innerW = w - padL - padR;
        const innerH = h - padT - padB;
        const vals = points.map(p => p.val);
        let minV = Math.min(...vals);
        let maxV = Math.max(...vals);
        if (minV === maxV) { minV = Math.max(0, minV - 5); maxV = maxV + 5; }
        const span = Math.max(1, maxV - minV);

        let grid = '';
        for (let g = 0; g <= 3; g++) {
          const y = padT + (innerH * g) / 3;
          const val = Math.round((maxV - (span * g) / 3) * 10) / 10;
          grid += `<line x1="${padL}" y1="${y}" x2="${w - padR}" y2="${y}" stroke="#1f1f28" stroke-width="1"/>`;
          grid += `<text x="${padL - 6}" y="${y + 3}" text-anchor="end" fill="#7c7c88" font-size="9">${val}</text>`;
        }

        const coords = points.map((p, idx) => {
          const x = points.length === 1 ? padL + innerW / 2 : padL + (innerW * idx) / (points.length - 1);
          const y = padT + innerH - ((p.val - minV) / span) * innerH;
          return { x, y, label: p.label, val: p.val };
        });

        let lineAndArea = '';
        if (coords.length > 1) {
          const polyPts = coords.map(c => `${c.x.toFixed(1)},${c.y.toFixed(1)}`).join(' ');
          const areaPts = `${coords[0].x.toFixed(1)},${padT + innerH} ${polyPts} ${coords[coords.length - 1].x.toFixed(1)},${padT + innerH}`;
          lineAndArea += `<polygon points="${areaPts}" fill="${strokeColor}" fill-opacity="0.14"/>`;
          lineAndArea += `<polyline points="${polyPts}" fill="none" stroke="${strokeColor}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
        }

        let dots = '';
        coords.forEach((c, idx) => {
          dots += `<circle cx="${c.x.toFixed(1)}" cy="${c.y.toFixed(1)}" r="4" fill="${strokeColor}" stroke="#000" stroke-width="1.5"><title>${escapeHtml(c.label)}: ${c.val}</title></circle>`;
          if (coords.length <= 7 || idx === 0 || idx === coords.length - 1 || idx % 2 === 0) {
            dots += `<text x="${c.x.toFixed(1)}" y="${h - 8}" text-anchor="middle" fill="#8e8e98" font-size="9">${escapeHtml(c.label)}</text>`;
          }
        });

        return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;display:block;">${grid}${lineAndArea}${dots}</svg>`;
      }

      // ============================================================
      // 6. TIMERS
      // ============================================================
      function ensureWorkoutTimerRunning() {
        if (workoutTimerInterval) { clearInterval(workoutTimerInterval); workoutTimerInterval = null; }
        if (!state.activeWorkout) return;
        workoutTimerInterval = setInterval(() => {
          const el = document.getElementById('active-workout-clock');
          if (el && state.activeWorkout) {
            el.textContent = formatDuration(Math.floor((Date.now() - state.activeWorkout.startedAt) / 1000));
          }
        }, 1000);
      }

      function startRestTimer(seconds) {
        if (restTimerInterval) { clearInterval(restTimerInterval); restTimerInterval = null; }
        restRemainingSec = Math.max(15, seconds || 90);
        updateRestBar();
        restTimerInterval = setInterval(() => {
          restRemainingSec--;
          if (restRemainingSec <= 0) {
            stopRestTimer();
            playRestBeep();
            vibrate([40, 60, 40]);
            showToast('Отдых завершён — к подходу!');
          } else {
            updateRestBar();
          }
        }, 1000);
      }

      function stopRestTimer() {
        if (restTimerInterval) { clearInterval(restTimerInterval); restTimerInterval = null; }
        restRemainingSec = 0;
        const bar = document.getElementById('rest-timer-bar');
        if (bar) bar.classList.add('hidden');
      }

      function updateRestBar() {
        const bar = document.getElementById('rest-timer-bar');
        const disp = document.getElementById('rest-timer-display');
        if (!bar || !disp) return;
        if (restRemainingSec > 0 && state.activeWorkout && ui.tab === 'workout') {
          bar.classList.remove('hidden');
          disp.textContent = formatDuration(restRemainingSec);
        } else {
          bar.classList.add('hidden');
        }
      }

      // ============================================================
      // 7. MUSCLE INTENSITY & VOLUME ENGINE
      // ============================================================
      function computeMuscleStats(scope) {
        const stats = {};
        Object.keys(MUSCLES).forEach(k => {
          stats[k] = { key: k, name: MUSCLES[k].name, score: 0, effectiveSets: 0, rawSets: 0, tonnage: 0, exercises: {} };
        });

        let workoutsToProcess = [];
        let targetFullScore = 6.0;

        if (scope === 'active' && state.activeWorkout) {
          workoutsToProcess = [state.activeWorkout];
          targetFullScore = 3.2;
        } else if (scope === '7d') {
          const cutoff = Date.now() - 7 * 86400 * 1000;
          workoutsToProcess = state.history.filter(w => new Date(w.date + 'T12:00:00').getTime() >= cutoff);
          if (state.activeWorkout) workoutsToProcess.push(state.activeWorkout);
          targetFullScore = 6.5;
        } else if (scope === '30d') {
          const cutoff = Date.now() - 30 * 86400 * 1000;
          workoutsToProcess = state.history.filter(w => new Date(w.date + 'T12:00:00').getTime() >= cutoff);
          if (state.activeWorkout) workoutsToProcess.push(state.activeWorkout);
          targetFullScore = 22.0;
        } else if (scope === 'all') {
          workoutsToProcess = state.history.slice();
          if (state.activeWorkout) workoutsToProcess.push(state.activeWorkout);
          targetFullScore = Math.max(8, workoutsToProcess.length * 3.0);
        } else if (scope && scope.startsWith('preview_')) {
          const targetId = scope.replace('preview_', '');
          const days = targetId === 'week' ? state.program : state.program.filter(d => d.id === targetId);
          workoutsToProcess = days.map(d => ({
            exercises: d.exercises.map(ex => ({
              name: ex.name, primary: ex.primary || [], secondary: ex.secondary || [],
              sets: Array.from({ length: ex.sets || 3 }, () => ({ weight: ex.defaultWeight || 0, reps: parseTargetReps(ex.reps), rir: 2, done: true }))
            }))
          }));
          targetFullScore = targetId === 'week' ? 6.5 : 3.5;
        }

        const rirMultMap = { 0: 1.25, 1: 1.15, 2: 1.0, 3: 0.85 };

        workoutsToProcess.forEach(w => {
          (w.exercises || []).forEach(ex => {
            const doneSets = (ex.sets || []).filter(s => s.done && !s.isWarmup);
            if (!doneSets.length) return;
            let exScore = 0, exTonnage = 0;
            doneSets.forEach(s => {
              const weight = Math.max(0, Number(s.weight) || 0);
              const reps = Math.max(0, Number(s.reps) || 0);
              const mult = rirMultMap[s.rir] != null ? rirMultMap[s.rir] : 1.0;
              exScore += mult * (1 + Math.min(reps, 20) / 80);
              exTonnage += weight * reps;
            });
            const addHit = (mKey, factor) => {
              if (!stats[mKey]) return;
              stats[mKey].score += exScore * factor;
              stats[mKey].effectiveSets += doneSets.length * factor;
              stats[mKey].rawSets += doneSets.length;
              stats[mKey].tonnage += Math.round(exTonnage * factor);
              if (!stats[mKey].exercises[ex.name]) {
                stats[mKey].exercises[ex.name] = { sets: 0, tonnage: 0, role: factor === 1 ? 'Основная' : 'Вспом.' };
              }
              stats[mKey].exercises[ex.name].sets += doneSets.length;
              stats[mKey].exercises[ex.name].tonnage += Math.round(exTonnage * factor);
            };
            (ex.primary || []).forEach(m => addHit(m, 1.0));
            (ex.secondary || []).forEach(m => addHit(m, 0.45));
          });
        });

        Object.keys(stats).forEach(k => {
          stats[k].pct = Math.min(100, Math.round((stats[k].score / Math.max(1, targetFullScore)) * 100));
        });
        return stats;
      }

      function getMuscleColor(pct) {
        if (!pct || pct <= 0) return { fill: '#1c1d24', opacity: 1, glow: 'none', label: 'Не работала' };
        if (pct < 30)  return { fill: '#b45309', opacity: 0.72, glow: 'none', label: 'Лёгкий тонус' };
        if (pct < 55)  return { fill: '#f59e0b', opacity: 0.86, glow: 'none', label: 'Средний объём' };
        if (pct < 80)  return { fill: '#f97316', opacity: 0.94, glow: 'drop-shadow(0 0 6px rgba(249,115,22,0.45))', label: 'Высокий объём' };
        return { fill: '#ff2d55', opacity: 1, glow: 'drop-shadow(0 0 9px rgba(255,45,85,0.6))', label: 'Пиковая нагрузка' };
      }

      // ============================================================
      // 8. WORKOUT ACTIONS
      // ============================================================
      function calcWorkoutTotals(workout) {
        let totalSets = 0, doneSets = 0, doneReps = 0, tonnage = 0;
        (workout.exercises || []).forEach(ex => {
          (ex.sets || []).forEach(s => {
            if (s.isWarmup) return;
            totalSets++;
            if (s.done) {
              const r = Number(s.reps) || 0;
              const w = Number(s.weight) || 0;
              doneSets++;
              doneReps += r;
              tonnage += w * r;
            }
          });
        });
        return { totalSets, doneSets, doneReps, tonnage: Math.round(tonnage) };
      }

      function computeMonthStats(year, month) {
        const prefix = `${year}-${String(month + 1).padStart(2, '0')}-`;
        const list = state.history.filter(w => String(w.date || '').startsWith(prefix));
        let sets = 0, reps = 0, tonnage = 0;
        list.forEach(w => {
          const t = calcWorkoutTotals(w);
          sets += t.doneSets;
          reps += t.doneReps;
          tonnage += t.tonnage;
        });
        return { visits: list.length, sets, reps, tonnage };
      }

      function buildActiveExerciseFromTemplate(ex) {
        const lastSets = getLastLoggedSetsForExercise(ex.name);
        const count = Math.max(1, Number(ex.sets) || 3);
        const targetReps = parseTargetReps(ex.reps);
        const sets = Array.from({ length: count }, (_, idx) => {
          const prev = lastSets && lastSets[idx] ? lastSets[idx] : (lastSets && lastSets[0] ? lastSets[0] : null);
          return {
            id: uid('set'),
            weight: prev ? prev.weight : (Number(ex.defaultWeight) || 0),
            reps: prev ? prev.reps : targetReps,
            prevWeight: prev ? prev.weight : null,
            prevReps: prev ? prev.reps : null,
            rir: prev && prev.rir != null ? prev.rir : 2,
            isWarmup: false,
            done: false
          };
        });
        return {
          id: uid('wex'),
          programExId: ex.id || null,
          name: ex.name,
          targetReps: ex.reps || String(targetReps),
          restSec: ex.restSec || 90,
          note: ex.note || '',
          primary: (ex.primary || []).slice(),
          secondary: (ex.secondary || []).slice(),
          sets
        };
      }

      function startWorkout(dayId, targetDate) {
        const day = state.program.find(d => d.id === dayId);
        if (!day) return;
        const chosenDate = targetDate || formatDateISO(new Date());
        state.activeWorkout = {
          id: uid('wk'),
          dayId: day.id,
          dayName: day.name,
          dayColor: day.color || '#30d158',
          date: chosenDate,
          startedAt: Date.now(),
          exercises: day.exercises.map(buildActiveExerciseFromTemplate)
        };
        saveState();
        ensureWorkoutTimerRunning();
        ui.tab = 'workout';
        render();
        showToast(`${day.name} • ${formatDateRu(chosenDate)}`);
      }

      function startCustomWorkout(targetDate) {
        const chosenDate = targetDate || formatDateISO(new Date());
        state.activeWorkout = {
          id: uid('wk'),
          dayId: 'custom',
          dayName: 'Свободная тренировка',
          dayColor: '#bf5af2',
          date: chosenDate,
          startedAt: Date.now(),
          exercises: []
        };
        saveState();
        ensureWorkoutTimerRunning();
        ui.tab = 'workout';
        render();
        openActiveExercisePickerModal();
      }

      function editHistoryWorkout(workoutId) {
        const orig = state.history.find(w => w.id === workoutId);
        if (!orig) return;
        const clone = JSON.parse(JSON.stringify(orig));
        clone.editingHistoryId = orig.id;
        clone.startedAt = Date.now() - (Number(orig.durationSec) || 1800) * 1000;
        state.activeWorkout = clone;
        saveState();
        ensureWorkoutTimerRunning();
        ui.tab = 'workout';
        render();
        showToast(`Редактирование: ${orig.dayName} (${formatDateRu(orig.date)})`);
      }

      function toggleSetDone(exIdx, setIdx) {
        if (!state.activeWorkout) return;
        const ex = state.activeWorkout.exercises[exIdx];
        if (!ex || !ex.sets[setIdx]) return;
        const s = ex.sets[setIdx];
        s.done = !s.done;
        saveState();
        vibrate(s.done ? 25 : 10);

        if (s.done) {
          const restTime = s.isWarmup ? Math.min(60, ex.restSec || 60) : (ex.restSec || 90);
          startRestTimer(restTime);

          // Check PR against historical records
          if (!s.isWarmup && Number(s.weight) > 0 && Number(s.reps) > 0) {
            const prs = getHistoricalPRs(state.activeWorkout.editingHistoryId);
            const prevPr = prs[ex.name];
            const cur1RM = calcEpley1RM(s.weight, s.reps);
            if (prevPr && (Number(s.weight) > prevPr.maxWeight || cur1RM > prevPr.best1RM)) {
              showToast(`Новый рекорд! ${s.weight}кг×${s.reps} (1ПМ ~${cur1RM} кг)`, 'pr');
            }
          }
        }
        render();
      }

      function toggleSetWarmup(exIdx, setIdx) {
        if (!state.activeWorkout) return;
        const ex = state.activeWorkout.exercises[exIdx];
        if (!ex || !ex.sets[setIdx]) return;
        ex.sets[setIdx].isWarmup = !ex.sets[setIdx].isWarmup;
        saveState();
        render();
        showToast(ex.sets[setIdx].isWarmup ? 'Отмечен как разминочный (Р)' : 'Отмечен как рабочий подход');
      }

      function addWarmupSetToActive(exIdx) {
        if (!state.activeWorkout) return;
        const ex = state.activeWorkout.exercises[exIdx];
        if (!ex) return;
        const firstWork = ex.sets.find(s => !s.isWarmup) || ex.sets[0];
        const baseW = firstWork ? (Number(firstWork.weight) || 0) : 0;
        const warmupW = baseW > 0 ? Math.max(0, Math.round((baseW * 0.5) / 2.5) * 2.5) : 0;
        const insertIdx = ex.sets.findIndex(s => !s.isWarmup);
        const newSet = { id: uid('set'), weight: warmupW, reps: 10, rir: 3, isWarmup: true, done: false };
        if (insertIdx === -1) ex.sets.push(newSet);
        else ex.sets.splice(insertIdx, 0, newSet);
        saveState();
        render();
      }

      function updateSetField(exIdx, setIdx, field, value) {
        if (!state.activeWorkout) return;
        const ex = state.activeWorkout.exercises[exIdx];
        if (!ex || !ex.sets[setIdx]) return;
        if (field === 'weight') ex.sets[setIdx].weight = Math.max(0, Number(value) || 0);
        else if (field === 'reps') ex.sets[setIdx].reps = Math.max(0, Math.round(Number(value) || 0));
        else if (field === 'rir') {
          const idx = RIR_OPTIONS.findIndex(r => r.value === ex.sets[setIdx].rir);
          ex.sets[setIdx].rir = RIR_OPTIONS[(idx + 1) % RIR_OPTIONS.length].value;
          saveState();
          render();
          return;
        }
        saveState();
        updateActiveSummaryHeader();
      }

      function stepSetField(exIdx, setIdx, field, delta) {
        if (!state.activeWorkout) return;
        const ex = state.activeWorkout.exercises[exIdx];
        if (!ex || !ex.sets[setIdx]) return;
        const cur = Number(ex.sets[setIdx][field]) || 0;
        ex.sets[setIdx][field] = Math.max(0, Math.round((cur + delta) * 10) / 10);
        saveState();
        render();
      }

      function addSetToActive(exIdx) {
        if (!state.activeWorkout) return;
        const ex = state.activeWorkout.exercises[exIdx];
        if (!ex) return;
        const last = ex.sets[ex.sets.length - 1];
        ex.sets.push({
          id: uid('set'),
          weight: last ? last.weight : 0,
          reps: last ? last.reps : parseTargetReps(ex.targetReps),
          prevWeight: null, prevReps: null,
          rir: last ? last.rir : 2,
          isWarmup: false,
          done: false
        });
        saveState();
        render();
      }

      function removeSetFromActive(exIdx, setIdx) {
        if (!state.activeWorkout) return;
        const ex = state.activeWorkout.exercises[exIdx];
        if (!ex || ex.sets.length <= 1) return;
        ex.sets.splice(setIdx, 1);
        saveState();
        render();
      }

      function updateActiveSummaryHeader() {
        if (!state.activeWorkout) return;
        const totals = calcWorkoutTotals(state.activeWorkout);
        const volEl = document.getElementById('active-volume-val');
        const setsEl = document.getElementById('active-sets-val');
        const barEl = document.getElementById('active-progress-bar');
        if (volEl) volEl.textContent = `${totals.tonnage.toLocaleString('ru-RU')} кг`;
        if (setsEl) setsEl.textContent = `${totals.doneSets} / ${totals.totalSets}`;
        if (barEl) {
          const pct = totals.totalSets ? Math.round((totals.doneSets / totals.totalSets) * 100) : 0;
          barEl.style.width = `${pct}%`;
        }
      }

        const chipsHtml = Object.entries(MUSCLES).map(([k, m]) => `

        openModal('Добавить упражнение', `

                <div class="t-xs muted" style="margin-bottom:4px;">Вес (кг)</div>
                <input id="custom-ex-weight" type="number" step="0.5" min="0" value="20" class="field text-center" />
              </div>
            </div>
            <div>
              <div class="t-xs muted" style="margin-bottom:6px;">Целевые мышцы (для карты мышц)</div>
              <div class="flex flex-wrap gap-15">${chipsHtml}</div>

            <button id="add-custom-ex-btn" type="button" class="btn btn-primary w-full">Добавить в тренировку</button>

        document.querySelectorAll('.pick-lib-ex').forEach(btn => {
          btn.addEventListener('click', () => {
            const item = library[Number(btn.dataset.libIdx)];
            if (!item || !state.activeWorkout) return;
            state.activeWorkout.exercises.push(buildActiveExerciseFromTemplate(item.ex));
            saveState();
            closeModal();
            render();
            showToast(`Добавлено: ${item.ex.name}`);
          });
        });

        document.querySelectorAll('.cm-chip').forEach(b => {
          b.addEventListener('click', () => {
            const k = b.dataset.cm;
            if (selectedMuscles.has(k)) { selectedMuscles.delete(k); b.className = 'cm-chip pill'; }
            else { selectedMuscles.add(k); b.className = 'cm-chip pill pill-green'; }
          });
        });

        document.getElementById('add-custom-ex-btn').addEventListener('click', () => {
          const name = (document.getElementById('custom-ex-name').value || '').trim();
          if (!name) { showToast('Введите название упражнения', 'error'); return; }
          state.activeWorkout.exercises.push(buildActiveExerciseFromTemplate({
            name,
            sets: Math.max(1, parseInt(document.getElementById('custom-ex-sets').value, 10) || 3),
            reps: String(Math.max(1, parseInt(document.getElementById('custom-ex-reps').value, 10) || 10)),
            defaultWeight: Math.max(0, Number(document.getElementById('custom-ex-weight').value) || 0),
            restSec: 90,
            primary: Array.from(selectedMuscles),
            secondary: []
          }));
          saveState();
          closeModal();
          render();
          showToast(`Добавлено: ${name}`);
        });

          });

      function openFinishWorkoutModal() {
        if (!state.activeWorkout) return;
        const totals = calcWorkoutTotals(state.activeWorkout);
        const durationSec = Math.max(60, Math.floor((Date.now() - state.activeWorkout.startedAt) / 1000));

        openModal('Завершить тренировку', `
          <div class="grid-3 text-center">
            <div class="subcard">
              <div class="t-xs muted">Время</div>
              <div class="t-md fw-700 num" style="margin-top:2px;">${formatDuration(durationSec)}</div>
            </div>
            <div class="subcard">
              <div class="t-xs muted">Подходы</div>
              <div class="t-md fw-700 num c-green" style="margin-top:2px;">${totals.doneSets}/${totals.totalSets}</div>
            </div>
            <div class="subcard">
              <div class="t-xs muted">Тоннаж</div>
              <div class="t-md fw-700 num" style="margin-top:2px;">${totals.tonnage.toLocaleString('ru-RU')} кг</div>
            </div>
          </div>
          ${totals.doneSets === 0 ? `
            <div class="subcard" style="background:var(--amber-bg);border-color:var(--amber-border);color:#fde68a;font-size:12px;">
              Пока не отмечен ни один рабочий подход. Отметьте подходы галочкой «✓», чтобы они попали в статистику и карту мышц.
            </div>
          ` : ''}
          <div>
            <div class="t-xs muted" style="margin-bottom:6px;">Заметка к тренировке (необязательно)</div>
            <textarea id="finish-note-input" rows="2" placeholder="Самочувствие, прогрессия весов..." class="field">${escapeHtml(state.activeWorkout.note || '')}</textarea>
          </div>
          <button id="confirm-finish-btn" type="button" class="btn btn-primary w-full">Сохранить в календарь</button>
        `);

        document.getElementById('confirm-finish-btn').addEventListener('click', () => {
          const note = (document.getElementById('finish-note-input').value || '').trim();
          const editId = state.activeWorkout.editingHistoryId;
          const finished = Object.assign({}, state.activeWorkout, {
            finishedAt: Date.now(),
            durationSec,
            tonnage: totals.tonnage,
            doneSets: totals.doneSets,
            doneReps: totals.doneReps,
            totalSets: totals.totalSets,
            note
          });
          delete finished.editingHistoryId;

          if (editId) {
            const idx = state.history.findIndex(w => w.id === editId);
            if (idx >= 0) state.history[idx] = finished;
            else state.history.unshift(finished);
          } else {
            state.history.unshift(finished);
          }
          state.history.sort((a, b) => String(b.date || '').localeCompare(String(a.date || '')) || (b.finishedAt || 0) - (a.finishedAt || 0));

          ui.selectedDate = finished.date;
          state.activeWorkout = null;
          stopRestTimer();
          if (workoutTimerInterval) { clearInterval(workoutTimerInterval); workoutTimerInterval = null; }
          saveState();
          closeModal();
          ui.tab = 'history';
          render();
          showToast(editId ? 'Изменения в тренировке сохранены' : 'Тренировка сохранена в календарь!');
        });
      }

      function openCancelWorkoutModal() {
        openModal('Отменить тренировку?', `
          <div class="t-sm dim">Текущий прогресс этой сессии будет удалён без сохранения в историю.</div>
          <div class="flex gap-2">
            <button id="cancel-keep-btn" type="button" class="btn btn-secondary flex-1">Продолжить</button>
            <button id="cancel-confirm-btn" type="button" class="btn btn-danger flex-1">Удалить сессию</button>
          </div>
        `);
        document.getElementById('cancel-keep-btn').addEventListener('click', closeModal);
        document.getElementById('cancel-confirm-btn').addEventListener('click', () => {
          state.activeWorkout = null;
          stopRestTimer();
          if (workoutTimerInterval) { clearInterval(workoutTimerInterval); workoutTimerInterval = null; }
          saveState();
          closeModal();
          render();
          showToast('Тренировка отменена');
        });
      }

      function openModal(title, bodyHtml) {
        document.getElementById('modal-title').textContent = title;
        document.getElementById('modal-body').innerHTML = bodyHtml;
        document.getElementById('modal-overlay').classList.remove('hidden');
      }

      function closeModal() {
        document.getElementById('modal-overlay').classList.add('hidden');
      }

      // 10. TAB 1 — WORKOUT (MAIN SCREEN + LIVE LOGGER)
      // ============================================================
      function renderWorkoutTab(root) {
        const headerRight = document.getElementById('header-right');

        if (!state.activeWorkout) {
          document.getElementById('header-title').textContent = 'Тренировка';
          document.getElementById('header-subtitle').textContent = `Full Body • ${state.program.length} дн. в программе`;
          headerRight.innerHTML = `<button id="quick-edit-plan-btn" type="button" class="btn btn-secondary btn-xs">Изменить</button>`;
          document.getElementById('quick-edit-plan-btn').addEventListener('click', () => {
            ui.tab = 'profile'; ui.profileSubtab = 'program'; render();
          });

          const now = new Date();
          const monthNamesGen = ['январь', 'февраль', 'март', 'апрель', 'май', 'июнь', 'июль', 'август', 'сентябрь', 'октябрь', 'ноябрь', 'декабрь'];
          const mStats = computeMonthStats(now.getFullYear(), now.getMonth());
          const lastWorkout = state.history[0];
          const nextSuggested = lastWorkout && lastWorkout.dayId === 'day_a' && state.program.some(d => d.id === 'day_b')
            ? 'day_b'
            : (state.program[0] ? state.program[0].id : null);

          let html = `
            <div class="card flex-col gap-3">
              <div class="flex items-center justify-between">
                <div class="t-xs upper muted fw-600">Статистика за ${monthNamesGen[now.getMonth()]}</div>
                <button id="go-history-quick" type="button" class="t-xs fw-600 c-green flex items-center gap-1">
                  Календарь ${icon('chev-right', 14)}
                </button>
              </div>
              <div class="grid-2">
                <div class="subcard">
                  <div class="t-xs muted">В зале за месяц</div>
                  <div class="t-xl fw-700 num c-green" style="margin-top:2px;">${mStats.visits} <span class="t-xs muted fw-500">раз</span></div>
                </div>
                <div class="subcard">
                  <div class="t-xs muted">Поднято суммарно</div>
                  <div class="t-xl fw-700 num" style="margin-top:2px;">${mStats.tonnage >= 10000 ? (mStats.tonnage / 1000).toFixed(1) + ' т' : mStats.tonnage.toLocaleString('ru-RU') + ' кг'}</div>
                </div>
                <div class="subcard">
                  <div class="t-xs muted">Рабочих подходов</div>
                  <div class="t-lg fw-700 num" style="margin-top:2px;">${mStats.sets}</div>
                </div>
                <div class="subcard">
                  <div class="t-xs muted">Повторений</div>
                  <div class="t-lg fw-700 num" style="margin-top:2px;">${mStats.reps.toLocaleString('ru-RU')}</div>
                </div>
              </div>
              ${lastWorkout ? `
                <div class="divider flex items-center justify-between t-xs muted">
                  <span class="truncate">Последняя: <strong style="color:#e5e5ec;">${escapeHtml(lastWorkout.dayName)}</strong> (${formatDateRu(lastWorkout.date)})</span>
                  <span class="num shrink-0">${(lastWorkout.tonnage || 0).toLocaleString('ru-RU')} кг</span>
                </div>
              ` : ''}
            </div>
          `;

          state.program.forEach(day => {
            const isSuggested = day.id === nextSuggested;
            const totalSets = day.exercises.reduce((acc, ex) => acc + (Number(ex.sets) || 3), 0);
            const muscleSet = new Set();
            day.exercises.forEach(ex => (ex.primary || []).forEach(m => { if (MUSCLES[m]) muscleSet.add(MUSCLES[m].short); }));
            const muscleBadges = Array.from(muscleSet).slice(0, 5);

            html += `
              <div class="card flex-col gap-3 ${isSuggested ? 'card-highlight' : ''}">
                <div class="flex items-start justify-between gap-2">
                  <div class="flex-1">
                    <div class="flex items-center gap-2">
                      <span style="width:10px;height:10px;border-radius:999px;background:${day.color || '#30d158'};display:inline-block;"></span>
                      <span class="t-lg fw-700">${escapeHtml(day.name)}</span>
                      ${isSuggested ? `<span class="pill pill-green" style="font-size:10px;padding:2px 8px;">По плану</span>` : ''}
                    </div>
                    <div class="t-xs muted" style="margin-top:2px;">${escapeHtml(day.subtitle || `${day.exercises.length} упражнений`)}</div>
                  </div>
                  <span class="t-xs muted num shrink-0">${day.exercises.length} упр. • ${totalSets} подх.</span>
                </div>

                <div class="flex flex-wrap gap-15">
                  ${muscleBadges.map(m => `<span class="pill">${escapeHtml(m)}</span>`).join('')}
                </div>

                <div class="divider flex-col gap-15">
                  ${day.exercises.map((ex, i) => `
                    <div class="flex items-center justify-between t-xs">
                      <span class="dim truncate" style="padding-right:8px;">${i + 1}. ${escapeHtml(ex.name)}</span>
                      <span class="muted num shrink-0">${ex.sets}×${escapeHtml(ex.reps)}</span>
                    </div>
                  `).join('')}
                </div>

                <button type="button" data-start-day="${day.id}" class="start-day-btn btn w-full ${isSuggested ? 'btn-primary' : 'btn-secondary'}">
                  ${icon('play', 14)} <span>Начать ${escapeHtml(day.name)}</span>
                </button>
              </div>
            `;
          });

          html += `
            <button id="start-custom-today-btn" type="button" class="btn btn-dashed w-full t-xs">
              ${icon('plus-circle', 16)} <span>Собрать свободную тренировку на сегодня</span>
            </button>

            <div class="card" style="padding:0;overflow:hidden;">
              <button id="toggle-rules-btn" type="button" class="w-full flex items-center justify-between text-left" style="padding:14px 16px;">
                <div class="flex items-center gap-2">
                  <span class="muted">${icon('book', 15)}</span>
                  <span class="t-xs fw-600 dim">Памятка Full Body (RIR, отдых, прогрессия)</span>
                </div>
                <span class="muted">${icon(ui.showRulesCard ? 'chev-up' : 'chev-down', 15)}</span>
              </button>
              ${ui.showRulesCard ? `
                <div class="divider flex-col gap-2 t-xs muted" style="padding:10px 16px 16px;line-height:1.5;">
                  <div><strong style="color:#fff;">Запас повторений (RIR 2–3):</strong> первые 2–3 недели оставляйте 2–3 чистых повторения до отказа для адаптации связок.</div>
                  <div><strong style="color:#fff;">Отдых:</strong> тяжёлая база (присед, жим, тяга) — 2–2.5 мин; изоляция (махи, руки, пресс) — 1–1.5 мин.</div>
                  <div><strong style="color:#fff;">Прогрессия:</strong> добавляйте по 1–2 повторения или 1–2.5 кг от недели к неделе.</div>
                </div>
              ` : ''}
            </div>
          `;

          root.innerHTML = html;

          root.querySelectorAll('.start-day-btn').forEach(btn => {
            btn.addEventListener('click', () => startWorkout(btn.dataset.startDay));
          });
          document.getElementById('go-history-quick').addEventListener('click', () => { ui.tab = 'history'; render(); });
          document.getElementById('start-custom-today-btn').addEventListener('click', () => startCustomWorkout());
          document.getElementById('toggle-rules-btn').addEventListener('click', () => { ui.showRulesCard = !ui.showRulesCard; render(); });

        } else {
          // ACTIVE WORKOUT VIEW
          const wk = state.activeWorkout;
          const totals = calcWorkoutTotals(wk);
          const elapsed = Math.floor((Date.now() - wk.startedAt) / 1000);
          const pct = totals.totalSets ? Math.round((totals.doneSets / totals.totalSets) * 100) : 0;
          const isOtherDate = wk.date && wk.date !== formatDateISO(new Date());
          const histPRs = getHistoricalPRs(wk.editingHistoryId);

          document.getElementById('header-title').textContent = wk.dayName;
          document.getElementById('header-subtitle').innerHTML = `${isOtherDate ? `<span class="c-amber fw-600">${formatDateRu(wk.date)}</span> • ` : ''}<span id="active-workout-clock" class="num c-green fw-600">${formatDuration(elapsed)}</span> • <span id="active-sets-val" class="num">${totals.doneSets} / ${totals.totalSets}</span> подх.`;

          headerRight.innerHTML = `<button id="finish-wk-top-btn" type="button" class="btn btn-primary btn-xs">Готово</button>`;
          document.getElementById('finish-wk-top-btn').addEventListener('click', openFinishWorkoutModal);

          let html = `
            <div class="card flex-col gap-2" style="padding:14px 16px;">
              <div class="flex items-center justify-between t-xs">
                <span class="muted">Рабочий объём тренировки</span>
                <span id="active-volume-val" class="fw-700 num">${totals.tonnage.toLocaleString('ru-RU')} кг</span>
              </div>
              <div class="bar-track"><div id="active-progress-bar" class="bar-fill" style="width:${pct}%;"></div></div>
            </div>
          `;

          wk.exercises.forEach((ex, exIdx) => {
            const workSets = ex.sets.filter(s => !s.isWarmup);
            const doneCount = workSets.filter(s => s.done).length;
            const allDone = doneCount === workSets.length && workSets.length > 0;
            const noteOpen = !!ui.expandedNotes[ex.id];
            const muscleLabels = (ex.primary || []).map(m => MUSCLES[m] ? MUSCLES[m].short : m);
            const prevPr = histPRs[ex.name];
            const lastSessionSets = getLastLoggedSetsForExercise(ex.name, wk.editingHistoryId);

            // Live best 1RM in this exercise
            let bestCur1RM = 0;
            workSets.forEach(s => {
              if (s.done) bestCur1RM = Math.max(bestCur1RM, calcEpley1RM(s.weight, s.reps));
            });

            html += `
              <div class="card flex-col gap-3 ${allDone ? 'card-highlight' : ''}">
                <div class="flex items-start justify-between gap-2">
                  <div class="flex-1">
                    <div class="flex items-center flex-wrap gap-15">
                      <span class="pill ${allDone ? 'pill-green' : ''}" style="font-size:11px;padding:2px 8px;">${doneCount}/${workSets.length}</span>
                      <span class="t-xs muted">Цель: ${escapeHtml(ex.targetReps)} • ${ex.restSec}с</span>
                      ${prevPr ? `<span class="t-xs c-amber num">PR: ${prevPr.maxWeight}кг (1ПМ ~${prevPr.best1RM})</span>` : (bestCur1RM > 0 ? `<span class="t-xs muted num">1ПМ ~${bestCur1RM} кг</span>` : '')}
                    </div>
                    <div class="t-md fw-700" style="margin-top:6px;line-height:1.3;">${escapeHtml(ex.name)}</div>
                    <div class="flex flex-wrap gap-1" style="margin-top:6px;">
                      ${muscleLabels.map(ml => `<span class="pill" style="font-size:10px;padding:2px 7px;">${escapeHtml(ml)}</span>`).join('')}
                    </div>
                  </div>
                  <div class="flex items-center gap-1 shrink-0">
                    ${ex.note ? `<button type="button" data-toggle-note="${ex.id}" class="toggle-note-btn icon-btn" title="Техника">${icon('info', 15)}</button>` : ''}
                    <button type="button" data-edit-aex="${exIdx}" class="edit-aex-btn icon-btn" title="Изменить">${icon('pencil', 14)}</button>
                  </div>
                </div>

                ${ex.note && noteOpen ? `<div class="subcard t-xs dim" style="line-height:1.45;">${escapeHtml(ex.note)}</div>` : ''}

                <div class="set-grid t-xs upper faint fw-600 text-center" style="font-size:10px;padding:0 6px;">
                  <div>#</div><div>Вес (кг)</div><div>Повт.</div><div>Запас</div><div>✓</div>
                </div>

                <div class="flex-col gap-2">
                  ${(() => {
                    let workNum = 0;
                    return ex.sets.map((s, setIdx) => {
                      const isW = !!s.isWarmup;
                      if (!isW) workNum++;
                      const rirObj = RIR_OPTIONS.find(r => r.value === s.rir) || RIR_OPTIONS[0];
                      const rowCls = s.done ? (isW ? 'set-row done-warmup' : 'set-row done-work') : (isW ? 'set-row warmup' : 'set-row');
                      const chkCls = s.done ? (isW ? 'check-btn done-warmup' : 'check-btn done-work') : 'check-btn';

                      // Look up "previous session" hint for this working set index
                      let prevHint = '';
                      if (!isW) {
                        const prevSet = (s.prevWeight != null && s.prevReps != null)
                          ? { weight: s.prevWeight, reps: s.prevReps }
                          : (lastSessionSets && lastSessionSets[workNum - 1] ? lastSessionSets[workNum - 1] : null);
                        if (prevSet) prevHint = `прошл: ${prevSet.weight}×${prevSet.reps}`;
                      }

                      // Is this completed set a new PR?
                      const cur1RM = (!isW && s.done) ? calcEpley1RM(s.weight, s.reps) : 0;
                      const isPR = !isW && s.done && prevPr && (Number(s.weight) > prevPr.maxWeight || cur1RM > prevPr.best1RM);

                      return `
                        <div class="${rowCls}">
                          <div class="set-grid">
                            <button type="button" data-warmup="${exIdx}:${setIdx}" class="warmup-toggle-btn num fw-700" style="height:28px;width:26px;margin:0 auto;border-radius:8px;font-size:12px;${isW ? 'background:var(--amber-bg);color:#fbbf24;border:1px solid var(--amber-border);' : (s.done ? 'color:var(--green);' : 'color:var(--text-muted);')}">
                              ${isW ? 'Р' : workNum}
                            </button>

                            <div class="stepper">
                              <button type="button" data-step="${exIdx}:${setIdx}:weight:-2.5" class="step-btn">−</button>
                              <input type="number" step="0.5" min="0" value="${s.weight}" data-field="${exIdx}:${setIdx}:weight" class="set-input num" />
                              <button type="button" data-step="${exIdx}:${setIdx}:weight:2.5" class="step-btn">+</button>
                            </div>

                            <div class="stepper">
                              <button type="button" data-step="${exIdx}:${setIdx}:reps:-1" class="step-btn">−</button>
                              <input type="number" step="1" min="0" value="${s.reps}" data-field="${exIdx}:${setIdx}:reps" class="set-input num" />
                              <button type="button" data-step="${exIdx}:${setIdx}:reps:1" class="step-btn">+</button>
                            </div>

                            ${isW ? `
                              <button type="button" data-warmup="${exIdx}:${setIdx}" class="warmup-toggle-btn rir-btn c-amber" style="background:var(--amber-bg);border-color:var(--amber-border);">Разм.</button>
                            ` : `
                              <button type="button" data-rir="${exIdx}:${setIdx}" class="rir-btn ${s.rir === 0 ? 'c-red' : s.rir === 1 ? 'c-amber' : ''}">${rirObj.label}</button>
                            `}

                            <button type="button" data-check="${exIdx}:${setIdx}" class="set-check-btn ${chkCls}">
                              ${icon('check', 16, 3)}
                            </button>
                          </div>
                          ${(prevHint || isPR) ? `
                            <div class="flex items-center justify-between" style="padding:4px 4px 0 34px;font-size:10px;">
                              <span class="faint num">${escapeHtml(prevHint)}</span>
                              ${isPR ? `<span class="c-amber fw-700 flex items-center gap-1">${icon('trophy', 11)} PR • 1ПМ ~${cur1RM} кг</span>` : ''}
                            </div>
                          ` : ''}
                        </div>
                      `;
                    }).join('');
                  })()}
                </div>

                <div class="flex items-center justify-between gap-2">
                  <div class="flex items-center gap-15">
                    <button type="button" data-add-set="${exIdx}" class="add-set-btn btn btn-xs" style="background:var(--green-bg);color:var(--green);">
                      ${icon('plus', 13)} Подход
                    </button>
                    <button type="button" data-add-warmup="${exIdx}" class="add-warmup-btn btn btn-xs" style="background:var(--amber-bg);color:#fbbf24;border:1px solid var(--amber-border);">
                      ${icon('flame', 12)} Разм.
                    </button>
                  </div>
                  ${ex.sets.length > 1 ? `<button type="button" data-rm-set="${exIdx}" class="rm-set-btn t-xs muted" style="padding:6px 8px;">Убрать</button>` : ''}
                </div>
              </div>
            `;
          });

          if (wk.exercises.length === 0) {
            html += `
              <div class="card text-center flex-col gap-2" style="padding:24px 16px;">
                <div class="t-sm fw-600 dim">Упражнений пока нет</div>
                <div class="t-xs muted">Добавьте упражнения из программы или создайте свои, чтобы записывать подходы и повторения.</div>
              </div>
            `;
          }

          html += `
            <div class="flex-col gap-25" style="padding-top:4px;">
              <button id="add-active-ex-btn" type="button" class="btn btn-dashed w-full t-xs c-green">
                ${icon('plus', 15)} Добавить упражнение в тренировку
              </button>
              <button id="finish-wk-bottom-btn" type="button" class="btn btn-primary w-full">
                ${wk.editingHistoryId ? 'Сохранить изменения' : 'Завершить и сохранить тренировку'}
              </button>
              <button id="cancel-wk-btn" type="button" class="btn btn-secondary w-full t-xs c-red">
                Отменить тренировку
              </button>
            </div>
          `;

          root.innerHTML = html;

          root.querySelectorAll('.toggle-note-btn').forEach(btn => {
            btn.addEventListener('click', () => { ui.expandedNotes[btn.dataset.toggleNote] = !ui.expandedNotes[btn.dataset.toggleNote]; render(); });
          });
          root.querySelectorAll('.edit-aex-btn').forEach(btn => {
            btn.addEventListener('click', () => openActiveExerciseEditModal(Number(btn.dataset.editAex)));
          });
          root.querySelectorAll('.set-check-btn').forEach(btn => {
            btn.addEventListener('click', () => { const [e, s] = btn.dataset.check.split(':').map(Number); toggleSetDone(e, s); });
          });
          root.querySelectorAll('.set-input').forEach(inp => {
            inp.addEventListener('input', () => { const [e, s, f] = inp.dataset.field.split(':'); updateSetField(Number(e), Number(s), f, inp.value); });
          });
          root.querySelectorAll('.step-btn').forEach(btn => {
            btn.addEventListener('click', () => { const [e, s, f, d] = btn.dataset.step.split(':'); stepSetField(Number(e), Number(s), f, Number(d)); });
          });
          root.querySelectorAll('.rir-btn').forEach(btn => {
            btn.addEventListener('click', () => { const [e, s] = btn.dataset.rir.split(':').map(Number); updateSetField(e, s, 'rir', null); });
          });
          root.querySelectorAll('.warmup-toggle-btn').forEach(btn => {
            btn.addEventListener('click', () => { const [e, s] = btn.dataset.warmup.split(':').map(Number); toggleSetWarmup(e, s); });
          });
          root.querySelectorAll('.add-set-btn').forEach(btn => {
            btn.addEventListener('click', () => addSetToActive(Number(btn.dataset.addSet)));
          });
          root.querySelectorAll('.add-warmup-btn').forEach(btn => {
            btn.addEventListener('click', () => addWarmupSetToActive(Number(btn.dataset.addWarmup)));
          });
          root.querySelectorAll('.rm-set-btn').forEach(btn => {
            btn.addEventListener('click', () => { const e = Number(btn.dataset.rmSet); removeSetFromActive(e, state.activeWorkout.exercises[e].sets.length - 1); });
          });
          document.getElementById('add-active-ex-btn').addEventListener('click', openActiveExercisePickerModal);
          document.getElementById('finish-wk-bottom-btn').addEventListener('click', openFinishWorkoutModal);
          document.getElementById('cancel-wk-btn').addEventListener('click', openCancelWorkoutModal);
        }
      }

      function renderMusclesTab(root) {
        document.getElementById('header-title').textContent = 'Карта мышц';

        const muscleStats = computeMuscleStats(ui.muscleScope);
        const sortedMuscles = Object.values(muscleStats).sort((a, b) => b.pct - a.pct || b.effectiveSets - a.effectiveSets);
        const workedCount = sortedMuscles.filter(m => m.pct > 0).length;
        const isPreview = ui.muscleScope.startsWith('preview_');

        const scopes = [];
        if (state.activeWorkout) scopes.push({ id: 'active', label: 'Сейчас' });
        scopes.push({ id: '7d', label: '7 дней' }, { id: '30d', label: '30 дней' }, { id: 'all', label: 'Всё время' }, { id: 'preview_week', label: 'План А+Б' });

        let html = `
          <div class="h-scroll">
            ${scopes.map(sc => `
              <button type="button" data-scope="${sc.id}" class="scope-btn btn btn-sm shrink-0" style="${ui.muscleScope === sc.id ? 'background:#fff;color:#000;' : 'background:#14141a;color:#9b9ba8;border:1px solid #23232c;'}">
                ${escapeHtml(sc.label)}
              </button>
            `).join('')}
          </div>

        if (!isPreview && workedCount === 0) {
          html += `
            <div class="card flex items-center justify-between gap-25" style="padding:12px 14px;">
              <div class="t-xs muted">За выбранный период нет рабочих подходов. Посмотрите охват программы или начните тренировку.</div>

        if (isPreview) {
          html += `
            <div class="flex items-center justify-between gap-2">
              <span class="t-xs c-amber">Предпросмотр программы:</span>
              <div class="flex gap-1">
                ${state.program.map(d => `
                  <button type="button" data-scope="preview_${d.id}" class="scope-btn btn btn-xs" style="${ui.muscleScope === 'preview_' + d.id ? 'background:var(--amber);color:#000;' : 'background:#1a1a22;color:#a5a5b2;'}">
                    ${escapeHtml(d.name)}
                  </button>

        html += `
          <div class="card flex-col gap-3">

              <div class="flex justify-between t-xs muted" style="font-size:10px;margin-bottom:6px;">
                <span>Отдых (0%)</span><span>Средний объём</span><span>Пик (100%)</span>
              </div>
              <div style="height:8px;border-radius:999px;background:linear-gradient(90deg,#1c1d24 0%,#b45309 30%,#f59e0b 55%,#f97316 78%,#ff2d55 100%);"></div>
              <div class="t-xs faint text-center" style="margin-top:8px;">Нажмите на любую мышцу для деталей объёма</div>
            </div>
          </div>
        `;

        if (ui.selectedMuscle && muscleStats[ui.selectedMuscle]) {
          const ms = muscleStats[ui.selectedMuscle];
          const col = getMuscleColor(ms.pct);
          const exEntries = Object.entries(ms.exercises);
          html += `
            <div class="card flex-col gap-3" style="border-color:rgba(255,255,255,0.22);">
              <div class="flex items-center justify-between gap-2">
                <div class="flex items-center gap-2">
                  <span style="width:10px;height:10px;border-radius:999px;background:${col.fill};"></span>
                  <span class="t-md fw-700">${escapeHtml(ms.name)}</span>
                </div>
                <span class="pill" style="color:${ms.pct > 0 ? col.fill : '#8e8e98'};">${ms.pct}% • ${col.label}</span>
              </div>
              <div class="grid-2">
                <div class="subcard">
                  <div class="t-xs muted">Эффект. подходов</div>
                  <div class="t-md fw-700 num" style="margin-top:2px;">${ms.effectiveSets.toFixed(1)}</div>
                </div>
                <div class="subcard">
                  <div class="t-xs muted">Объём (тоннаж)</div>
                  <div class="t-md fw-700 num" style="margin-top:2px;">${ms.tonnage.toLocaleString('ru-RU')} кг</div>
                </div>
              </div>
              ${exEntries.length ? `
                <div class="divider flex-col gap-15">
                  <div class="t-xs upper muted">Упражнения</div>
                  ${exEntries.map(([exName, info]) => `
                    <div class="flex items-center justify-between t-xs">
                      <span class="dim truncate" style="padding-right:8px;">${escapeHtml(exName)}</span>
                      <span class="muted num shrink-0">${info.sets} подх. (${info.role})</span>

              ` : `<div class="t-xs faint">Эта группа не получала нагрузку за выбранный период.</div>`}
